openapi: 3.0.3
info:
  title: Task App API
  version: 0.14.0
  description: |
    ## Changes in 0.14.0 (due times, reminders, notifications, specs/due-times-reminders.md Part A / T4a)
    Additive. Clients that never send `dueTime` or `reminder` behave as before.
    - `Task` gains `dueTime` (`"HH:mm"` or `null`), `myReminder` (my reminder offset or `null`)
      and `myReminderPassed`, always present. `PUT /api/tasks/{id}` gains `dueTime` and
      `reminder`. See "Due times and reminders".
    - `User` gains `timeZone` (IANA region id or `null`) and `reminderEmails` (boolean), always
      present.
    - New endpoints (tag `account`): `PUT /api/account/time-zone`,
      `PUT /api/account/reminder-emails`. Both return the updated `User`.
    - New endpoints (tag `notifications`): `GET /api/notifications`,
      `GET /api/notifications/count`, `POST /api/notifications/{id}/read`,
      `POST /api/notifications/read-all`.
    - `GET /api/tasks?sort=due` now also orders by `dueTime` inside a date. Cursors issued
      before 0.14.0 give `INVALID_CURSOR` once (cursor version 3).
    - New error codes: `REQUIRES_DUE_DATE`, `INVALID_REMINDER`, `INVALID_TIME_ZONE` (field
      errors inside 400 `VALIDATION_FAILED`), `NOTIFICATION_NOT_FOUND` (404). New `FieldError.field`
      values `dueTime`, `reminder`, `timeZone`, `enabled`, `limit`.
    - New rate limit: a silent cap on reminder emails per account (see "Rate limiting").
    - **One-off effects at deploy:** every existing user has `timeZone: null` and
      `reminderEmails: true`; every existing task has `dueTime: null`, `myReminder: null`.

    ## Due times and reminders (0.14.0)
    - **Due time** is a wall-clock value (`"09:30"`), like `dueDate`: no zone is stored with it
      and the server never converts it. Every member of a shared list sees the same date and
      time, and "09:30" means 09:30 in each member's **own** time zone (for display, for
      "overdue" and for their own reminder). A time only exists together with a `dueDate`.
    - **Time zone.** `User.timeZone` is an IANA region id such as `Europe/Bucharest` (or `UTC`);
      offsets (`+02:00`, `UTC+2`) and abbreviations (`EST`) are not accepted. `null` until the
      client sets it. The client sets it once with `PUT /api/account/time-zone` +
      `ifUnset: true` (atomic: only if still empty), and the user can change it in Account.
      Until a zone is set the server computes that user's reminder times in UTC and recomputes
      them when the zone is set.
    - **One reminder per user per task**, other members never see it. `Task.myReminder` is the
      caller's own. Offsets (`ReminderOffset`): a **timed** task (has `dueTime`) accepts
      `AT_DUE`, `TEN_MINUTES`, `ONE_HOUR`, `ONE_DAY` (the same time on the previous calendar
      day); a **date-only** task accepts `ON_THE_DAY` (09:00 that day) and `ONE_DAY` (09:00 the
      day before). The fire time is computed in the reminder owner's zone. A wall-clock time in
      a daylight-saving gap (it does not exist) counts as the moment the clocks jump; one in an
      overlap (it happens twice) counts as the first time.
    - **Recomputed** whenever the task's `dueDate` or `dueTime` changes (for every member who
      has a reminder on it, each in their zone), the reminder offset changes, or the owner's
      zone changes. A reminder that already fired fires again only if its new fire time is in
      the future. A fire time already in the past when saved (or recomputed) is kept but never
      fires: `myReminderPassed` is `true`.
    - **Clearing `dueDate`** removes `dueTime` and **every member's** reminder on the task (they
      have nothing to fire on). A change from timed to date-only (or back) removes the
      reminders whose offset no longer fits (the caller's included, unless the same request
      sets a fitting one).
    - **When it fires** (checked every minute or so): once, if at that moment the task still
      exists, is not `DONE`, and the user is still a member of its list; otherwise it is
      dropped silently. A reminder more than 5 minutes late is flagged `late`; one that is 1
      hour or more late (e.g. the server was down) is dropped without a notification or email.
      Firing creates an in-app notification always, and an email only if the account is not
      disabled, its email is verified, `reminderEmails` is on and the cap below allows it. The
      email never contains the description.
    - **Notifications** are kept 90 days, newest first. Admins cannot see anyone's reminders or
      notifications. Another user's notification id answers 404 like an unknown one.

    ## Changes in 0.13.0 (sharing, specs/sharing-team-lists.md Part B / T3b)
    Additive, except that `GET /api/lists` loses `maxItems: 50` (it now also returns lists shared
    with me). See "Sharing".
    - **Access is by membership.** Wherever this document says "my lists", "one of my lists" or
      "the signed-in user's lists" (including `?list=`, `listId` in task bodies, every task and
      tag endpoint and `GET /api/lists/{id}`), it now means **a list I'm a member of**, owned
      or shared. Anything about a list I'm not a member of (never was, left, was removed, the
      list was deleted) is still **404**, never 403.
    - `TaskList` (and so `TaskListDetails`) gains `role` (`OWNER` | `MEMBER`) and `memberCount`
      (1-20, owner included), always present.
    - `Task` gains `addedBy`: `{ "displayName": "Ana" }` of the person who added the task, or
      `null` if that account was deleted. Always present.
    - `PATCH` and `DELETE /api/lists/{id}` are owner-only: a member gets **403 `OWNER_ONLY`**.
    - New endpoints (tag `lists`): `GET /api/lists/{id}/members`,
      `DELETE /api/lists/{id}/members/{userId}`, `POST /api/lists/{id}/leave`,
      `GET` / `POST /api/lists/{id}/invitations`,
      `DELETE /api/lists/{id}/invitations/{invitationId}`.
    - New endpoints (tag `invitations`): `GET /api/invitations`, `GET /api/invitations/count`,
      `POST /api/invitations/{id}/accept`, `POST /api/invitations/{id}/decline`.
    - New schemas `ListRole`, `Member`, `ListInvitation`, `MyInvitation`,
      `CreateInvitationRequest`, `InvitationCount`.
    - New error codes: `OWNER_ONLY` (403), `OWNER_CANNOT_LEAVE`, `ALREADY_MEMBER`,
      `ALREADY_INVITED`, `MEMBER_LIMIT`, `INVITATION_LIMIT` (409), `MEMBER_NOT_FOUND`,
      `INVITATION_NOT_FOUND` (404). `PERSONAL_LIST` is also returned when inviting to "My
      tasks". `FieldError.field` `email` is also used by the invite endpoint.
    - New rate limits (see "Rate limiting"): invitations per inviter, and a silent cap on
      invitation emails per recipient.
    - Account deletion (`POST /api/account/delete`, `DELETE /api/admin/users/{id}`): tasks the
      user added to other people's lists stay (`addedBy: null`), and so do those lists' tags.
      Their memberships and pending invitations to their address go; lists they own are
      deleted for every member.
    - **One-off effects at deploy:** every existing list has exactly one member, its owner
      (`role: OWNER`, `memberCount: 1`). Every existing task has `addedBy` = its list's owner.

    ## Sharing (0.13.0)
    - **Roles.** The owner (`lists.owner`, never changes, no transfer) and members. Both can
      read the list, its members and its tasks, and add, edit, tick, move (between lists they
      are a member of) and delete any task and use the list's tags. Only the owner can rename or
      delete the list, invite, see or cancel pending invitations and remove members (a member
      gets 403 `OWNER_ONLY`; a non-member always 404). A member can leave
      (`POST /api/lists/{id}/leave`); the owner can't (409 `OWNER_CANNOT_LEAVE`), only delete.
      "My tasks" can't be shared: it always has only its owner.
    - **Limits.** At most 20 members per list (owner included) and 20 pending invitations per
      list. The 50-list limit still counts only lists I own; there is no limit on lists shared
      with me.
    - **Invitations.** The owner invites an email address. The answer is **always** 201 with the
      invitation shown as pending, and it is stored the same way, **whether or not an account
      has that address**; nothing in any response tells the difference. An email is sent (in
      the background, after the response) only if an active (not disabled) account has that
      address, verified or not. An invitation expires 14 days after it was sent (`expiresAt`);
      expired invitations are not listed or counted and can't be accepted. Accepting, declining
      or cancelling removes it. Inviting an address again after its invitation expired
      refreshes that invitation (same `id`, new `invitedAt` / `expiresAt`). Note: once the
      invitee declines or accepts, the invitation disappears from the owner's pending list.
    - **Who sees an invitation.** It is matched by email (ignoring letter case and accents, like
      login) every time the invitee reads or accepts it, and **only for accounts whose email is
      verified** (`User.emailVerified`). So someone who registers after being invited, and
      confirms their email within the 14 days, sees it too (they get no email). For an
      unverified account, `GET /api/invitations` is `[]`, the count is 0, and accept/decline
      give 404 `INVITATION_NOT_FOUND`: the frontend uses `GET /api/auth/me` `emailVerified` to
      tell the user to confirm their email first.
    - **Invitation email.** Subject "<owner display name> invited you to a list on Task App".
      The body names the owner and the list (quoted, plain text) and links to
      `<APP_BASE_URL>/invitations` (no token, no id: access comes from the signed-in session
      and the verified email). The frontend opens its invitations page after sign-in when that
      link was followed while signed out.
    - **Members' details.** Members of a list see each other's display name, email and role
      (`GET /api/lists/{id}/members`), only there. The invitee sees only the owner's display
      name and the list's name. Admins see only their own lists, like any user.
    - **Leaving, removal, deletion.** A member who leaves or is removed gets 404 on their next
      request for that list or its tasks; tasks they added stay (with their display name in
      `addedBy`). A request already running when they were removed may still finish.
      Deleting an account keeps the tasks it added to other people's lists (`addedBy: null`) and
      those lists' tags; its own lists are deleted for every member.
    - **Editing together.** Last write wins, no version check (409). If one member deletes a task
      while another saves it, the saver gets 404 `NOT_FOUND`. No live updates: others' changes
      show after a reload or "Load more".

    ## Changes in 0.12.0 (lists, specs/sharing-team-lists.md Part A / T3a)
    Tasks and tags now live in **lists**. Nothing is shared yet: every list has one owner and
    only the owner can see or change it, its tasks or its tags (anything else answers 404, never
    403). See "Lists".
    - New endpoints (tag `lists`): `GET /api/lists`, `POST /api/lists`, `GET /api/lists/{id}`,
      `PATCH /api/lists/{id}` (rename), `DELETE /api/lists/{id}`.
    - New schemas `TaskList`, `TaskListDetails`, `CreateListRequest`, `RenameListRequest`.
    - `Task` gains `listId` (always present). `CreateTaskRequest` and `ReplaceTaskRequest` gain
      an optional `listId`: on `POST` it picks the list (missing or `null` → "My tasks"); on
      `PUT` a different list of mine **moves** the task (missing or `null` → unchanged). There is
      no separate move endpoint.
    - New query parameter `list` on `GET /api/tasks` and `GET /api/tags`. Missing or empty →
      "My tasks", so calls without it keep working (they return only "My tasks").
    - Tags belong to a list (see "Tags"): the same name can exist in two lists, the 200-tag limit
      is per list, `GET /api/tags` returns one list's tags and `?tag=` filters inside the list.
      The `TAG_LIMIT` message is now "A list can have at most 200 tags".
    - Page cursors now also carry the list (cursor version 2). A cursor issued for another list
      is rejected with the existing `cursor` / `INVALID_CURSOR`.
    - New error codes: `LIST_NOT_FOUND` (404), `LIST_LIMIT` (409), `PERSONAL_LIST` (409). A
      missing task stays `NOT_FOUND`. `FieldError.field` gains `name`.
    - **One-off effects at deploy:** every cursor issued by 0.11.0 gives 400 `INVALID_CURSOR`
      once (the client reloads from the first page, as for any invalid cursor). Every existing
      task and tag is on its owner's "My tasks".

    ## Lists (0.12.0)
    - Every user has exactly one **personal** list (`personal: true`), created with the account
      (email register and Google sign-up) and named "My tasks". Existing users got one holding
      all their tasks and tags. It can be renamed but not deleted (409 `PERSONAL_LIST`). It is
      the default wherever a list is optional ("My tasks" below means this list, whatever its
      current name).
    - A user can own at most **50 lists, "My tasks" included** (409 `LIST_LIMIT` on the 51st).
    - Names: same trimming and length counting as task titles (Java `String.strip()`, then 1-100
      UTF-16 code units). Duplicate names are allowed (lists are identified by `id`).
    - A list, its tasks or its tags that are not the signed-in user's (unknown id, another
      user's list, a deleted list) always give **404 `LIST_NOT_FOUND`**, never 403, with the
      same body in every case. Admins see only their own lists, like any user. (0.13.0: "the
      signed-in user's" means "a list I'm a member of", see "Sharing".)
    - Deleting a list deletes its tasks and its tags. Deleting an account deletes all the
      lists it owns (0.13.0: tasks it added to other people's lists stay).

    ## Changes in 0.11.0 (tasks search, sort and pagination, specs/tasks-search-sort-pagination.md)
    **Breaking (approved):** `GET /api/tasks` returns a `TaskPage` object
    (`{ items, total, nextCursor }`) instead of a bare `Task[]`. Only our own frontend uses it.
    - New query parameters on `GET /api/tasks`: `q` (search title and description), `sort`
      (`newest` | `oldest` | `due` | `priority` | `title`) and `cursor` (keyset paging, 50 tasks
      per page, fixed). `filter` and `tag` keep their meaning; an unknown `filter` or `sort` is
      still the default, never a 400. An unknown or invalid `tag` gives an empty page.
    - New 400s on `GET /api/tasks` (`VALIDATION_FAILED`): `q` / `TOO_LONG` (over 100 characters
      after trimming, same rule as the admin search) and `cursor` / `INVALID_CURSOR`.
    - New schema `TaskPage`. New field code `INVALID_CURSOR`; `FieldError.field` gains `cursor`.
    - Every other task endpoint is unchanged.

    ## Changes in 0.10.0 (task priority, status and tags, specs/tasks-priority-status-tags.md)
    Additive only: nothing renamed or removed.
    - `Task` gains `priority` (`NONE` | `LOW` | `MEDIUM` | `HIGH`, see `Priority`), `status`
      (`TODO` | `IN_PROGRESS` | `DONE`, see `Status`) and `tags` (array of tag names), always
      present. `done` stays and is now a **read-only mirror** of `status == DONE`: the two never
      disagree. Existing tasks: priority `NONE`, no tags, status `DONE` if done else `TODO`.
    - `POST /api/tasks`: unchanged. New tasks are always `NONE` / `TODO` / `[]`; `priority`,
      `status` and `tags` in the body are ignored (like `done`).
    - `PUT /api/tasks/{id}`: `done` is **no longer required**. New optional `priority`, `status`
      and `tags`; a missing or `null` one leaves the stored value unchanged, `tags: []` removes
      all tags. See the operation for how `done` and `status` combine.
    - `PATCH /api/tasks/{id}`: accepts `{done}` and/or `{status}` (at least one).
    - `GET /api/tasks`: `filter` gains `in_progress`; new `tag` query parameter. Still a bare
      `Task[]` with the same sort.
    - New `GET /api/tags`: the signed-in user's tags as `Tag` objects (`[{"name": "Work"}]`), for
      suggestions. `Task.tags` stays a plain array of names. A tag is deleted
      automatically when no task uses it any more.
    - New field codes: `INVALID_CHARACTERS`, `TOO_MANY`, `TAG_LIMIT`, `STATUS_CONFLICT`
      (`TOO_LONG` and `REQUIRED` also apply to `tags`). `FieldError.field` gains `status` and
      `tags`.

    ## Tags
    A tag belongs to one **list** (changed in 0.12.0: it belonged to the user) and is never
    visible to anyone else (admins included). Each list has its own tags: the same name can
    exist in two lists as two separate tags, a tag of one list is never returned, suggested or
    matched in another. Rules, applied by the server to every tag name it receives (`PUT`
    `tags[]`, `GET /api/tasks?tag=`), always inside one list:
    1. Rejected if it contains a comma (`,`) or a control character (Unicode category Cc, e.g.
       tab or newline), anywhere.
    2. Normalised: leading/trailing whitespace removed and every inner run of whitespace
       collapsed to one space (U+0020). "Whitespace" here is Java `Character.isWhitespace` or
       a Unicode space separator (so no-break spaces count too). Emoji and accents are kept.
    3. Length after normalising: 1-30 UTF-16 code units (JS `.length`). Blank → error.
    4. Two names are the same tag when they are equal **ignoring letter case and accents**
       (MySQL `utf8mb4_0900_ai_ci`, the same rule as display names): `Work` = `work` = `wörk`.
       The spelling stored is the first one used in that list; sending another variant reuses
       the list's existing tag and keeps its spelling.
    5. At most 10 different tags per task and at most 200 different tags per list (0.12.0: was
       per user).
    6. A tag no task in its list uses is deleted automatically in the same request that made it
       unused (removing it from its last task, deleting that task, or moving that task to
       another list). Adding it again later creates it with the spelling sent then.

    Order: wherever tags are returned (`Task.tags`, `GET /api/tags` by `name`) they are sorted
    alphabetically ignoring case and accents (`utf8mb4_0900_ai_ci` order). Clients should show
    it as returned.

    ## Changes in 0.9.0 (roles and admin users, specs/roles-admin.md)
    - `User` gains `role` (`USER` | `ADMIN` | `SUPER_ADMIN`, see `Role`), always present in every
      response that returns a `User`. Added, nothing renamed. Existing and new accounts are `USER`.
    - New endpoints under `/api/admin/users` (tag `admin`), for `ADMIN` and `SUPER_ADMIN` only:
      `GET /api/admin/users` (paged list and search), `POST /api/admin/users/{id}/disable`,
      `POST /api/admin/users/{id}/enable`, `POST /api/admin/users/{id}/revoke-sessions`,
      `PUT /api/admin/users/{id}/role` and `DELETE /api/admin/users/{id}`. See "Admin".
    - Disabled accounts (see "Disabled accounts"): a session of a disabled account ends on its
      next request with **401 `ACCOUNT_DISABLED`**; `POST /api/auth/login` with the correct
      password answers **403 `ACCOUNT_DISABLED`** (a wrong password still gets the usual 401
      `INVALID_CREDENTIALS`); Google sign-in redirects to `/login?oauth=account_disabled`
      (new `OAuthResult` value); forgot password sends no email; reset links stop working.
    - New error codes: `ACCOUNT_DISABLED` (401 / 403), `CANNOT_MODIFY_SELF` (409),
      `INSUFFICIENT_ROLE` (403), `USER_NOT_FOUND` (404). New field codes: `INVALID_ROLE`,
      `OUT_OF_RANGE`.
    - A role change takes effect on the user's next request (no new sign-in needed): their
      access to `/api/admin/**` follows the new role right away, and `GET /api/auth/me` returns
      the new `role`.

    ## Changes in 0.8.0 (sign in with Google, specs/google-sign-in.md)
    - `User` gains `hasPassword` (boolean) and `connections` (array of `Connection`), always
      present in every response that returns a `User`: `GET /api/auth/me`,
      `POST /api/auth/register`, `POST /api/auth/login`, `PUT /api/account/display-name` and the
      new `DELETE /api/account/connections/google`. Added, nothing renamed.
    - New public endpoints: `GET /api/auth/providers`,
      `POST /api/auth/oauth2/authorization/google` (starts the Google flow; a browser form
      submission, not an XHR) and `GET /api/auth/oauth2/callback/google` (Google redirects the
      browser here). See "Sign in with Google".
    - New signed-in endpoint: `DELETE /api/account/connections/google` (200 with the updated
      `User`).
    - `POST /api/account/delete`: accounts without a password confirm with `email` instead of
      `password` (see `DeleteAccountRequest`).
    - `PUT /api/account/password`: 409 `PASSWORD_REQUIRED` for accounts without a password.
    - `POST /api/auth/login`: accounts without a password always get the usual 401
      `INVALID_CREDENTIALS` (same body and timing as a wrong password).
    - New error codes: `PASSWORD_REQUIRED` (409), `EMAIL_MISMATCH` (400, also a field code).

    ## Changes in 0.7.0 (email verification and password reset, specs/email-auth.md)
    - `User` gains `emailVerified` (boolean, always present) in every response that returns a
      `User`: `GET /api/auth/me`, `POST /api/auth/register`, `POST /api/auth/login`,
      `PUT /api/account/display-name`. Added, nothing renamed.
    - New public endpoints: `POST /api/auth/verify-email`, `POST /api/auth/forgot-password`,
      `POST /api/auth/check-reset-token`, `POST /api/auth/reset-password`.
    - New signed-in endpoint: `POST /api/account/resend-verification`.
    - New error codes: `TOKEN_INVALID` (400), `ALREADY_VERIFIED` (409).
    - Register now also sends a confirmation email (in the background; the 201 response is
      unchanged and never fails because of email).

    ## Authentication
    Session-cookie auth (Spring Security). A successful `register` or `login` creates a server-side
    session and sets the `JSESSIONID` cookie (HttpOnly, Path=/, SameSite=Lax). Sessions expire after
    30 minutes of inactivity. All `/api/**` endpoints require a session except
    `GET /api/health`, `POST /api/auth/register`, `POST /api/auth/login`, `POST /api/auth/logout`,
    `POST /api/auth/verify-email`, `POST /api/auth/forgot-password`,
    `POST /api/auth/check-reset-token`, `POST /api/auth/reset-password`,
    `GET /api/auth/providers`, `POST /api/auth/oauth2/authorization/google`,
    `GET /api/auth/oauth2/callback/google` and `GET /api/auth/me`
    (which answers 401 when not signed in rather than being blocked).
    A successful Google sign-in (see "Sign in with Google") creates the same kind of session as
    a password login without `rememberMe`.

    **Public endpoints never answer 401**, whatever cookies the request carries: a stale,
    expired or ended session, or a rejected `remember-me` cookie, simply makes the request
    anonymous (a rejected `remember-me` cookie is expired on the response) and the endpoint
    answers normally. They still require the CSRF header (403 `CSRF_INVALID` otherwise).
    Unauthenticated calls to protected endpoints return **401** `application/problem+json`.
    There are never redirects to an HTML login page.

    **The session's user is re-checked on every request.** For each request that carries a
    signed-in session, the server loads that user by id from the database (one primary-key
    lookup) before authorization runs:
    - User no longer exists (account deleted, e.g. from another tab or device): the session is
      invalidated and the request is treated as anonymous, so protected endpoints answer **401**
      `UNAUTHENTICATED` (public endpoints such as `POST /api/auth/logout` still work). Such a
      session can never create data for a deleted account.
    - User exists but `email` or `displayName` differ from what the session holds (e.g. the
      display name was changed in another session): the session's user is refreshed with the
      current values. `GET /api/auth/me` therefore always returns current data.
    - The session was ended by "log out other sessions" or a password change on another device
      (see `POST /api/account/logout-other-sessions`): treated like a deleted user, i.e. the
      session is invalidated and the request continues as anonymous (then 401, unless a valid
      remember-me cookie signs it in again, see below).
    - **0.9.0:** the account was disabled by an admin: the session is invalidated and protected
      endpoints answer **401 `ACCOUNT_DISABLED`** (detail "This account has been disabled.")
      instead of `UNAUTHENTICATED`. Public endpoints answer normally (anonymous).
    - **0.9.0:** the user's role changed: the session keeps going with the new role, so access
      to `/api/admin/**` follows the new role from this request on.

    ## Roles (0.9.0)
    Every account has exactly one role (`User.role`): `USER`, `ADMIN` or `SUPER_ADMIN`.
    - `USER`: the normal app. Every `/api/admin/**` endpoint answers 403 `FORBIDDEN`.
    - `ADMIN`: also the admin endpoints; may disable, enable, sign out everywhere and delete
      accounts whose role is `USER`.
    - `SUPER_ADMIN`: like `ADMIN`, and may also act on `ADMIN` accounts and change roles between
      `USER` and `ADMIN`.
    - Nobody can act on a `SUPER_ADMIN` account (not even another super admin) or on themselves
      through the admin API, and no API can set `SUPER_ADMIN`. The first super admin is set by
      the server setting `ADMIN_BOOTSTRAP_EMAIL` at startup (only while no super admin exists);
      any other change to super admins is done in the database by hand.
    Admins can't see other users' tasks or passwords: the admin API returns only `AdminUser`.

    ## Disabled accounts (0.9.0)
    An admin can disable an account (`POST /api/admin/users/{id}/disable`). Its data (tasks,
    connections, role) is kept; enabling it brings everything back (old sessions stay ended).
    While disabled:
    - Open sessions end on their next request: protected endpoints answer 401
      `ACCOUNT_DISABLED` (the client shows "This account has been disabled." on `/login`).
    - Its `remember-me` logins were deleted when it was disabled, so a `remember-me` cookie is
      rejected like any unknown one (cookie expired, the request continues anonymous: the usual
      401 `UNAUTHENTICATED` on protected endpoints). A remember-me login that still exists for a
      disabled account (e.g. disabled in the database by hand) is deleted and rejected, with
      401 `ACCOUNT_DISABLED`.
    - `POST /api/auth/login`: only with the correct password, 403 `ACCOUNT_DISABLED`; a wrong
      password (or unknown email) gets the usual 401 `INVALID_CREDENTIALS`, same timing, so the
      answer never reveals whether an account exists. Nothing is signed in.
    - Google sign-in: `/login?oauth=account_disabled`; nothing is created or linked.
    - Forgot password: the usual 202, but no email is sent. Reset links issued before it was
      disabled were deleted and give 400 `TOKEN_INVALID`.
    - Confirm-email links still work (they sign nobody in).

    ## Session lifetime
    Every session has two limits, both checked on every request before authorization:
    - **Idle timeout**: 30 minutes without a request (unchanged).
    - **Maximum length**, counted from the sign-in that created the session and NOT extended by
      activity:
      - normal session (login without `rememberMe`, or register): 12 hours
        (server setting `SESSION_MAX_LENGTH`).
      - remember-me session (login with `rememberMe: true`, or an automatic remember-me sign-in):
        until its remember-me login expires (30 days from the original login, server setting
        `REMEMBER_ME_LENGTH`). The 12-hour limit does not apply.

    A session past either limit is invalidated and the request continues as anonymous: protected
    endpoints answer **401 `UNAUTHENTICATED`**, the same response as today's idle expiry. Clients
    need no new handling.

    ## Remember me
    `POST /api/auth/login` with `rememberMe: true` additionally sets the `remember-me` cookie
    (see the `rememberMeCookie` security scheme for its attributes). It is a long-lived,
    HttpOnly credential that clients never read or send manually; the browser sends it with
    every `/api/**` request.

    **Automatic sign-in.** When a request arrives with no valid session (none, idle-expired,
    past its maximum length, or ended by "log out other sessions"), but with a valid
    `remember-me` cookie, the server signs the user in **within that same request** and then
    handles the request normally. This applies to **every** `/api/**` endpoint and method
    (`GET /api/auth/me`, `GET /api/tasks`, `POST /api/tasks`, ...), except
    `POST /api/auth/login`, `POST /api/auth/register`, `POST /api/auth/logout` and
    `POST /api/auth/reset-password`, which handle the cookie themselves. That response carries,
    via `Set-Cookie`:
    - a new `JSESSIONID` (a new session, exactly like a password login),
    - a rotated `XSRF-TOKEN` (exactly one `XSRF-TOKEN` Set-Cookie per response),
    - a rotated `remember-me` cookie (new value, Max-Age = time left until the ORIGINAL 30-day
      expiry; rotation never extends it).

    The CSRF check runs before the automatic sign-in and only compares the `X-XSRF-TOKEN` header
    with the `XSRF-TOKEN` cookie (the token is cookie-based, not tied to the session), so a
    POST/PUT/PATCH/DELETE sent with an expired session and a valid `remember-me` cookie succeeds.
    Subsequent requests must use the rotated `XSRF-TOKEN` (Angular HttpClient re-reads the cookie
    automatically).

    **Rejected cookie.** An unknown, expired, malformed or reused `remember-me` cookie never causes
    an error by itself: the response expires it (`remember-me=; Max-Age=0`) and the request
    continues as anonymous, so protected endpoints answer the usual **401 `UNAUTHENTICATED`** and
    public endpoints answer normally. Reuse of an already-rotated cookie (stolen-cookie detection)
    additionally ends ALL of that user's remember-me logins AND all of that user's sessions on
    every device.

    **Parallel requests.** Several requests sent at the same moment with the same (pre-rotation)
    `remember-me` cookie all succeed: the previous cookie value is still accepted for 60 seconds
    after a rotation. Those extra requests are signed in without rotating the cookie again (they
    still get their own `JSESSIONID` and `XSRF-TOKEN`; the browser keeps the last ones it receives,
    and every one of them is valid).

    **Ending a remember-me login.** A device's remember-me login ends on: `POST /api/auth/logout`
    on that device; a new `POST /api/auth/login` or `POST /api/auth/register` on that device
    (which replaces it); expiry after 30 days; `POST /api/account/logout-other-sessions` or
    `PUT /api/account/password` on ANOTHER device; account deletion; stolen-cookie detection;
    a password reset (`POST /api/auth/reset-password`, ends ALL of the account's remember-me
    logins on every device, including this one); 0.9.0: an admin disabling the account, signing
    it out everywhere or deleting it (all of its remember-me logins).

    ## Email verification and password reset
    The server sends two kinds of email, each with a single-use link to the frontend:
    - "Confirm your email for Task App": `<APP_BASE_URL>/verify-email?token=<token>`, valid
      24 hours. Sent after `POST /api/auth/register` and `POST /api/account/resend-verification`.
    - "Reset your Task App password": `<APP_BASE_URL>/reset-password?token=<token>`, valid
      1 hour. Sent after `POST /api/auth/forgot-password` for a registered email.

    `<token>` is opaque to clients: read it from the `token` query parameter and send it back
    unchanged in the JSON body. Today it is 43 URL-safe characters (256 random bits), but clients
    must not validate its format. Tokens never appear in any API response or URL the API serves,
    and every endpoint takes them in the request BODY (never the query string), so they do not
    end up in access logs.

    A token is invalid when it is unknown, malformed, missing, expired, already used, issued for
    the other purpose (a confirmation token sent to the reset endpoints or vice versa), or
    replaced: requesting a new email of the same purpose makes all older unused links of that
    purpose for that account stop working. **Every one of these cases gives the same response:
    400 `TOKEN_INVALID`**, detail "This link is invalid or has expired." The reason is only
    written to the server's security log.

    Emails are sent in the background, after the response. A mail server failure never changes
    any response (it is only logged), so the user can retry with "Resend email" or a new
    forgot-password request.

    Accounts created before 0.7.0 have `emailVerified: false` until they confirm. An unconfirmed
    account works exactly like a confirmed one (no endpoint checks `emailVerified`).

    **Accounts without a password (0.8.0).** Forgot password and reset password work for them
    exactly as for other accounts; a successful reset gives the account a password
    (`hasPassword: true`), after which both sign-in methods work.

    ## Sign in with Google
    Standard OpenID Connect authorization code flow with `state`, `nonce` and PKCE (S256),
    scopes `openid email profile`, run entirely by Spring Security's OAuth2 client. The server
    trusts only the ID token it receives from Google's token endpoint (signature, issuer,
    audience, expiry and nonce checked); it never accepts an email or id sent by the browser.
    No Google access, refresh or ID token is stored or ever sent to the browser.

    Check `GET /api/auth/providers` first: when `google` is `false` the feature is off, the two
    flow endpoints answer 404 and the "Continue with Google" / "Connect Google" buttons must be
    hidden (existing connections are still listed in `User.connections`).

    **Starting.** The frontend submits a regular HTML form (a top-level navigation, not
    `HttpClient`):
    ```
    <form method="post" action="/api/auth/oauth2/authorization/google">
      <input type="hidden" name="intent" value="login">   <!-- or "connect" -->
      <input type="hidden" name="_csrf" value="<current XSRF-TOKEN cookie value>">
    </form>
    ```
    The server answers 302 to Google (or straight to a frontend route below, without visiting
    Google, when the request can't start a flow). For `intent=connect`, call
    `GET /api/auth/me` right before submitting: it refreshes an expired session from the
    `remember-me` cookie (the start endpoint itself never does), and on 401 the client goes to
    `/login` instead.

    **Finishing.** Google redirects the browser to `GET /api/auth/oauth2/callback/google`,
    which ALWAYS answers **302 to a frontend route** (never JSON, never an error page, except
    404 when the feature is off). The route carries at most one query parameter, `oauth`, from
    a fixed list. No token, code, email or id ever appears in the frontend URL.

    | Situation | 302 to |
    |---|---|
    | Login OK (existing account, new account, or account linked by verified email) | `/tasks` |
    | Login cancelled at Google, Google error, missing/unknown/tampered/expired `state`, invalid ID token, Google unreachable, rate limited, any server error | `/login?oauth=google_failed` |
    | Login: no account uses this Google account, an account exists for its email, and it can't be linked automatically (Google says the email is not verified, or the account's own email isn't confirmed yet, or that account is already connected to a different Google account) | `/login?oauth=google_unverified` |
    | Login: no account exists for the Google email and Google says the email is not verified (nothing is created) | `/login?oauth=google_unverified` |
    | Connect OK (also when this Google account was already connected to this user) | `/account?oauth=google_connected` |
    | Connect: this Google account is connected to another user | `/account?oauth=google_in_use` |
    | Connect cancelled, Google error, invalid ID token, rate limited, this user already has a different Google account connected, any server error | `/account?oauth=google_connect_failed` |
    | Connect without a valid session (at the start, or the session ended before the callback) | `/login?oauth=google_failed` |
    | Login intent while already signed in (any account) | the session is replaced by the Google account's user, then `/tasks` |
    | Login (0.9.0): the matched account is disabled (matched by Google account id, or by email once it would otherwise be linked); nothing is created or linked | `/login?oauth=account_disabled` |
    | Connect (0.9.0): the signed-in account was disabled before the callback | `/login?oauth=account_disabled` |

    When the callback can't find the pending request (unknown `state`, session gone) it can't
    know the intent, so it uses the login row (`/login?oauth=google_failed`). Starting a second
    Google flow in the same browser before finishing the first makes the first one fail
    (one pending request per browser). The frontend should remove the `oauth` parameter from the
    address bar after showing its notice.

    **Account matching (login intent)**, from the verified ID token:
    1. A connection with this Google account id (`sub`) exists: sign in to its user, whatever
       the Google email is now (the stored Google email is updated if it changed).
    2. Otherwise an account exists whose email equals the Google email ignoring letter case and
       accents (same rule as login), Google says `email_verified: true`, the account's own email
       is already confirmed (`emailVerified: true`) and the account has no Google connection
       yet: connect Google to it and sign in. Any other case with a matching account: nothing
       changes, `google_unverified` (the user signs in with their password, or uses "Forgot
       password?", and can then connect Google from `/account`).
    3. Otherwise, if Google says `email_verified: true`: create an account (email = the Google
       email, normalized; `emailVerified: true`; `hasPassword: false`; display name from the
       Google `name`, see below), connect Google and sign in. If not verified: nothing is
       created, `google_unverified`.

    New-account display name: the Google `name` trimmed (or, when empty, the part of the email
    before `@`), cut to 50 characters; if another account already has that name (ignoring case
    and accents), ` 2`, ` 3`, ... is appended (the name is cut further so the result stays
    within 50 characters). The user can change it later.

    **Connect intent**: connects the Google account to the signed-in user, whatever its email
    and `email_verified` say (the user proved control of both accounts). If the Google email
    equals the account email (ignoring case and accents) and Google says it is verified, the
    account's email also becomes confirmed; otherwise `emailVerified` is unchanged. A user has
    at most one Google connection; a Google account belongs to at most one user.

    **Session after a Google login** (the 302 to `/tasks`): exactly like a password login
    without `rememberMe`: new `JSESSIONID`, rotated `XSRF-TOKEN`, 12-hour maximum and 30-minute
    idle timeout, no `remember-me` cookie. A `remember-me` cookie the browser carries (of any
    account) is ended and expired (`Max-Age=0`) on that 302. Connect keeps the current session,
    cookies and `XSRF-TOKEN` unchanged.

    **Login CSRF.** The pending request (`state`, `nonce`, PKCE verifier, intent) is stored in
    the server-side session of the browser that started the flow, identified by its HttpOnly
    `JSESSIONID` cookie. The callback is accepted only if its `state` matches the request stored
    in the session of the browser that delivers it. A callback URL produced by someone else's
    flow (e.g. an attacker who signed in to Google and makes the victim's browser open it) finds
    no matching request: `google_failed`, nothing signed in. Starting a flow requires the CSRF
    token (form field `_csrf`), so another site can't start a sign-in or connect in the user's
    browser either. Starting a login creates a short-lived anonymous session if the browser has
    none (it holds only the pending request; a failed callback invalidates it).

    ## CSRF
    Every state-changing request (POST/PUT/PATCH/DELETE), **including register, login, logout and
    the public email endpoints (verify-email, forgot-password, check-reset-token,
    reset-password)**, must send header `X-XSRF-TOKEN` with the value of the `XSRF-TOKEN` cookie.
    On a fresh browser (e.g. a link opened from an email), call `GET /api/auth/me` first to get
    the cookie (a 401 there is fine; it still sets `XSRF-TOKEN`).
    - `XSRF-TOKEN` cookie: NOT HttpOnly (JS-readable), Path=/, SameSite=Lax.
    - The server sets this cookie on any `/api/**` response (including 401 and 4xx) whenever the
      request did not carry one, and always on register/login/logout (rotation). An existing valid
      cookie is not re-sent on every response. The app should call `GET /api/auth/me` on startup to
      obtain it.
    - The token **rotates** on login, register, logout, a successful account delete
      (`POST /api/account/delete`), a successful password reset
      (`POST /api/auth/reset-password`) and an automatic remember-me sign-in (any endpoint, see
      "Remember me"); the new cookie is set on that same response, so the next request just reads
      the cookie again (Angular HttpClient does this automatically). Changing the display name or
      the password, and `POST /api/account/logout-other-sessions`, do NOT rotate it (they change
      only the session id).
    - The header value is the raw cookie value (no masking/encoding needed on the client).
    - `POST /api/auth/oauth2/authorization/google` is a form submission and can't send headers:
      it sends the same raw cookie value as the form field `_csrf` instead (0.8.0).
      `GET /api/auth/oauth2/callback/google` needs no token (it is protected by `state`).
    - A successful Google login rotates the token too (on its 302 to `/tasks`); Google connect
      and disconnect do not.
    - Missing/invalid token: **403** problem with `code: CSRF_INVALID`.

    ## Errors
    All errors are RFC 7807 `application/problem+json` (see `Problem` schema), with a stable
    machine-readable `code`. Field-level errors (400 validation, 400 wrong current password on the
    account endpoints, 409 duplicate email and/or display name) also carry an `errors` array of
    `{field, code, message}`.

    A wrong current password on `/api/account/*` is **400 `WRONG_PASSWORD`, never 401**: a 401
    always means "you are not signed in", so clients can treat every 401 as "session expired".

    ## Rate limiting
    `POST /api/auth/login`, `POST /api/auth/register`, `PUT /api/account/password` and
    `POST /api/account/delete` are rate limited. Counters are kept in
    memory per server instance (reset on restart). When a limit is hit the API returns **429**
    `application/problem+json` with `code: RATE_LIMITED`, detail
    "Too many attempts. Please try again later." and a `Retry-After` header (whole seconds, >= 1).
    A 429 never carries an `errors` array. Defaults (configurable on the server):
    - Login, per client IP: 20 requests per 1 minute. Counted on every login request that passes
      the CSRF check, including ones that end in 400 or 401.
    - Login, per email (trimmed, lowercased): after 5 **failed** logins within 15 minutes, further
      logins for that email get 429 (even with the correct password) until the oldest failure is
      15 minutes old. Unknown emails are counted the same way, so the 429 does not reveal whether
      an account exists. A successful login resets that email's failure count. This check runs
      after body validation and before the password is checked. Other emails are not affected.
    - Register, per client IP: 5 requests per 1 hour. Counted on every register request that
      passes the CSRF check, including ones that end in 400 or 409.

    - Password checks, per signed-in user id: `PUT /api/account/password` and
      `POST /api/account/delete` share **one** counter per user. After 5 **wrong** passwords
      (400 `WRONG_PASSWORD`, from either endpoint, in any mix) within 15 minutes, further calls to
      either endpoint get 429 (even with the correct password) until the oldest failure is
      15 minutes old. Requests that fail validation (400 `VALIDATION_FAILED`) are not counted and
      do not check the limit. A correct password resets the counter. Other users are not
      affected. Configurable on the server (`RATE_LIMIT_PASSWORD_CHECK_FAILURES_PER_USER`,
      default 5; `RATE_LIMIT_PASSWORD_CHECK_FAILURE_WINDOW`, default 15m).

    `POST /api/account/logout-other-sessions` is NOT rate limited (it needs a signed-in session
    and a CSRF token, checks no password and is idempotent).

    Email endpoints (new in 0.7.0). Same 429 response as above. Defaults:
    - Forgot password, per client IP: 10 requests per 1 hour (429). Counted on every request
      that passes the CSRF check, including ones that end in 400.
      (`RATE_LIMIT_FORGOT_PASSWORD_PER_IP_PER_HOUR`)
    - Forgot password, per account: at most 3 reset emails per 1 hour per account. **Silent**:
      over this limit the response is still 202 (identical to every other well-formed request)
      and no email is sent. Counted per account, so letter-case or accent variants of the same
      address share one counter. (`RATE_LIMIT_RESET_EMAILS_PER_ACCOUNT_PER_HOUR`)
    - Resend verification, per signed-in user: 3 requests per 1 hour (429). Counted only when
      an email is actually queued (not on 401 / 409). The email sent by register does not count.
      (`RATE_LIMIT_RESEND_VERIFICATION_PER_USER_PER_HOUR`)
    - Verify email, per client IP: 30 requests per 1 hour (429).
      (`RATE_LIMIT_VERIFY_EMAIL_PER_IP_PER_HOUR`)
    - Check reset token, per client IP: 30 requests per 1 hour (429).
      (`RATE_LIMIT_CHECK_RESET_TOKEN_PER_IP_PER_HOUR`)
    - Reset password, per client IP: 20 requests per 1 hour (429).
      (`RATE_LIMIT_RESET_PASSWORD_PER_IP_PER_HOUR`)
    The per-IP counters of the email endpoints are counted on every request that passes the
    CSRF check, including ones that end in 400.

    Google endpoints (new in 0.8.0). These are browser navigations, so over a limit they answer
    the flow's failure **302** (`/login?oauth=google_failed`, or
    `/account?oauth=google_connect_failed` when the pending request is a connect), not a 429.
    The refusal is logged like any other (`RATE_LIMITED`). Defaults:
    - Start, per client IP: 20 requests per 1 minute, counted on every request that passes the
      CSRF check. (`RATE_LIMIT_GOOGLE_START_PER_IP_PER_MINUTE`)
    - Callback, per client IP: 20 requests per 1 minute.
      (`RATE_LIMIT_GOOGLE_CALLBACK_PER_IP_PER_MINUTE`)
    `GET /api/auth/providers` and `DELETE /api/account/connections/google` are not rate
    limited (no secret is checked).

    Admin endpoints (new in 0.9.0). Same 429 response as above:
    - Admin actions, per signed-in admin: 60 requests per 1 minute
      (`RATE_LIMIT_ADMIN_ACTIONS_PER_USER_PER_MINUTE`). Counted on every change request
      (`POST .../disable`, `.../enable`, `.../revoke-sessions`, `PUT .../role`,
      `DELETE /api/admin/users/{id}`) that passes the CSRF, sign-in, admin-role and request
      validation checks, including ones then refused with 403 / 404 / 409. Not counted:
      `GET /api/admin/users` (not limited).

    Sharing (new in 0.13.0):
    - Invitations, per signed-in user (the inviter): 30 per 1 hour (429, same response as
      above). Counted on every `POST /api/lists/{id}/invitations` that passes the 400, 404,
      403 `OWNER_ONLY` and 409 `PERSONAL_LIST` checks, including ones then refused with
      409 `ALREADY_MEMBER` / `ALREADY_INVITED` / `MEMBER_LIMIT` / `INVITATION_LIMIT`.
      (`RATE_LIMIT_INVITES_PER_USER_PER_HOUR`)
    - Invitation emails, per recipient account: at most 5 per 1 hour. **Silent**: over this
      limit the invitation is still created and the response is the same 201; only the email
      is skipped. (`RATE_LIMIT_INVITE_EMAILS_PER_ACCOUNT_PER_HOUR`)
    No other sharing endpoint is rate limited.

    Reminders (new in 0.14.0): reminder emails, per recipient account: at most 20 per 1 hour
    (`RATE_LIMIT_REMINDER_EMAILS_PER_ACCOUNT_PER_HOUR`, counted per app instance). **Silent**:
    over the limit the in-app notification is still created, only the email is skipped. No
    reminder or notification endpoint is rate limited.

    Delete account without a password (0.8.0): the `email` confirmation shares the per-user
    password-check counter above (a wrong `email` counts one failure, the right one resets it).

    Precedence (auth endpoints): 403 `CSRF_INVALID` > 429 (per-IP) > 400 `VALIDATION_FAILED` >
    429 (per-email) > 401 / 409.

    Precedence (public email endpoints): 403 `CSRF_INVALID` > 429 (per-IP) >
    400 `MALFORMED_REQUEST` > 400 `TOKEN_INVALID` > 400 `VALIDATION_FAILED` > success.
    Never 401.

    Precedence (account endpoints): 403 `CSRF_INVALID` > 401 `UNAUTHENTICATED` >
    400 `VALIDATION_FAILED` / `MALFORMED_REQUEST` > 409 `PASSWORD_REQUIRED` >
    429 (per-user password checks) > 400 `WRONG_PASSWORD` / `EMAIL_MISMATCH` /
    409 `DISPLAY_NAME_TAKEN`.

    Precedence (admin change endpoints, 0.9.0): 403 `CSRF_INVALID` >
    401 `UNAUTHENTICATED` / `ACCOUNT_DISABLED` > 403 `FORBIDDEN` (not an admin) >
    400 `MALFORMED_REQUEST` / `VALIDATION_FAILED` > 429 (per-admin) > 409 `CANNOT_MODIFY_SELF` >
    403 `FORBIDDEN` (the caller's role was lowered to `USER` meanwhile) > 404 `USER_NOT_FOUND` >
    403 `INSUFFICIENT_ROLE` > 200 / 204.

    ## Admin (0.9.0)
    `/api/admin/**` requires a signed-in `ADMIN` or `SUPER_ADMIN` (401 when signed out, 403
    `FORBIDDEN` for a `USER`). Two different 403s:
    - `FORBIDDEN`: the caller is not an admin (any more). The client should leave the admin page
      (and refresh `GET /api/auth/me`).
    - `INSUFFICIENT_ROLE`: the caller is an admin, but not allowed to do this to this account
      (see "Roles"). The client shows "You don't have permission to do this." and refreshes the
      list.

    Every change runs against the current database state: the caller's and the target's rows
    are locked and re-read in one transaction, so a role changed a moment ago (the caller's or
    the target's) is respected. Changes that are already in effect (disable a disabled account,
    enable an active one, set the role it already has) succeed with 200 and change nothing.
    `revoke-sessions` always ends every session. Each change that happens, and each refused
    attempt, is written to the server's security log.

    ## Request bodies
    Unknown properties in a JSON request body are ignored (never an error). In particular any
    `id`, `ownerId`, `addedBy`, `createdAt` or `updatedAt` sent by the client is ignored; the
    person who adds a task (`addedBy`) is always the signed-in user from the session. A task's
    list (0.12.0) can only be a list the signed-in user is a member of (0.13.0; `listId`, else
    404 `LIST_NOT_FOUND`).
servers:
  - url: http://localhost:8080
tags:
  - name: health
  - name: auth
  - name: account
  - name: tasks
  - name: lists
    description: |
      Task lists (0.12.0). Each list has one owner; since 0.13.0 the owner can share it with
      members (see "Sharing").
  - name: invitations
    description: The signed-in user's own pending invitations to other people's lists (0.13.0).
  - name: notifications
    description: The signed-in user's own in-app notifications (reminders that fired, 0.14.0).
  - name: admin
    description: Admin users page (0.9.0), `ADMIN` and `SUPER_ADMIN` only.
paths:
  /api/health:
    get:
      summary: Health check
      operationId: getHealth
      tags: [health]
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /api/auth/me:
    get:
      summary: Current signed-in user
      description: |
        Returns the user for the current session. Also sets the `XSRF-TOKEN` cookie
        (on both 200 and 401), so call this first on app startup.

        If there is no valid session but a valid `remember-me` cookie, the user is signed in
        automatically (see "Remember me"): 200 with a new `JSESSIONID`, a rotated `XSRF-TOKEN` and
        a rotated `remember-me` cookie. If the `remember-me` cookie is rejected: 401 and the cookie
        is expired. Nothing changes for clients: 200 = signed in, 401 = show the login page.
      operationId: getCurrentUser
      tags: [auth]
      security: []
      responses:
        '200':
          description: |
            Signed in (with an existing session, or automatically from the `remember-me` cookie).
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetXsrfOrRememberMeSignInCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                email: bob@example.com
                displayName: Bob
                emailVerified: true
                hasPassword: true
                connections: []
                role: USER
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/auth/register:
    post:
      summary: Create an account and sign in
      description: |
        Creates the account and starts a session (auto sign-in). The email is trimmed and
        lowercased before validation and uniqueness checks; displayName is trimmed (and stored with
        the user's casing).
        If a session already exists it is replaced by the new user's session.

        Uniqueness (checked only after validation passes, so a 400 always wins over a 409):
        - email: ignores letter case AND accents (`jose@example.com` = `JOSÉ@example.com`).
        - displayName: compared after trimming, ignoring letter case AND accents
          (`José` = `jose` = `JOSE` = ` José `).
        Both are checked on every request, so a 409 reports every taken field at once.

        Register never sets a `remember-me` cookie and starts a normal session (12-hour maximum).
        If the request carries a `remember-me` cookie (e.g. of another account on this browser), that
        remember-me login is ended and the cookie expired on the 201 response, so the browser
        can't later sign back in as the previous account.

        **New in 0.7.0:** the new account has `emailVerified: false`, and a confirmation email is
        sent to it in the background (see "Email verification and password reset"). The response
        does not wait for the email and is the same whether or not sending succeeds.
      operationId: register
      tags: [auth]
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              displayName: Bob
              email: Bob@Example.com
              password: correct-horse
      responses:
        '201':
          description: Account created and signed in. Sets `JSESSIONID` and a rotated `XSRF-TOKEN`.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionAndXsrfCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                email: bob@example.com
                displayName: Bob
                emailVerified: false
                hasPassword: true
                connections: []
                role: USER
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '409':
          description: |
            The email and/or the display name already belong to another account. One response
            covers both cases:
            - Top-level `code` is `EMAIL_TAKEN` whenever the email is taken (unchanged from 0.2.0,
              so existing clients keep working), otherwise `DISPLAY_NAME_TAKEN`. `detail` is the
              message of that code.
            - `errors` is always present and has one entry per taken field, email first:
              `email` / `EMAIL_TAKEN` / "An account with this email already exists" and/or
              `displayName` / `DISPLAY_NAME_TAKEN` / "This display name is already taken".
              Clients should render field messages from `errors`, not from the top-level `code`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                bothTaken:
                  summary: Email and display name both taken
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    detail: An account with this email already exists
                    instance: /api/auth/register
                    code: EMAIL_TAKEN
                    errors:
                      - field: email
                        code: EMAIL_TAKEN
                        message: An account with this email already exists
                      - field: displayName
                        code: DISPLAY_NAME_TAKEN
                        message: This display name is already taken
                emailTaken:
                  summary: Only the email is taken
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    detail: An account with this email already exists
                    instance: /api/auth/register
                    code: EMAIL_TAKEN
                    errors:
                      - field: email
                        code: EMAIL_TAKEN
                        message: An account with this email already exists
                displayNameTaken:
                  summary: Only the display name is taken
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    detail: This display name is already taken
                    instance: /api/auth/register
                    code: DISPLAY_NAME_TAKEN
                    errors:
                      - field: displayName
                        code: DISPLAY_NAME_TAKEN
                        message: This display name is already taken
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/login:
    post:
      summary: Sign in
      description: |
        Email is trimmed and lowercased before lookup, and matching ignores letter case and accents
        (any letter case and accents work: `JOSÉ@example.com` signs in the account registered as
        `jose@example.com`). Wrong password and
        unknown email return the identical 401 response. On success the session ID changes
        (session-fixation protection) and the `XSRF-TOKEN` rotates.

        `rememberMe` (optional, default `false`):
        - `true`: also creates a new remember-me login for this device (valid 30 days from now, not
          extended by use) and sets the `remember-me` cookie. The session is a remember-me session
          (no 12-hour maximum, see "Session lifetime").
        - `false` or absent: a normal session (12-hour maximum), no `remember-me` cookie set.

        Either way, a `remember-me` cookie the request already carries (an earlier remember-me
        login on this device, possibly of another account) is ended and replaced: with
        `rememberMe: false` it is expired (`Max-Age=0`) on this response. The response body is the
        same `User` in all cases. A failed login (400/401/429) leaves any existing `remember-me`
        cookie untouched.

        **0.8.0:** an account without a password (created with Google) never signs in here: any
        password gives the same 401 `INVALID_CREDENTIALS` as a wrong password, with the same
        timing, and counts as a failed login for the per-email limit. Nothing reveals that the
        account exists or how it signs in.

        **0.9.0:** a disabled account with the CORRECT password gets 403 `ACCOUNT_DISABLED`
        (detail "This account has been disabled."): no session, no cookies, and the per-email
        failure count is neither increased nor reset. With a wrong password it gets the usual
        401 `INVALID_CREDENTIALS` (same body and timing as any wrong password). An account
        without a password always gets the 401.
      operationId: login
      tags: [auth]
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              normal:
                summary: Normal sign-in (same as before 0.6.0)
                value:
                  email: BOB@example.com
                  password: correct-horse
              rememberMe:
                summary: Sign in and remember this device for 30 days
                value:
                  email: BOB@example.com
                  password: correct-horse
                  rememberMe: true
      responses:
        '200':
          description: |
            Signed in. Sets `JSESSIONID` and a rotated `XSRF-TOKEN`; with `rememberMe: true` also
            sets `remember-me`.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetLoginCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                email: bob@example.com
                displayName: Bob
                emailVerified: true
                hasPassword: true
                connections:
                  - provider: google
                    email: bob@gmail.com
                role: USER
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: Wrong email or password (same body in both cases)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Invalid email or password
                instance: /api/auth/login
                code: INVALID_CREDENTIALS
        '403':
          description: |
            `CSRF_INVALID` (missing or invalid CSRF token), or, new in 0.9.0, `ACCOUNT_DISABLED`:
            the email and password are correct but the account is disabled. Nothing is signed in
            and no cookie is set.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                csrf:
                  value:
                    type: about:blank
                    title: Forbidden
                    status: 403
                    detail: Invalid or missing CSRF token
                    instance: /api/auth/login
                    code: CSRF_INVALID
                accountDisabled:
                  value:
                    type: about:blank
                    title: Forbidden
                    status: 403
                    detail: This account has been disabled.
                    instance: /api/auth/login
                    code: ACCOUNT_DISABLED
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/logout:
    post:
      summary: Sign out
      description: |
        Invalidates the session, expires the `JSESSIONID` cookie and sets a fresh `XSRF-TOKEN`.
        Idempotent: returns 204 even if there was no active session (still requires a valid
        CSRF token).

        Also ends THIS device's remember-me login: its database entry is deleted (when the
        `remember-me` cookie matches it, or the session was signed in with it) and the
        `remember-me` cookie is always expired (`Max-Age=0`), even without a session. Remember-me
        logins on other devices are NOT affected (use `POST /api/account/logout-other-sessions`
        for that). Logout never signs anyone in automatically from the cookie.
      operationId: logout
      tags: [auth]
      security:
        - csrfHeader: []
      responses:
        '204':
          description: Signed out. Expires `JSESSIONID` and `remember-me`, sets a fresh `XSRF-TOKEN`.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetLogoutCookies'
        '403':
          $ref: '#/components/responses/CsrfInvalid'

  /api/auth/providers:
    get:
      summary: Which external sign-in providers are available
      description: |
        New in 0.8.0. Public; never 401 (a stale session or rejected `remember-me` cookie just
        makes the request anonymous); GET, so no CSRF token needed. Not rate limited.

        `google` is `true` when the server has Google sign-in configured (`GOOGLE_CLIENT_ID` and
        `GOOGLE_CLIENT_SECRET` set). When `false`: hide "Continue with Google" on `/login` and
        `/register`, and show the "Connected accounts" card read-only (no Connect / Disconnect);
        the flow endpoints and `DELETE /api/account/connections/google` answer 404. `true` does
        not guarantee Google is reachable right now: a flow can still end in
        `oauth=google_failed`.

        The value only changes when the server restarts with different settings, so clients may
        fetch it once per page load.
      operationId: getProviders
      tags: [auth]
      security: []
      responses:
        '200':
          description: Available providers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Providers'
              examples:
                on:
                  value:
                    google: true
                off:
                  value:
                    google: false

  /api/auth/oauth2/authorization/google:
    post:
      summary: Start signing in with, or connecting, Google (browser form submission)
      description: |
        New in 0.8.0. Submitted as a regular HTML form (top-level navigation, NOT `HttpClient`),
        see "Sign in with Google". Body `application/x-www-form-urlencoded` with `intent` and
        `_csrf` (the raw `XSRF-TOKEN` cookie value; the `X-XSRF-TOKEN` header works too but a
        form can't send it).

        Responses, in order:
        1. Missing/invalid `_csrf`: 403 `CSRF_INVALID` (problem+json, shown as-is by the
           browser; does not happen when the frontend reads the cookie at submit time).
        2. Google sign-in not configured: 404 `NOT_FOUND` (problem+json).
        3. Otherwise ALWAYS a 302:
           - over the per-IP limit: to the failure route of the intent;
           - `intent` not `login`/`connect` (absent = `login`): `/login?oauth=google_failed`;
           - `intent=connect` without a valid signed-in session: `/login?oauth=google_failed`
             (the `remember-me` cookie is NOT used here; call `GET /api/auth/me` before
             submitting);
           - Google's configuration can't be loaded (Google unreachable): the failure route of
             the intent;
           - otherwise: **to Google's authorization endpoint**, with `response_type=code`,
             `client_id`, `scope=openid email profile`, `state`, `nonce`, `code_challenge`,
             `code_challenge_method=S256` and
             `redirect_uri=<APP_BASE_URL>/api/auth/oauth2/callback/google`. The pending request
             is stored in this browser's session (a new anonymous session, with a
             `JSESSIONID` cookie, if there is none; a signed-in session is kept as it is).

        GET is not supported (405): a link on another site can't start a flow.
      operationId: startGoogleFlow
      tags: [auth]
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleStartForm'
            example:
              intent: login
              _csrf: 0f1c6a8e-2d4b-4e55-9a8e-6b1f7c3d2a90
      responses:
        '302':
          description: |
            To Google (`Location: https://accounts.google.com/o/oauth2/v2/auth?...`), or to a
            frontend failure route (`Location: <APP_BASE_URL>/login?oauth=google_failed` or
            `<APP_BASE_URL>/account?oauth=google_connect_failed`). May set `JSESSIONID`.
          headers:
            Location:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/ProviderNotFound'

  /api/auth/oauth2/callback/google:
    get:
      summary: Google redirects the browser here after the user approved or cancelled
      description: |
        New in 0.8.0. Never called by frontend code; Google sends the browser here with
        `code` and `state` (or `error` and `state`). This is the redirect URI registered at
        Google: `<APP_BASE_URL>/api/auth/oauth2/callback/google`.

        Google sign-in not configured: 404 `NOT_FOUND` (problem+json). Otherwise ALWAYS a 302
        to a frontend route from the table in "Sign in with Google", whatever happens (including
        rate limiting and server errors). `Location` is absolute: `<APP_BASE_URL>/<route>`.

        On a successful login the 302 also carries the new session (see `SetLoginCookies`,
        without `remember-me`; an existing `remember-me` cookie is expired). On a successful
        connect, cookies are unchanged. On failure the session is not signed in; an anonymous
        session created only for this flow is invalidated.
      operationId: googleCallback
      tags: [auth]
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Set by Google instead of `code`, e.g. `access_denied` when the user cancels.
          schema:
            type: string
      responses:
        '302':
          description: |
            `Location` is one of `<APP_BASE_URL>/tasks`, `/login?oauth=google_failed`,
            `/login?oauth=google_unverified`, `/account?oauth=google_connected`,
            `/account?oauth=google_in_use`, `/account?oauth=google_connect_failed` (see the
            `OAuthResult` schema).
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              $ref: '#/components/headers/SetGoogleLoginCookies'
        '404':
          $ref: '#/components/responses/ProviderNotFound'

  /api/auth/verify-email:
    post:
      summary: Confirm an email address with a link token
      description: |
        Consumes a confirmation token (from the link `<APP_BASE_URL>/verify-email?token=...`)
        and marks its account's email as confirmed. Public: works signed in or not, in any
        browser. The token may belong to a different account than the one signed in on this
        browser; the session (if any) is never changed by this endpoint, and no cookie is set
        (apart from the usual `XSRF-TOKEN` / automatic remember-me sign-in cookies, see
        "Remember me"). If signed in, refetch `GET /api/auth/me` afterwards to get the updated
        `emailVerified`.

        The token is single-use: a second call with the same token is 400 `TOKEN_INVALID`
        (even though the email stays confirmed).

        Order: 403 `CSRF_INVALID` > 429 (per-IP) > 400 `MALFORMED_REQUEST` (body is not JSON) >
        400 `TOKEN_INVALID` > 204. Never 401.
      operationId: verifyEmail
      tags: [auth]
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            example:
              token: 3q2-7wWQkR0Yf1m4m0cR9pXzA8b6s1oVqWw2Jt5uLkE
      responses:
        '204':
          description: Email confirmed. No body.
        '400':
          $ref: '#/components/responses/TokenInvalid'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/forgot-password:
    post:
      summary: Request a password reset email
      description: |
        If the email belongs to an account (matched like login: trimmed, ignoring letter case
        and accents), a reset email is sent to the account's stored address with a link valid
        for 1 hour, and all older unused reset links of that account stop working.

        **The response never reveals whether the account exists.** Every well-formed email gets
        the identical 202 with no body: registered or not, over the silent per-account limit or
        not, mail server up or down. The request does no database work and does not wait for the
        email: the lookup, token creation and sending all happen in the background after the
        response, so the response time is the same in every case.

        Works signed in or not; the session (if any) is not changed.

        **0.9.0:** for a disabled account the response is the same 202, but no email is sent
        and no reset link is created (this does not count towards the per-account limit).

        Order: 403 `CSRF_INVALID` > 429 (per-IP limit only) > 400 `MALFORMED_REQUEST` /
        `VALIDATION_FAILED` > 202. Never 401.
      operationId: forgotPassword
      tags: [auth]
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
            example:
              email: Bob@Example.com
      responses:
        '202':
          description: |
            Accepted. No body. Always the same for a well-formed email (the client shows "If an
            account exists for that email, we've sent a link to reset your password.").
        '400':
          description: |
            Validation failed (`code: VALIDATION_FAILED`). Possible entries:
            - `email` / `REQUIRED` / "Email is required"
            - `email` / `INVALID_EMAIL` / "Enter a valid email address"
            - `email` / `TOO_LONG` / "Email must be at most 254 characters"

            A body that is not valid JSON returns 400 `MALFORMED_REQUEST` with no `errors`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Validation failed
                instance: /api/auth/forgot-password
                code: VALIDATION_FAILED
                errors:
                  - field: email
                    code: INVALID_EMAIL
                    message: Enter a valid email address
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '429':
          description: |
            Too many forgot-password requests from this IP (default 10 per hour, see "Rate
            limiting"). The per-account email limit never gives 429.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Too Many Requests
                status: 429
                detail: Too many attempts. Please try again later.
                instance: /api/auth/forgot-password
                code: RATE_LIMITED

  /api/auth/check-reset-token:
    post:
      summary: Check a password reset token without using it
      description: |
        For the reset page: call it when `/reset-password?token=...` opens, to show either the
        new-password form (204) or "This link is invalid or has expired" (400). It does NOT
        consume the token and changes nothing. A 204 is not a guarantee for later: the token can
        still expire or be replaced before `POST /api/auth/reset-password`, which checks again.

        Only reset tokens pass; a confirmation (verify-email) token gives 400 `TOKEN_INVALID`.

        Order: 403 `CSRF_INVALID` > 429 (per-IP) > 400 `MALFORMED_REQUEST` >
        400 `TOKEN_INVALID` > 204. Never 401. POST (not GET) so the token stays out of URLs and
        access logs.
      operationId: checkResetToken
      tags: [auth]
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            example:
              token: Zr0b1y6p6eS4lJx3n9QhVt2Kc7aWm5dUo8fXg1iHsNk
      responses:
        '204':
          description: The token is a valid, unused, unexpired reset token. No body.
        '400':
          $ref: '#/components/responses/TokenInvalid'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/reset-password:
    post:
      summary: Set a new password with a reset token
      description: |
        Consumes the reset token and sets the account's password to `newPassword` (BCrypt). On
        success, in one transaction:
        - the password is changed; login works only with the new one;
        - **every** session and remember-me login of the account ends, on every device, exactly
          like the stolen-cookie response (`sessions_valid_after` = now, all remember-me logins
          deleted): their next request is anonymous (401 on protected endpoints);
        - the email counts as confirmed (`emailVerified: true`), since the user proved they read
          it;
        - the account's failed-login counter is reset, so a user locked out by wrong passwords
          (429 on login) can sign in with the new password right away.

        **This browser is always signed out**, whichever account (if any) it was signed in as:
        the 204 expires `JSESSIONID` and `remember-me` and sets a fresh `XSRF-TOKEN`, exactly
        like `POST /api/auth/logout`. There is no automatic sign-in: the user signs in again on
        `/login`.

        `newPassword` follows the register password rules. It may equal the old password.

        **0.9.0:** a reset token of a disabled account is invalid (400 `TOKEN_INVALID`), here and
        on `POST /api/auth/check-reset-token`; disabling an account also deletes its unused reset
        links, so they stay invalid after it is enabled again.

        Order: 403 `CSRF_INVALID` > 429 (per-IP) > 400 `MALFORMED_REQUEST` >
        400 `TOKEN_INVALID` > 400 `VALIDATION_FAILED` (`newPassword`) > 204. So an invalid
        link always shows the "invalid or expired" page, even with a bad password. A failed
        request (any 4xx) changes nothing and does not use up the token. Never 401.
      operationId: resetPassword
      tags: [auth]
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              token: Zr0b1y6p6eS4lJx3n9QhVt2Kc7aWm5dUo8fXg1iHsNk
              newPassword: battery-staple-42
      responses:
        '204':
          description: |
            Password reset, all sessions ended, this browser signed out. No body. Expires
            `JSESSIONID` and `remember-me`, sets a fresh `XSRF-TOKEN`.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetLogoutCookies'
        '400':
          description: |
            Either `TOKEN_INVALID` (no `errors`, checked first) or `VALIDATION_FAILED`
            (`errors`, only when the token is valid). `VALIDATION_FAILED` entries:
            - `newPassword` / `REQUIRED` / "New password is required"
            - `newPassword` / `PASSWORD_LENGTH` / "Password must be 8 to 72 characters"

            A body that is not valid JSON returns 400 `MALFORMED_REQUEST` with no `errors`.
            Nothing is changed and the session is kept.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                tokenInvalid:
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: This link is invalid or has expired.
                    instance: /api/auth/reset-password
                    code: TOKEN_INVALID
                validation:
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: Validation failed
                    instance: /api/auth/reset-password
                    code: VALIDATION_FAILED
                    errors:
                      - field: newPassword
                        code: PASSWORD_LENGTH
                        message: Password must be 8 to 72 characters
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/account/resend-verification:
    post:
      summary: Send me a new confirmation email
      description: |
        Sends a new confirmation email to the signed-in user's address (link valid 24 hours) and
        makes all older unused confirmation links of the account stop working. The email is sent
        in the background: 204 means "queued", and a mail server failure is only logged.

        No request body (a body, if sent, is ignored). Session and cookies are unchanged.

        Already confirmed (e.g. confirmed in another tab): 409 `ALREADY_VERIFIED`, nothing sent,
        not counted. The client should refetch `GET /api/auth/me` and hide the banner.

        Order: 403 `CSRF_INVALID` > 401 `UNAUTHENTICATED` > 409 `ALREADY_VERIFIED` >
        429 (per-user, default 3 per hour) > 204.
      operationId: resendVerification
      tags: [account]
      security:
        - sessionCookie: []
          csrfHeader: []
        - rememberMeCookie: []
          csrfHeader: []
      responses:
        '204':
          description: A new confirmation email is queued. No body.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '409':
          description: The signed-in user's email is already confirmed. Nothing was sent.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: Your email address is already confirmed.
                instance: /api/account/resend-verification
                code: ALREADY_VERIFIED
        '429':
          description: |
            Too many confirmation emails for this user (default 3 per hour). Wait `Retry-After`
            seconds. No `errors` array.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Too Many Requests
                status: 429
                detail: Too many attempts. Please try again later.
                instance: /api/account/resend-verification
                code: RATE_LIMITED

  /api/account/display-name:
    put:
      summary: Change my display name
      description: |
        Sets the signed-in user's display name. `displayName` is trimmed and must then be 1-50
        characters (same rules as register). It is stored with the casing the user typed.

        Uniqueness ignores letter case and accents (`José` = `jose` = `JOSE` = ` José `), but only
        against OTHER accounts: my own current name never counts as taken, so "Bob" can be changed
        to "bob" or "Böb". Saving the exact current name is allowed and returns 200.

        On success the session's signed-in user is updated too (same session, no new cookies), so
        later requests and security logs see the new name. Other sessions of the same user pick
        it up on their next request (see "Authentication").
      operationId: changeDisplayName
      tags: [account]
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeDisplayNameRequest'
            example:
              displayName: '  Bobby '
      responses:
        '200':
          description: Updated. The body is the updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                email: bob@example.com
                displayName: Bobby
                emailVerified: true
                hasPassword: true
                connections: []
                role: USER
        '400':
          description: |
            Validation failed (`code: VALIDATION_FAILED`). Possible entries:
            - `displayName` / `REQUIRED` / "Display name is required" (missing, null, empty or
              blank after trimming)
            - `displayName` / `TOO_LONG` / "Display name must be at most 50 characters"

            A body that is not valid JSON returns 400 `MALFORMED_REQUEST` with no `errors`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                required:
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: Validation failed
                    instance: /api/account/display-name
                    code: VALIDATION_FAILED
                    errors:
                      - field: displayName
                        code: REQUIRED
                        message: Display name is required
                tooLong:
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: Validation failed
                    instance: /api/account/display-name
                    code: VALIDATION_FAILED
                    errors:
                      - field: displayName
                        code: TOO_LONG
                        message: Display name must be at most 50 characters
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '409':
          description: |
            Another account already uses this display name (ignoring letter case and accents).
            Same shape as the register 409 for a taken display name.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: This display name is already taken
                instance: /api/account/display-name
                code: DISPLAY_NAME_TAKEN
                errors:
                  - field: displayName
                    code: DISPLAY_NAME_TAKEN
                    message: This display name is already taken

  /api/account/time-zone:
    put:
      summary: Set my time zone
      description: |
        New in 0.14.0. Sets the IANA zone my due times and reminders are evaluated in (see "Due
        times and reminders"). With `ifUnset: true` it only sets it when the zone is still empty,
        in one atomic update; otherwise it always overwrites. Setting a zone different from the
        stored one recomputes the fire time of all my reminders. Saving the same zone is allowed
        and returns 200. The answer is the updated `User` (no new cookies). Session and CSRF
        like `PUT /api/account/display-name`.
      operationId: setTimeZone
      tags: [account]
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTimeZoneRequest'
            example:
              timeZone: Europe/Bucharest
              ifUnset: true
      responses:
        '200':
          description: The user, with the zone now stored (unchanged when `ifUnset` found one)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                email: bob@example.com
                displayName: Bob
                emailVerified: true
                hasPassword: true
                connections: []
                role: USER
                timeZone: Europe/Bucharest
                reminderEmails: true
        '400':
          description: |
            Validation failed (`code: VALIDATION_FAILED`): `timeZone` / `REQUIRED` (missing, null
            or blank) or `timeZone` / `INVALID_TIME_ZONE` ("Unknown time zone"; offsets,
            abbreviations and ids longer than 64 characters included). A body that is not valid
            JSON, or `ifUnset` that is not a boolean, returns 400 `MALFORMED_REQUEST`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Validation failed
                instance: /api/account/time-zone
                code: VALIDATION_FAILED
                errors:
                  - field: timeZone
                    code: INVALID_TIME_ZONE
                    message: Unknown time zone
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'

  /api/account/reminder-emails:
    put:
      summary: Turn reminder emails on or off
      description: |
        New in 0.14.0. Saves `User.reminderEmails`; respected from the next reminder. The in-app
        notification is created either way. Returns the updated `User`. Session and CSRF like
        `PUT /api/account/display-name`.
      operationId: setReminderEmails
      tags: [account]
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetReminderEmailsRequest'
            example:
              enabled: false
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                email: bob@example.com
                displayName: Bob
                emailVerified: true
                hasPassword: true
                connections: []
                role: USER
                timeZone: Europe/Bucharest
                reminderEmails: false
        '400':
          description: |
            `enabled` / `REQUIRED` (missing or null), in 400 `VALIDATION_FAILED`; or 400
            `MALFORMED_REQUEST` (not valid JSON, `enabled` not a boolean).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Validation failed
                instance: /api/account/reminder-emails
                code: VALIDATION_FAILED
                errors:
                  - field: enabled
                    code: REQUIRED
                    message: Enabled is required
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'

  /api/account/password:
    put:
      summary: Change my password
      description: |
        Checks `currentPassword` against the signed-in user's password, then stores `newPassword`
        (BCrypt). After this, login works only with the new password.

        **Changed in 0.6.0:** on success, all OTHER sessions and remember-me logins of this user
        are ended, exactly like `POST /api/account/logout-other-sessions`. This device stays
        signed in: the session gets a **new session id** (`Set-Cookie: JSESSIONID=<new id>` on the
        204), keeps its sign-in time (the 12-hour maximum is not reset) and keeps this device's
        `remember-me` cookie and login. The `XSRF-TOKEN` does NOT change. Wait for this response
        before sending other requests (a request still carrying the old session id would get 401,
        or be signed in again from `remember-me`). A failed change (400/429) changes nothing.

        `newPassword` follows the register password rules. It may equal the current password.

        Order of checks: body validation (400 `VALIDATION_FAILED`, the current password is not
        checked and nothing is counted) > per-user password-check limit (429) > current password
        (400 `WRONG_PASSWORD`, counted as one failure). A correct current password resets the
        per-user failure counter (see "Rate limiting").

        **0.8.0:** an account without a password (`hasPassword: false`) gets 409
        `PASSWORD_REQUIRED` after body validation, before the rate limit; nothing is changed or
        counted. Such accounts set a password with "Forgot password?" instead (the UI hides this
        form for them).
      operationId: changePassword
      tags: [account]
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              currentPassword: correct-horse
              newPassword: battery-staple-42
      responses:
        '204':
          description: |
            Password changed and other sessions ended. No body. Sets a new `JSESSIONID` only.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRenewedSessionCookie'
        '400':
          description: |
            Either `VALIDATION_FAILED` or `WRONG_PASSWORD` (see `code`). Both carry `errors`.
            - `VALIDATION_FAILED` entries:
              - `currentPassword` / `REQUIRED` / "Current password is required"
              - `newPassword` / `REQUIRED` / "New password is required"
              - `newPassword` / `PASSWORD_LENGTH` / "Password must be 8 to 72 characters"
            - `WRONG_PASSWORD`: exactly one entry,
              `currentPassword` / `WRONG_PASSWORD` / "Current password is incorrect".

            A body that is not valid JSON returns 400 `MALFORMED_REQUEST` with no `errors`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                validation:
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: Validation failed
                    instance: /api/account/password
                    code: VALIDATION_FAILED
                    errors:
                      - field: newPassword
                        code: PASSWORD_LENGTH
                        message: Password must be 8 to 72 characters
                wrongPassword:
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: Current password is incorrect
                    instance: /api/account/password
                    code: WRONG_PASSWORD
                    errors:
                      - field: currentPassword
                        code: WRONG_PASSWORD
                        message: Current password is incorrect
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '409':
          description: "The account has no password (`hasPassword: false`). Nothing changed."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: "Your account has no password. Set one with 'Forgot password?' on the sign-in page."
                instance: /api/account/password
                code: PASSWORD_REQUIRED
        '429':
          $ref: '#/components/responses/PasswordCheckRateLimited'

  /api/account/delete:
    post:
      summary: Delete my account
      description: |
        Checks `password` against the signed-in user's password, then permanently deletes the
        account and all its tasks (immediate hard delete, no restore). The email and display name
        can be registered again right away. Other users' data is not affected.

        **0.13.0, shared lists:** deleted with the account: every list it owns (with all their
        tasks and tags, whoever added them; their members lose them), its memberships of other
        people's lists and the pending invitations to its email address. **Kept:** the tasks it
        added to lists owned by other people (their `addedBy` becomes `null`, shown as "Added by
        a deleted user") and those lists' tags. The delete-account warning should say so.

        On success the server signs the caller out exactly like `POST /api/auth/logout`: the
        session is invalidated, `JSESSIONID` is expired (Max-Age=0) and a **fresh `XSRF-TOKEN`
        cookie is set on this 204 response**, so the client can call login/register next without
        first calling `GET /api/auth/me` (which would answer 401 and not re-send a cookie the
        client already has). Other sessions of the deleted account get 401 `UNAUTHENTICATED` on
        their next request (see "Authentication"). All remember-me logins of the account are
        deleted with it, and this response also expires the `remember-me` cookie (`Max-Age=0`).

        POST (not `DELETE /api/account`) because the request needs a body, and request bodies on
        DELETE are not reliably supported by proxies and HTTP clients.

        Order of checks: body validation (400 `VALIDATION_FAILED`, nothing counted) > per-user
        password-check limit (429, shared with `PUT /api/account/password`) > password
        (400 `WRONG_PASSWORD`, counted as one failure, nothing deleted).

        **0.8.0, accounts without a password** (`hasPassword: false`): confirm with `email`
        instead of `password` (see `DeleteAccountRequest`). The same order applies, with the
        email check in place of the password check: 400 `VALIDATION_FAILED` (`email` /
        `REQUIRED`) > 429 (same shared counter) > 400 `EMAIL_MISMATCH` (counted as one failure).
        The account's Google connection is deleted with it.
      operationId: deleteAccount
      tags: [account]
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
            examples:
              withPassword:
                summary: Account with a password (unchanged)
                value:
                  password: correct-horse
              withoutPassword:
                summary: Account without a password (hasPassword false)
                value:
                  email: Bob@Gmail.com
      responses:
        '204':
          description: |
            Account and tasks deleted, signed out. Expires `JSESSIONID` and `remember-me`, sets a
            fresh `XSRF-TOKEN`.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetLogoutCookies'
        '400':
          description: |
            `VALIDATION_FAILED`, `WRONG_PASSWORD` or `EMAIL_MISMATCH` (see `code`). All carry
            `errors` with exactly one entry.
            - Account with a password:
              - `VALIDATION_FAILED`: `password` / `REQUIRED` / "Password is required"
              - `WRONG_PASSWORD`: `password` / `WRONG_PASSWORD` / "Password is incorrect"
            - Account without a password:
              - `VALIDATION_FAILED`: `email` / `REQUIRED` / "Email is required"
              - `EMAIL_MISMATCH`: `email` / `EMAIL_MISMATCH` / "Email doesn't match"

            A body that is not valid JSON returns 400 `MALFORMED_REQUEST` with no `errors`.
            Nothing is deleted and the session is kept.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                validation:
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: Validation failed
                    instance: /api/account/delete
                    code: VALIDATION_FAILED
                    errors:
                      - field: password
                        code: REQUIRED
                        message: Password is required
                wrongPassword:
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: Password is incorrect
                    instance: /api/account/delete
                    code: WRONG_PASSWORD
                    errors:
                      - field: password
                        code: WRONG_PASSWORD
                        message: Password is incorrect
                emailMismatch:
                  summary: Account without a password, wrong email
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: Email doesn't match
                    instance: /api/account/delete
                    code: EMAIL_MISMATCH
                    errors:
                      - field: email
                        code: EMAIL_MISMATCH
                        message: Email doesn't match
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '429':
          description: |
            Too many wrong passwords for this user on `PUT /api/account/password` and
            `POST /api/account/delete` combined (one shared per-user counter, see "Rate limiting";
            wrong `email` confirmations of accounts without a password count too).
            Wait `Retry-After` seconds. No `errors` array. Nothing was deleted and the session is kept.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Too Many Requests
                status: 429
                detail: Too many attempts. Please try again later.
                instance: /api/account/delete
                code: RATE_LIMITED

  /api/account/connections/google:
    delete:
      summary: Disconnect my Google account
      description: |
        New in 0.8.0. Removes the signed-in user's Google connection and returns the updated
        `User` (`connections` no longer contains `google`). Afterwards, continuing with that
        Google account follows the normal login rules again (it may create a new account or be
        refused, see "Sign in with Google"). Session, cookies and `XSRF-TOKEN` are unchanged; no
        other session is ended. No request body. Not rate limited.

        Order: 403 `CSRF_INVALID` > 401 `UNAUTHENTICATED` > 404 `NOT_FOUND` (Google sign-in not
        configured, or no Google connection) > 409 `PASSWORD_REQUIRED` (the account has no
        password, so it would lose its only way to sign in; the UI disables the button) > 200.
      operationId: disconnectGoogle
      tags: [account]
      security:
        - sessionCookie: []
          csrfHeader: []
        - rememberMeCookie: []
          csrfHeader: []
      responses:
        '200':
          description: Disconnected. The body is the updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                email: bob@example.com
                displayName: Bob
                emailVerified: true
                hasPassword: true
                connections: []
                role: USER
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          description: |
            Google sign-in is not configured on the server, or the user has no Google
            connection (e.g. already disconnected in another tab: refetch `GET /api/auth/me`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: No Google account is connected
                instance: /api/account/connections/google
                code: NOT_FOUND
        '409':
          description: The account has no password. Nothing changed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: Set a password first so you don't lose access to your account.
                instance: /api/account/connections/google
                code: PASSWORD_REQUIRED

  /api/account/logout-other-sessions:
    post:
      summary: Log out all my other sessions and devices
      description: |
        Ends every session and remember-me login of the signed-in user EXCEPT the caller's own:
        - Other sessions (other browsers/devices, with or without "Remember me"): their next
          request is treated as anonymous, so protected endpoints answer **401
          `UNAUTHENTICATED`** (the normal "session expired" flow).
        - Other devices' remember-me logins are deleted, so their `remember-me` cookie is rejected
          (401, cookie expired) and reopening their browser does not sign them back in.
        - This device stays signed in. Its session gets a **new session id**
          (`Set-Cookie: JSESSIONID=<new id>`, so a copied old session id stops working too) and
          keeps its sign-in time (the 12-hour maximum is not reset). This device's remember-me
          login and `remember-me` cookie are kept unchanged. The `XSRF-TOKEN` does NOT change.
          Other tabs of the same browser share the cookies and stay signed in.

        Wait for this response before sending other requests from this tab (a request still
        carrying the old session id would get 401, or be signed in again from `remember-me`).

        No request body (a body, if sent, is ignored). Idempotent: calling it again, or with no
        other sessions, returns 204. Not rate limited. The same thing happens automatically after
        a successful `PUT /api/account/password`.

        POST (not DELETE) because it is an action, not a resource deletion.
      operationId: logoutOtherSessions
      tags: [account]
      security:
        - sessionCookie: []
          csrfHeader: []
        - rememberMeCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Other sessions ended. No body. Sets a new `JSESSIONID` only.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRenewedSessionCookie'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'

  /api/tasks:
    get:
      summary: List my tasks (one page)
      description: |
        Returns one page (at most 50) of the tasks in one of the signed-in user's lists (`list`,
        default "My tasks"), as a `TaskPage`.
        Changed in 0.11.0 (breaking): the response was a bare `Task[]`.

        **Which tasks:** the tasks of the list given by `list` (0.12.0); `filter`, `tag` and `q`
        combine (AND) inside it. Only lists the signed-in user is a member of (0.13.0: owned or
        shared), ever (admins see only their own lists too). There is no "all lists" view.

        **Checks, in order:** `list` first (404 `LIST_NOT_FOUND` when it is not one of my lists,
        even if `q` or `cursor` is invalid too), then `q` and `cursor` (400).

        **Order** (`sort`):
        1. Group: with `filter=all`, not-done tasks (`TODO` and `IN_PROGRESS` mixed) come first,
           then done tasks. Other filters contain one group only.
        2. Inside a group, by `sort`:
           - `newest` (default): `createdAt` descending, then `id` descending (the 0.10.0 order).
           - `oldest`: `createdAt` ascending, then `id` ascending (the exact reverse of `newest`).
           - `due`: `dueDate` ascending (soonest first); inside one date, tasks with a
             `dueTime` first by time ascending, then date-only tasks; tasks without a `dueDate`
             last (0.14.0: the time was added).
           - `priority`: `HIGH`, `MEDIUM`, `LOW`, `NONE`.
           - `title`: A-Z by `title`, ignoring letter case and accents (MySQL
             `utf8mb4_0900_ai_ci`), so `café` and `Cafe` are equal and tie.
        3. Ties (`due`, `priority`, `title`; for `due`: same date and same time or both
           date-only): `createdAt` descending, then `id` descending.
        Status other than done never changes the order inside a group.

        **Paging (keyset):** the first request has no `cursor`. If more tasks follow, the page has
        a non-null `nextCursor`; pass it back unchanged as `?cursor=` **with the same `list`,
        `filter`, `tag`, `q` and `sort`** to get the next page. The last page has `nextCursor: null`. The
        cursor holds the sort position of the last task returned, not an offset, so tasks added,
        edited, ticked or deleted between requests never make a later page repeat or skip a task
        that kept its place in the order. A task whose sort position changed after its page was
        loaded (e.g. retitled under `sort=title`, or ticked under `filter=all`) can be returned
        again on a later page; clients should de-duplicate by `id`. A page can be empty with
        `nextCursor: null` (e.g. the remaining tasks were deleted). Page size is fixed at 50; there
        is no `limit` parameter (unknown parameters are ignored).

        `total` is the number of tasks of the list matching `filter` + `tag` + `q` right now (all
        pages), not the number on this page. It is recomputed on every page.

        Nothing but `q` and `cursor` can cause a 400: unknown `filter` / `sort` values fall back
        to the default and an unusable `tag` gives an empty page. Nothing but `list` can cause a
        404.
      operationId: listTasks
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/ListQuery'
        - name: filter
          in: query
          required: false
          description: |
            `all` (default), `active` (status `TODO` or `IN_PROGRESS`, i.e. done = false),
            `in_progress` (status `IN_PROGRESS` only, new in 0.10.0) or `done` (status `DONE`).
            Matching is exact and case-sensitive. A missing, empty or unrecognised value
            (e.g. `?filter=foo`, `?filter=Done`) is treated as `all`; it never causes a 400.
          schema:
            type: string
            enum: [all, active, in_progress, done]
            default: all
        - name: tag
          in: query
          required: false
          description: |
            New in 0.10.0. Only tasks that have this tag. The value is normalised like a tag
            name (see "Tags") and matched ignoring letter case and accents, so `?tag=work` finds
            tasks tagged `Work`. Only the tags of the selected list are searched (0.12.0). A tag
            the list doesn't have (including a tag of another list or another user, or a value
            that could never be a valid tag, e.g. over 30 characters or with a comma) returns an
            empty page
            (`{"items": [], "total": 0, "nextCursor": null}`, changed in 0.11.0: was `[]`). A
            missing, empty or blank value means no tag filter. Repeated `tag` parameters: only the
            first is used.
          schema:
            type: string
          example: Work
        - name: q
          in: query
          required: false
          description: |
            New in 0.11.0. Search: keeps the tasks whose `title` OR `description` CONTAINS the
            text, ignoring letter case and accents (`cafe` finds `Café`, `MILK` finds `milk`).
            Every character is literal: `%`, `_` and `\` are not wildcards (`50%` finds only
            `50%`). Tags are not searched. Trimmed first; missing, empty or blank = no search.
            At most 100 characters after trimming (UTF-16 code units, JS `.length`), otherwise
            400 `VALIDATION_FAILED` with `q` / `TOO_LONG`. Repeated `q`: only the first is used.
          schema:
            type: string
            maxLength: 100
          example: milk
        - name: sort
          in: query
          required: false
          description: |
            New in 0.11.0. See "Order" above. Matching is exact and case-sensitive. A missing,
            empty or unrecognised value (e.g. `?sort=foo`, `?sort=Due`) is treated as `newest`;
            it never causes a 400.
          schema:
            type: string
            enum: [newest, oldest, due, priority, title]
            default: newest
        - name: cursor
          in: query
          required: false
          description: |
            New in 0.11.0. The `nextCursor` of the previous page, sent back unchanged. Opaque:
            clients must not build, parse or change it. Always base64url WITHOUT padding (only
            `A-Z a-z 0-9 - _`; never `+`, `/` or `=`), so it is URL-safe as is. Missing or empty =
            first page.
            400 `VALIDATION_FAILED` with `cursor` / `INVALID_CURSOR` when it cannot be read
            (altered, truncated, from another API version) or was issued for a different
            list, `filter`, `tag`, `q` or `sort` (compared after the same normalising as the
            request, e.g. `?filter=foo` and `?filter=all` are the same, and a missing `list` is
            the same as `?list=<id of My tasks>`). The client should then reload from the first
            page. A cursor never exposes or reaches another list's or user's tasks: the list is
            always checked against the session's user first.
            0.12.0: the cursor format changed (version 2, it now carries the list), so every
            cursor issued before 0.12.0 gives `INVALID_CURSOR` once. 0.14.0: version 3 (it now
            carries the due time), so every cursor issued before 0.14.0 gives `INVALID_CURSOR`
            once.
          schema:
            type: string
            maxLength: 1024
          example: eyJ2IjoyLCJzIjoibmV3ZXN0IiwiZiI6IjhjMWUiLCJrIjpbMCwiMjAyNi0xMC0wMVQxODowMDowMFoiLDddfQ
      responses:
        '200':
          description: One page of the list's tasks (possibly empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
              examples:
                firstPageMoreToCome:
                  summary: First page of 120 tasks (only 2 of the 50 items shown)
                  value:
                    items:
                      - id: 12
                        listId: 3
                        addedBy:
                          displayName: Ana
                        title: Buy milk
                        description: null
                        priority: HIGH
                        status: IN_PROGRESS
                        tags: [Errands, Home]
                        done: false
                        dueDate: '2026-10-10'
                        createdAt: '2026-10-08T09:15:02.123456Z'
                        updatedAt: '2026-10-08T09:15:02.123456Z'
                      - id: 7
                        listId: 3
                        addedBy: null
                        title: File taxes
                        description: Use last year's folder
                        priority: NONE
                        status: DONE
                        tags: []
                        done: true
                        dueDate: null
                        createdAt: '2026-10-01T18:00:00Z'
                        updatedAt: '2026-10-07T08:30:41.5Z'
                    total: 120
                    nextCursor: eyJ2IjoyLCJzIjoibmV3ZXN0IiwiZiI6IjhjMWUiLCJrIjpbMSwiMjAyNi0xMC0wMVQxODowMDowMFoiLDddfQ
                lastPage:
                  value:
                    items:
                      - id: 3
                        listId: 3
                        addedBy:
                          displayName: Ana
                        title: Call Bob
                        description: null
                        priority: LOW
                        status: TODO
                        tags: []
                        done: false
                        dueDate: null
                        createdAt: '2026-09-20T10:00:00Z'
                        updatedAt: '2026-09-20T10:00:00Z'
                    total: 1
                    nextCursor: null
                noMatch:
                  value:
                    items: []
                    total: 0
                    nextCursor: null
        '400':
          description: |
            `VALIDATION_FAILED` with one entry per invalid parameter, sorted by name:
            - `cursor` / `INVALID_CURSOR` / "The list changed, reload from the first page"
            - `q` / `TOO_LONG` / "Search must be at most 100 characters"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Validation failed
                instance: /api/tasks
                code: VALIDATION_FAILED
                errors:
                  - field: q
                    code: TOO_LONG
                    message: Search must be at most 100 characters
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ListNotFound'
    post:
      summary: Create a task
      description: |
        Creates a task added by the signed-in user (`addedBy`, 0.13.0). New tasks are always `priority: NONE`,
        `status: TODO`, `done: false` and `tags: []` (`priority`, `status`, `done` and `tags`
        properties in the body are ignored; set them with `PUT`). `title` and `description` are stripped of
        leading/trailing whitespace before validation; a blank `description` is stored as `null`.

        0.12.0: the task goes into the list `listId` (missing or `null` → "My tasks"). A
        `listId` that is not one of my lists (unknown, another user's, deleted) gives 404
        `LIST_NOT_FOUND` and nothing is created. Body validation (400) runs first.
        0.13.0: any list I'm a member of (owner or member).
      operationId: createTask
      tags: [tasks]
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
            examples:
              myTasks:
                summary: Into "My tasks" (no listId)
                value:
                  title: '  Buy milk '
                  dueDate: '2026-10-10'
              otherList:
                summary: Into another of my lists (0.12.0)
                value:
                  title: Paint the fence
                  listId: 8
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL of the new task, e.g. `/api/tasks/12`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              example:
                id: 12
                listId: 3
                addedBy:
                  displayName: Ana
                title: Buy milk
                description: null
                priority: NONE
                status: TODO
                tags: []
                done: false
                dueDate: '2026-10-10'
                createdAt: '2026-10-08T09:15:02.123456Z'
                updatedAt: '2026-10-08T09:15:02.123456Z'
        '400':
          $ref: '#/components/responses/TaskValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/ListNotFound'

  /api/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      summary: Get one of my tasks
      description: |
        Any task in any of my lists (0.12.0; 0.13.0: lists I'm a member of); `listId` says which
        list it is in.
      operationId: getTask
      tags: [tasks]
      responses:
        '200':
          description: The task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/MalformedTaskId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/TaskNotFound'
    put:
      summary: Replace a task
      description: |
        Replaces the editable fields. `title` is required. `description` and `dueDate` should
        always be sent; `null` (or omitting the property) clears the field. `title`/`description`
        are stripped before validation and a blank `description` becomes `null`. `updatedAt` is
        set to now on every successful call.

        New in 0.10.0 (so older clients can't wipe them):
        - `priority`: missing or `null` → unchanged.
        - `tags`: missing or `null` → unchanged; an array **replaces** the task's tags (`[]`
          removes all). Names follow the "Tags" rules; duplicates in the array (ignoring case and
          accents) count once. Tags the user already has are reused with their stored spelling;
          new ones are created. Tags left unused by the change are deleted.
        - `status` and `done` (`done` is no longer required):
          | Sent | Result |
          |---|---|
          | neither | status/done unchanged |
          | `status` only | status = the value; done follows it |
          | `done: true` only | status `DONE` |
          | `done: false` only | `DONE` → `TODO`; `TODO` / `IN_PROGRESS` stay as they are |
          | both, agreeing (`done == (status == DONE)`) | as `status` only |
          | both, disagreeing (e.g. `status: IN_PROGRESS, done: true`) | 400 `status` / `STATUS_CONFLICT` |

        All field errors that `@Valid` can detect (title, description, status conflict, tag
        names, more than 10 tags) are reported together. `tags` / `TAG_LIMIT` (the list would
        have more than 200 tags) needs the database, so it is only reported when everything else
        is valid; nothing is saved in that case.

        **Due time and reminder (new in 0.14.0, see "Due times and reminders"):**
        - `dueTime` (`"HH:mm"`, 24-hour, exactly 5 characters): **missing** → unchanged;
          **`null`** → cleared (the date stays); a value → set. Only valid with a due date: a
          non-null `dueTime` together with `dueDate` missing/`null` → 400 `dueTime` /
          `REQUIRES_DUE_DATE`. Clearing the `dueDate` (missing/`null`) also drops the stored
          time and every member's reminder on the task. A value that is not exactly `HH:mm`
          (`"9:30"`, `"09:30:15"`, `"24:00"`, a number) → 400 `MALFORMED_REQUEST`.
        - `reminder` (`ReminderOffset` or `NONE`): **missing/`null`** → my reminder is unchanged
          (but recomputed if the date/time changed, and cleared if its offset no longer fits the
          task: timed ↔ date-only); `NONE` → removes my reminder; an offset → sets it (one per
          user per task; other members' reminders are never touched). A non-`NONE` offset with
          `dueDate` missing/`null` → 400 `reminder` / `REQUIRES_DUE_DATE`; an offset that does not
          fit the task's resulting type (e.g. `ON_THE_DAY` on a timed task, `AT_DUE` on a
          date-only one) or is not one of the values (case-sensitive) → 400 `reminder` /
          `INVALID_REMINDER`. A fire time in the past is saved but never fires
          (`myReminderPassed: true` in the response).
        - Any member who can edit the task can set or clear its date and time; everyone sees the
          same values. `PATCH` (status/done) never changes a time or a reminder.
        - `REQUIRES_DUE_DATE` and an unknown `reminder` value are reported with the other body
          errors (before 404). Whether a valid offset fits the task depends on the stored time
          when `dueTime` is missing, so that `INVALID_REMINDER` is only reported once the task
          is found (after the 404 checks, like `TAG_LIMIT`); nothing is saved in that case.

        **Moving (new in 0.12.0):** `listId` set to another of my lists moves the task there, in
        the same request as the other changes. Missing, `null` or the task's current list → it
        stays where it is. 0.13.0: any member may move any task, from and to lists they are a
        member of; the task keeps its `addedBy`.
        - Tags after the move: the `tags` sent, or the task's current tag names when `tags` is
          missing or `null`. Each name reuses the target list's tag with the same name (ignoring
          case and accents, keeping the target's spelling) or is created in the target list.
        - Tags of the source list that no task there uses any more are deleted.
        - If the target list would have more than 200 tags: 400 `tags` / `TAG_LIMIT` ("A list can
          have at most 200 tags") and **nothing changes** (the task stays, with its fields and
          tags as they were).
        - `createdAt` is unchanged; `updatedAt` is set to now as on every PUT. The task keeps its
          `id`.

        **Checks, in order:** 400 `MALFORMED_REQUEST` (id or body) > 400 `VALIDATION_FAILED`
        (body fields) > 404 `NOT_FOUND` (the task is not in one of my lists, e.g. deleted
        meanwhile, also when its list was deleted) > 404 `LIST_NOT_FOUND` (`listId` is not one
        of my lists: unknown, another user's, deleted meanwhile) > 400 `tags` / `TAG_LIMIT`.
      operationId: replaceTask
      tags: [tasks]
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceTaskRequest'
            examples:
              edit:
                value:
                  title: Buy oat milk
                  description: null
                  dueDate: null
                  priority: HIGH
                  status: IN_PROGRESS
                  tags: [' Home ', Errands, errands]
              timedWithReminder:
                summary: Due 21 Oct 09:30, remind me 1 hour before (0.14.0)
                value:
                  title: Dentist
                  description: null
                  dueDate: '2026-10-21'
                  dueTime: '09:30'
                  reminder: ONE_HOUR
              move:
                summary: Move to list 8, keeping the current tags (0.12.0)
                value:
                  title: Buy oat milk
                  description: null
                  dueDate: null
                  listId: 8
      responses:
        '200':
          description: The updated (and possibly moved) task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              example:
                id: 12
                listId: 3
                addedBy:
                  displayName: Ana
                title: Buy oat milk
                description: null
                priority: HIGH
                status: IN_PROGRESS
                tags: [Errands, Home]
                done: false
                dueDate: null
                dueTime: null
                myReminder: null
                myReminderPassed: false
                createdAt: '2026-10-08T09:15:02.123456Z'
                updatedAt: '2026-10-08T10:02:44.901Z'
        '400':
          $ref: '#/components/responses/TaskValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/TaskOrListNotFound'
    patch:
      summary: Set a task's done state or status
      description: |
        Sets `done` and/or `status` to the given value (it does not flip it), so repeating the
        call is safe. Only `done` and `status` are read from the body; at least one is required
        (neither → 400 `done` / `REQUIRED`). They combine exactly as in `PUT` (table there):
        `done: true` → `DONE`; `done: false` turns `DONE` into `TODO` and leaves `TODO` /
        `IN_PROGRESS` as they are; `status` sets the status; both sent and disagreeing → 400
        `status` / `STATUS_CONFLICT`. `updatedAt` is set to now on every successful call, even if
        the value did not change.
      operationId: setTaskDone
      tags: [tasks]
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTaskDoneRequest'
            examples:
              tick:
                value:
                  done: true
              status:
                value:
                  status: IN_PROGRESS
      responses:
        '200':
          description: The updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              example:
                id: 12
                listId: 3
                addedBy:
                  displayName: Ana
                title: Buy milk
                description: null
                priority: NONE
                status: DONE
                tags: []
                done: true
                dueDate: '2026-10-10'
                dueTime: null
                myReminder: null
                myReminderPassed: false
                createdAt: '2026-10-08T09:15:02.123456Z'
                updatedAt: '2026-10-08T10:05:00.000123Z'
        '400':
          $ref: '#/components/responses/TaskValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/TaskNotFound'
    delete:
      summary: Delete a task permanently
      description: |
        Hard delete. Deleting a task that does not exist (or was already deleted, or whose list
        was deleted) returns 404. Tags of its list that no task uses any more are deleted.
      operationId: deleteTask
      tags: [tasks]
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/MalformedTaskId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/TaskNotFound'

  /api/tags:
    get:
      summary: List the tags of one of my lists
      description: |
        New in 0.10.0. All tags of one of the signed-in user's lists (`list`, default "My tasks";
        changed in 0.12.0: was all of the user's tags), as `Tag` objects (not bare strings, so
        fields can be added later without a breaking change), for suggestions in the tag input.
        Every returned tag is used by at least one task of that list (unused tags are deleted
        automatically, see "Tags"). Sorted alphabetically ignoring case and accents; at most 200
        entries; no pagination, no other query parameters (filtering suggestions by what the
        user typed is done by the client). Never includes another list's or user's tags.
      operationId: listTags
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/ListQuery'
      responses:
        '200':
          description: The list's tags, possibly an empty array
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  $ref: '#/components/schemas/Tag'
              example:
                - name: Errands
                - name: Home
                - name: Work
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ListNotFound'

  /api/lists:
    get:
      summary: List my lists
      description: |
        New in 0.12.0. All lists the signed-in user is a member of (0.13.0: the lists they own,
        at most 50, plus the lists shared with them, no limit), unpaged, for the list picker.
        Always contains "My tasks" (`personal: true`), which is **first**; the others (owned and
        shared mixed) follow by `name` ignoring letter case and accents (MySQL
        `utf8mb4_0900_ai_ci`), then by `id` ascending (duplicate names are allowed). Each has
        `role` and `memberCount` (0.13.0). No task counts here: use `GET /api/lists/{id}` for
        one list's count. No query parameters.

        Changed in 0.13.0: `maxItems: 50` is dropped (lists shared with me don't count towards
        the 50-list limit).
      operationId: listLists
      tags: [lists]
      responses:
        '200':
          description: My lists, "My tasks" first. Never empty.
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/TaskList'
              example:
                - id: 3
                  name: My tasks
                  personal: true
                  role: OWNER
                  memberCount: 1
                - id: 8
                  name: Home
                  personal: false
                  role: OWNER
                  memberCount: 3
                - id: 21
                  name: Team project
                  personal: false
                  role: MEMBER
                  memberCount: 5
                - id: 9
                  name: Work
                  personal: false
                  role: OWNER
                  memberCount: 1
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      summary: Create a list
      description: |
        New in 0.12.0. Creates an empty, non-personal list owned by the signed-in user, who is
        its only member (0.13.0: `role: OWNER`, `memberCount: 1`). `name`
        follows the task-title rules (see `CreateListRequest`). Duplicate names are allowed.
        A user can own at most 50 lists including "My tasks": the 51st gives 409 `LIST_LIMIT`
        and nothing is created (also when two requests race at the limit). Not rate limited
        (the 50-list limit caps it).

        **Checks, in order:** 400 (`MALFORMED_REQUEST`, then `VALIDATION_FAILED`) > 409
        `LIST_LIMIT` > 201.
      operationId: createList
      tags: [lists]
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListRequest'
            example:
              name: '  Home '
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL of the new list, e.g. `/api/lists/8`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
              example:
                id: 8
                name: Home
                personal: false
                role: OWNER
                memberCount: 1
        '400':
          $ref: '#/components/responses/ListValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '409':
          $ref: '#/components/responses/ListLimit'

  /api/lists/{id}:
    parameters:
      - $ref: '#/components/parameters/ListId'
    get:
      summary: Get one of my lists, with its task count
      description: |
        New in 0.12.0. The list plus `taskCount`: the number of tasks in it right now, of every
        status (done included). The delete dialog reads it when it opens ("Delete "Home" and
        its 12 tasks?"). 0.13.0: any member may read it (also `role` and `memberCount`).
      operationId: getList
      tags: [lists]
      responses:
        '200':
          description: The list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListDetails'
              example:
                id: 8
                name: Home
                personal: false
                role: OWNER
                memberCount: 3
                taskCount: 12
        '400':
          $ref: '#/components/responses/MalformedListId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ListNotFound'
    patch:
      summary: Rename a list
      description: |
        New in 0.12.0. Sets the list's name. Works on "My tasks" too (it stays the personal
        list). Same `name` rules as create; duplicate names are allowed; sending the current
        name succeeds and changes nothing visible. Only `name` is read from the body.
        0.13.0: owner only; members see the new name on their next read.

        **Checks, in order:** 400 (`MALFORMED_REQUEST` for the id or body, then
        `VALIDATION_FAILED`) > 404 `LIST_NOT_FOUND` (not a member) > 403 `OWNER_ONLY` (a member,
        0.13.0) > 200.
      operationId: renameList
      tags: [lists]
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameListRequest'
            example:
              name: Groceries
      responses:
        '200':
          description: The renamed list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
              example:
                id: 8
                name: Groceries
                personal: false
                role: OWNER
                memberCount: 3
        '400':
          $ref: '#/components/responses/ListValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfOrOwnerOnly'
        '404':
          $ref: '#/components/responses/ListNotFound'
    delete:
      summary: Delete a list with its tasks and tags
      description: |
        New in 0.12.0. Permanently deletes the list, every task in it and every tag of it. Not
        reversible. "My tasks" can't be deleted: 409 `PERSONAL_LIST`, nothing changes.
        Deleting a list that does not exist (or was already deleted) gives 404. Requests still
        running on its tasks (edits, moves into or out of it) get 404 too, never 500.
        0.13.0: owner only. Its members, memberships and pending invitations go with it; the
        list leaves every member's picker (their next request for it gets 404).

        **Checks, in order:** 400 `MALFORMED_REQUEST` > 404 `LIST_NOT_FOUND` (not a member; so
        another user's "My tasks" is a 404, not a 409) > 403 `OWNER_ONLY` (a member, 0.13.0) >
        409 `PERSONAL_LIST` > 204.
      operationId: deleteList
      tags: [lists]
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Deleted. No body.
        '400':
          $ref: '#/components/responses/MalformedListId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfOrOwnerOnly'
        '404':
          $ref: '#/components/responses/ListNotFound'
        '409':
          $ref: '#/components/responses/PersonalList'

  /api/lists/{id}/members:
    parameters:
      - $ref: '#/components/parameters/ListId'
    get:
      summary: List the members of a list
      description: |
        New in 0.13.0. Every member of the list, the owner included, with display name, email and
        role, for the members panel. Any member may call it. Order: the owner first, then by
        `displayName` ignoring letter case and accents, then by `userId`. "My tasks" (and any
        list not shared yet) has only its owner. Pending invitations are a separate call
        (`GET /api/lists/{id}/invitations`, owner only).

        **Checks, in order:** 400 `MALFORMED_REQUEST` > 404 `LIST_NOT_FOUND` (not a member) > 200.
      operationId: listMembers
      tags: [lists]
      responses:
        '200':
          description: The members, owner first. Never empty.
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 20
                items:
                  $ref: '#/components/schemas/Member'
              example:
                - userId: 4
                  displayName: Ana
                  email: ana@example.com
                  role: OWNER
                  joinedAt: '2026-10-01T09:00:00Z'
                - userId: 9
                  displayName: Bob
                  email: bob@example.com
                  role: MEMBER
                  joinedAt: '2026-10-19T10:12:30.5Z'
        '400':
          $ref: '#/components/responses/MalformedListId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ListNotFound'

  /api/lists/{id}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/MemberUserId'
    delete:
      summary: Remove a member (owner only)
      description: |
        New in 0.13.0. The owner removes a member. Their next request for the list or its tasks
        gets 404 and the list leaves their picker; the tasks they added stay (with their display
        name in `addedBy`). They can be invited again later. A request of theirs already running
        may still finish. A member who wants to leave uses `POST /api/lists/{id}/leave` (this
        endpoint gives them 403 `OWNER_ONLY`, also for their own `userId`).

        **Checks, in order:** 400 `MALFORMED_REQUEST` (either id) > 404 `LIST_NOT_FOUND` (the
        caller is not a member) > 403 `OWNER_ONLY` (the caller is a member, not the owner) >
        409 `OWNER_CANNOT_LEAVE` (`userId` is the owner) > 404 `MEMBER_NOT_FOUND` (`userId` is
        not a member of this list, e.g. already removed or left) > 204.
      operationId: removeMember
      tags: [lists]
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Removed. No body.
        '400':
          $ref: '#/components/responses/MalformedSharingId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfOrOwnerOnly'
        '404':
          $ref: '#/components/responses/ListOrMemberNotFound'
        '409':
          $ref: '#/components/responses/OwnerCannotLeave'

  /api/lists/{id}/leave:
    parameters:
      - $ref: '#/components/parameters/ListId'
    post:
      summary: Leave a list (members only)
      description: |
        New in 0.13.0. The signed-in member leaves the list: they lose access (404 from now on)
        and the list leaves their picker. The tasks they added stay. No body. The owner can't
        leave (409 `OWNER_CANNOT_LEAVE`; they can only delete the list), so "My tasks" can never
        be left. Leaving again gives 404.

        **Checks, in order:** 400 `MALFORMED_REQUEST` > 404 `LIST_NOT_FOUND` (not a member) >
        409 `OWNER_CANNOT_LEAVE` > 204.
      operationId: leaveList
      tags: [lists]
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Left. No body.
        '400':
          $ref: '#/components/responses/MalformedListId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/ListNotFound'
        '409':
          $ref: '#/components/responses/OwnerCannotLeave'

  /api/lists/{id}/invitations:
    parameters:
      - $ref: '#/components/parameters/ListId'
    get:
      summary: List a list's pending invitations (owner only)
      description: |
        New in 0.13.0. The list's pending invitations (not expired), newest first (`invitedAt`
        descending, then `id` descending), for the members panel. Each shows the address as
        typed (trimmed, lowercased) and when it expires; never whether an account has that
        address. "My tasks" gives `[]`.

        **Checks, in order:** 400 `MALFORMED_REQUEST` > 404 `LIST_NOT_FOUND` (not a member) >
        403 `OWNER_ONLY` (a member) > 200.
      operationId: listListInvitations
      tags: [lists]
      responses:
        '200':
          description: Pending invitations, possibly an empty array
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  $ref: '#/components/schemas/ListInvitation'
              example:
                - id: 31
                  email: carol@example.com
                  invitedAt: '2026-10-19T10:00:00Z'
                  expiresAt: '2026-11-02T10:00:00Z'
        '400':
          $ref: '#/components/responses/MalformedListId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OwnerOnly'
        '404':
          $ref: '#/components/responses/ListNotFound'
    post:
      summary: Invite someone by email (owner only)
      description: |
        New in 0.13.0. Invites an email address to the list. **The response is always the same
        201 with the pending invitation, whether or not an account has that address**, and the
        invitation is stored the same way (see "Sharing"). An email is sent in the background,
        after the response, only if an active (not disabled) account has that address (verified
        or not), at most 5 per recipient per hour (silent). The invitation expires after 14
        days. Inviting an address whose invitation has expired refreshes it (same `id`, new
        `invitedAt` / `expiresAt`) and answers 201 as well. Only `email` is read from the body.

        **Checks, in order:**
        1. 400 `MALFORMED_REQUEST` (id or body), then 400 `VALIDATION_FAILED` (`email`)
        2. 404 `LIST_NOT_FOUND` (not a member)
        3. 403 `OWNER_ONLY` (a member)
        4. 409 `PERSONAL_LIST` ("My tasks" can't be shared)
        5. 429 `RATE_LIMITED` (per inviter, see "Rate limiting"; counted from here on)
        6. 409 `ALREADY_MEMBER` (the address is a current member's, the owner's included)
        7. 409 `ALREADY_INVITED` (a pending, not expired, invitation for this address exists)
        8. 409 `MEMBER_LIMIT` (the list already has 20 members)
        9. 409 `INVITATION_LIMIT` (the list already has 20 pending invitations)
        10. 201

        Addresses are compared ignoring letter case and accents (like login).
      operationId: createInvitation
      tags: [lists]
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
            example:
              email: ' Carol@Example.com '
      responses:
        '201':
          description: Invitation sent (pending). Same response whether or not an account exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInvitation'
              example:
                id: 31
                email: carol@example.com
                invitedAt: '2026-10-19T10:00:00Z'
                expiresAt: '2026-11-02T10:00:00Z'
        '400':
          $ref: '#/components/responses/InvitationValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfOrOwnerOnly'
        '404':
          $ref: '#/components/responses/ListNotFound'
        '409':
          $ref: '#/components/responses/InvitationConflict'
        '429':
          $ref: '#/components/responses/InviteRateLimited'

  /api/lists/{id}/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/ListInvitationId'
    delete:
      summary: Cancel an invitation (owner only)
      description: |
        New in 0.13.0. Deletes the invitation; it can't be accepted any more (the invitee gets
        "This invitation is no longer valid"). An expired invitation can be cancelled too (204).
        No email is sent.

        **Checks, in order:** 400 `MALFORMED_REQUEST` (either id) > 404 `LIST_NOT_FOUND` (not a
        member) > 403 `OWNER_ONLY` (a member) > 404 `INVITATION_NOT_FOUND` (no such invitation
        on this list, e.g. already accepted, declined or cancelled) > 204.
      operationId: cancelInvitation
      tags: [lists]
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Cancelled. No body.
        '400':
          $ref: '#/components/responses/MalformedSharingId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfOrOwnerOnly'
        '404':
          $ref: '#/components/responses/ListOrInvitationNotFound'

  /api/invitations:
    get:
      summary: My pending invitations
      description: |
        New in 0.13.0. The pending (not expired) invitations to the signed-in user's email
        address, newest first (`invitedAt` descending, then `id` descending), with who invited
        me (the list owner's display name) and to which list. Matched by email ignoring letter
        case and accents, **only when my email is verified**: for an unverified account this is
        always `[]` (the frontend uses `GET /api/auth/me` `emailVerified` to explain that the
        email must be confirmed first). Unpaged. No query parameters.
      operationId: listMyInvitations
      tags: [invitations]
      responses:
        '200':
          description: My pending invitations, possibly an empty array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyInvitation'
              example:
                - id: 31
                  list:
                    id: 8
                    name: Home
                  invitedBy:
                    displayName: Ana
                  invitedAt: '2026-10-19T10:00:00Z'
                  expiresAt: '2026-11-02T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/invitations/count:
    get:
      summary: How many pending invitations I have
      description: |
        New in 0.13.0. For the header badge: the number of entries `GET /api/invitations` would
        return right now (0 for an unverified account).
      operationId: countMyInvitations
      tags: [invitations]
      responses:
        '200':
          description: The count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationCount'
              example:
                count: 2
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/invitations/{id}/accept:
    parameters:
      - $ref: '#/components/parameters/MyInvitationId'
    post:
      summary: Accept an invitation
      description: |
        New in 0.13.0. Makes the signed-in user a member of the invitation's list (`role:
        MEMBER`) and deletes the invitation. Returns the list as it appears in
        `GET /api/lists`, so the client can add it to the picker. Accepting an invitation to a
        list I'm already a member of also answers 200 (with my current role) and deletes the
        invitation. No body.

        **Checks, in order:** 400 `MALFORMED_REQUEST` > 404 `INVITATION_NOT_FOUND` (detail "This
        invitation is no longer valid": unknown id, not for my email, my email not verified,
        expired, cancelled, declined, already accepted, or its list was deleted; identical body
        in every case) > 409 `MEMBER_LIMIT` (the list has 20 members; the invitation is kept) >
        200.
      operationId: acceptInvitation
      tags: [invitations]
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: Accepted; the list I'm now a member of
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
              example:
                id: 8
                name: Home
                personal: false
                role: MEMBER
                memberCount: 4
        '400':
          $ref: '#/components/responses/MalformedSharingId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/InvitationNotFound'
        '409':
          $ref: '#/components/responses/MemberLimit'

  /api/invitations/{id}/decline:
    parameters:
      - $ref: '#/components/parameters/MyInvitationId'
    post:
      summary: Decline an invitation
      description: |
        New in 0.13.0. Deletes the invitation; nothing else changes and the owner is not
        notified (it just leaves their pending list). The owner may invite the address again.
        No body.

        **Checks, in order:** 400 `MALFORMED_REQUEST` > 404 `INVITATION_NOT_FOUND` (same cases
        and body as accept) > 204.
      operationId: declineInvitation
      tags: [invitations]
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Declined. No body.
        '400':
          $ref: '#/components/responses/MalformedSharingId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/InvitationNotFound'

  /api/notifications:
    get:
      summary: My notifications (one page, newest first)
      description: |
        New in 0.14.0. My in-app notifications, newest first (`createdAt` descending, then `id`
        descending). Only mine: another user's notifications are never returned. Notifications
        older than 90 days are deleted. Keyset paging: pass `nextCursor` back as `?cursor=`.

        **Checks, in order:** 400 `limit` / `OUT_OF_RANGE` (not an integer 1-50) and 400 `cursor`
        / `INVALID_CURSOR` (reported together in `errors`) > 200.
      operationId: listNotifications
      tags: [notifications]
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size, 1-50. Default 20. With a repeated parameter the first value is used.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          description: |
            The `nextCursor` of the previous page. Unreadable or altered → 400 `cursor` /
            `INVALID_CURSOR`; reload from the first page.
          schema:
            type: string
            maxLength: 1024
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
              example:
                items:
                  - id: 41
                    type: REMINDER
                    read: false
                    createdAt: '2026-10-21T06:30:01.120Z'
                    late: false
                    title: Buy milk
                    dueDate: '2026-10-21'
                    dueTime: '09:30'
                    taskId: 12
                    listId: 3
                nextCursor: null
        '400':
          description: Validation failed (`limit` / `OUT_OF_RANGE`, `cursor` / `INVALID_CURSOR`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Validation failed
                instance: /api/notifications
                code: VALIDATION_FAILED
                errors:
                  - field: limit
                    code: OUT_OF_RANGE
                    message: Limit must be between 1 and 50
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/notifications/count:
    get:
      summary: How many unread notifications I have
      description: |
        New in 0.14.0. For the header bell: the number of my unread notifications (0 = no badge).
      operationId: countMyNotifications
      tags: [notifications]
      responses:
        '200':
          description: The count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationCount'
              example:
                count: 3
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/notifications/read-all:
    post:
      summary: Mark all my notifications as read
      description: New in 0.14.0. No body. Idempotent (also 204 when nothing was unread).
      operationId: readAllNotifications
      tags: [notifications]
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Done. No body.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'

  /api/notifications/{id}/read:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    post:
      summary: Mark one notification as read
      description: |
        New in 0.14.0. No body. Idempotent: reading an already read notification answers 200
        with the same notification.

        **Checks, in order:** 400 `MALFORMED_REQUEST` > 404 `NOTIFICATION_NOT_FOUND` (unknown id
        or another user's) > 200.
      operationId: readNotification
      tags: [notifications]
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: The notification, now read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
              example:
                id: 41
                type: REMINDER
                read: true
                createdAt: '2026-10-21T06:30:01.120Z'
                late: false
                title: Buy milk
                dueDate: '2026-10-21'
                dueTime: '09:30'
                taskId: 12
                listId: 3
        '400':
          $ref: '#/components/responses/MalformedNotificationId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotificationNotFound'

  /api/admin/users:
    get:
      summary: List and search all accounts (admins only)
      description: |
        New in 0.9.0. Every account, including admins, super admins and the caller (the client
        marks the caller's own row by comparing `id` with `GET /api/auth/me`). Sorted newest
        first: `createdAt` descending, then `id` descending. Returns only the `AdminUser` fields:
        never tasks, task counts, passwords or Google ids.

        - `q` (optional): trimmed; empty or blank = no filter. Keeps the accounts whose `email`
          OR `displayName` CONTAINS it, ignoring letter case and accents (`jose` finds
          `José`). `%` and `_` are matched literally. At most 100 characters after trimming
          (`q` / `TOO_LONG`).
        - `page` (optional, default 0): zero-based page number, >= 0 (`page` / `OUT_OF_RANGE`).
          A page past the end gives an empty `content` with the real `totalElements` and
          `totalPages`.
        - `size` (optional, default 20): 1-100 (`size` / `OUT_OF_RANGE`).
        A non-integer `page` or `size` gives 400 `MALFORMED_REQUEST`.

        GET, so no CSRF token. Not rate limited. Like any endpoint, an expired session is signed
        in again from a valid `remember-me` cookie.
      operationId: listAdminUsers
      tags: [admin]
      security:
        - sessionCookie: []
        - rememberMeCookie: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          example: jose
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: One page of accounts (possibly empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPage'
              examples:
                firstPage:
                  value:
                    content:
                      - id: 42
                        email: alice@example.com
                        displayName: Alice
                        createdAt: '2026-10-15T09:12:44.123456Z'
                        emailVerified: true
                        googleConnected: false
                        role: USER
                        disabled: false
                      - id: 7
                        email: carol@gmail.com
                        displayName: Carol
                        createdAt: '2026-10-12T18:01:02Z'
                        emailVerified: true
                        googleConnected: true
                        role: ADMIN
                        disabled: false
                    page: 0
                    size: 20
                    totalElements: 2
                    totalPages: 1
                noMatch:
                  value:
                    content: []
                    page: 0
                    size: 20
                    totalElements: 0
                    totalPages: 0
        '400':
          description: |
            `VALIDATION_FAILED` with one entry per invalid parameter, sorted by name:
            - `page` / `OUT_OF_RANGE` / "Page must be 0 or more"
            - `q` / `TOO_LONG` / "Search must be at most 100 characters"
            - `size` / `OUT_OF_RANGE` / "Size must be between 1 and 100"

            A non-integer `page` or `size` gives `MALFORMED_REQUEST` with no `errors`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Validation failed
                instance: /api/admin/users
                code: VALIDATION_FAILED
                errors:
                  - field: size
                    code: OUT_OF_RANGE
                    message: Size must be between 1 and 100
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAdmin'

  /api/admin/users/{id}/disable:
    parameters:
      - $ref: '#/components/parameters/AdminUserId'
    post:
      summary: Disable an account
      description: |
        New in 0.9.0. Sets the account to disabled and, in the same transaction, ends all of its
        sessions (their next request gets 401 `ACCOUNT_DISABLED`), deletes all of its
        `remember-me` logins and its unused password-reset links. Its data is kept. Already
        disabled: 200, nothing changes. No request body (ignored if sent).

        Allowed: `ADMIN` on a `USER`; `SUPER_ADMIN` on a `USER` or an `ADMIN`. See "Admin" for
        the order of the error responses.
      operationId: disableUser
      tags: [admin]
      security:
        - sessionCookie: []
          csrfHeader: []
        - rememberMeCookie: []
          csrfHeader: []
      responses:
        '200':
          description: 'The account as it is now (`disabled: true`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
              example:
                id: 42
                email: alice@example.com
                displayName: Alice
                createdAt: '2026-10-15T09:12:44.123456Z'
                emailVerified: true
                googleConnected: false
                role: USER
                disabled: true
        '400':
          $ref: '#/components/responses/MalformedUserId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminActionForbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/CannotModifySelf'
        '429':
          $ref: '#/components/responses/AdminRateLimited'

  /api/admin/users/{id}/enable:
    parameters:
      - $ref: '#/components/parameters/AdminUserId'
    post:
      summary: Enable a disabled account
      description: |
        New in 0.9.0. Clears the disabled state only: the user signs in again normally. Sessions,
        `remember-me` logins and reset links ended by the disable stay ended. Already active:
        200, nothing changes. No request body (ignored if sent). Same permission rules as
        disable.
      operationId: enableUser
      tags: [admin]
      security:
        - sessionCookie: []
          csrfHeader: []
        - rememberMeCookie: []
          csrfHeader: []
      responses:
        '200':
          description: 'The account as it is now (`disabled: false`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/MalformedUserId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminActionForbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/CannotModifySelf'
        '429':
          $ref: '#/components/responses/AdminRateLimited'

  /api/admin/users/{id}/revoke-sessions:
    parameters:
      - $ref: '#/components/parameters/AdminUserId'
    post:
      summary: Sign an account out everywhere
      description: |
        New in 0.9.0. Ends every session of the account (their next request gets the usual 401
        `UNAUTHENTICATED`) and deletes all of its `remember-me` logins, like
        `POST /api/account/logout-other-sessions` but including every device. The account stays
        active (or disabled, if it was). Always does this (also when there was nothing to end)
        and returns 200. No request body (ignored if sent). Same permission rules as disable.
      operationId: revokeUserSessions
      tags: [admin]
      security:
        - sessionCookie: []
          csrfHeader: []
        - rememberMeCookie: []
          csrfHeader: []
      responses:
        '200':
          description: The account (unchanged fields).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/MalformedUserId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminActionForbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/CannotModifySelf'
        '429':
          $ref: '#/components/responses/AdminRateLimited'

  /api/admin/users/{id}/role:
    parameters:
      - $ref: '#/components/parameters/AdminUserId'
    put:
      summary: Make an account admin, or remove admin (super admins only)
      description: |
        New in 0.9.0. `SUPER_ADMIN` only, on a `USER` or `ADMIN` account; an `ADMIN` gets 403
        `INSUFFICIENT_ROLE`. The new role applies to that user's next request (no new sign-in);
        their sessions are not ended. Same role as now: 200, nothing changes.

        `role` must be `USER` or `ADMIN` (exactly, case-sensitive): `SUPER_ADMIN`, any other
        value, `null` or a missing `role` give 400 `VALIDATION_FAILED` `role` / `INVALID_ROLE`.
        A body that is not JSON gives 400 `MALFORMED_REQUEST`.
      operationId: changeUserRole
      tags: [admin]
      security:
        - sessionCookie: []
          csrfHeader: []
        - rememberMeCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
            example:
              role: ADMIN
      responses:
        '200':
          description: The account with its new role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
              example:
                id: 42
                email: alice@example.com
                displayName: Alice
                createdAt: '2026-10-15T09:12:44.123456Z'
                emailVerified: true
                googleConnected: false
                role: ADMIN
                disabled: false
        '400':
          description: |
            `VALIDATION_FAILED` with `role` / `INVALID_ROLE` / "Role must be USER or ADMIN", or
            `MALFORMED_REQUEST` (non-integer `{id}`, or a body that is not JSON) with no `errors`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Validation failed
                instance: /api/admin/users/42/role
                code: VALIDATION_FAILED
                errors:
                  - field: role
                    code: INVALID_ROLE
                    message: Role must be USER or ADMIN
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminActionForbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/CannotModifySelf'
        '429':
          $ref: '#/components/responses/AdminRateLimited'

  /api/admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/AdminUserId'
    delete:
      summary: Delete an account permanently
      description: |
        New in 0.9.0. Deletes the account with its tasks, Google connections, `remember-me`
        logins and email links, exactly like the user deleting their own account
        (`POST /api/account/delete`). Their open sessions end on their next request (401
        `UNAUTHENTICATED`). Not reversible. The typed-email confirmation is client-side only:
        the API takes no body. Same permission rules as disable. Already deleted: 404
        `USER_NOT_FOUND`.

        0.13.0: shared lists are handled exactly as in `POST /api/account/delete`: the lists the
        account owns are deleted for every member, its memberships and the pending invitations
        to its address go, and the tasks it added to other people's lists stay with
        `addedBy: null`, as do those lists' tags.
      operationId: deleteUser
      tags: [admin]
      security:
        - sessionCookie: []
          csrfHeader: []
        - rememberMeCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Deleted. No body.
        '400':
          $ref: '#/components/responses/MalformedUserId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminActionForbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/CannotModifySelf'
        '429':
          $ref: '#/components/responses/AdminRateLimited'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: |
        HttpOnly session cookie set by register/login (and by an automatic remember-me sign-in).
        30-minute idle timeout; 12-hour maximum for normal sessions (see "Session lifetime").
    rememberMeCookie:
      type: apiKey
      in: cookie
      name: remember-me
      description: |
        Long-lived remember-me credential. Never read, parsed or sent manually by clients; the
        browser sends it automatically. When there is no valid session it signs the user in on
        any `/api/**` request (see "Remember me").

        `remember-me=<opaque value>; Path=/api; Max-Age=<seconds left>; HttpOnly; SameSite=Lax`
        plus `Secure` when the server runs with `REQUIRE_HTTPS=true` (production default; without
        it, Secure follows whether the request arrived over HTTPS). No `Domain` (host-only).
        - Value: opaque, contains a random per-device series id and a random secret (256 bits
          each). The server stores only SHA-256 hashes of both.
        - Lifetime: 30 days (`REMEMBER_ME_LENGTH`) from the login with `rememberMe: true`. Every
          rotation re-sends the cookie with `Max-Age` = the seconds LEFT until that original
          expiry, so the lifetime is never extended.
        - Set by: `POST /api/auth/login` with `rememberMe: true`; rotated on every automatic
          sign-in.
        - Expired (`Max-Age=0`) by: logout, account delete, login with `rememberMe: false` or
          register when the request carried one, and any response that rejects it.
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: |
        Must equal the current value of the `XSRF-TOKEN` cookie. Required on every
        POST/PUT/PATCH/DELETE.

  parameters:
    TaskId:
      name: id
      in: path
      required: true
      description: |
        Task id. A task that does not exist or belongs to another user returns 404 (identical
        body in both cases). A non-integer id returns 400 `MALFORMED_REQUEST`.
      schema:
        type: integer
        format: int64
        example: 12

    ListId:
      name: id
      in: path
      required: true
      description: |
        List id (0.12.0). A list that does not exist, was deleted or belongs to another user
        returns 404 `LIST_NOT_FOUND` (identical body in every case). A non-integer id returns
        400 `MALFORMED_REQUEST`. 0.13.0: "belongs to another user" means "I'm not a member of
        it" (never was, left or was removed).
      schema:
        type: integer
        format: int64
        example: 8

    MemberUserId:
      name: userId
      in: path
      required: true
      description: |
        New in 0.13.0. User id of a member (`Member.userId`). Not a member of this list → 404
        `MEMBER_NOT_FOUND`. A non-integer id returns 400 `MALFORMED_REQUEST`.
      schema:
        type: integer
        format: int64
        example: 9

    ListInvitationId:
      name: invitationId
      in: path
      required: true
      description: |
        New in 0.13.0. Id of one of the list's invitations (`ListInvitation.id`). Not an
        invitation of this list → 404 `INVITATION_NOT_FOUND`. A non-integer id returns 400
        `MALFORMED_REQUEST`.
      schema:
        type: integer
        format: int64
        example: 31

    MyInvitationId:
      name: id
      in: path
      required: true
      description: |
        New in 0.13.0. Id of one of my pending invitations (`MyInvitation.id`). Anything else →
        404 `INVITATION_NOT_FOUND` ("This invitation is no longer valid"). A non-integer id
        returns 400 `MALFORMED_REQUEST`.
      schema:
        type: integer
        format: int64
        example: 31

    NotificationId:
      name: id
      in: path
      required: true
      description: |
        New in 0.14.0. Id of one of my notifications. Unknown or another user's → 404
        `NOTIFICATION_NOT_FOUND` (identical body). A non-integer id returns 400
        `MALFORMED_REQUEST`.
      schema:
        type: integer
        format: int64
        example: 41

    ListQuery:
      name: list
      in: query
      required: false
      description: |
        New in 0.12.0. Id of one of my lists. Missing or empty (`?list=`) → "My tasks". Anything
        else that is not the id of one of my lists gives **404 `LIST_NOT_FOUND`** (never 400):
        an unknown id, another user's list, a deleted list, `0`, a negative number, or a value
        that is not a plain decimal integer (e.g. `abc`, `1.5`, ` 3`). Checked before every
        other parameter. Repeated `list` parameters: only the first is used. 0.13.0: any list
        I'm a member of (owned or shared); a list I left or was removed from is a 404.
      schema:
        type: string
      example: '8'

    AdminUserId:
      name: id
      in: path
      required: true
      description: |
        The target account's id (`AdminUser.id`). A non-integer id returns 400
        `MALFORMED_REQUEST`; an id with no account returns 404 `USER_NOT_FOUND`.
      schema:
        type: integer
        format: int64
        example: 42

  headers:
    SetSessionAndXsrfCookies:
      description: |
        `JSESSIONID=<id>; Path=/; HttpOnly; SameSite=Lax` (expired with Max-Age=0 on logout) and
        `XSRF-TOKEN=<new token>; Path=/; SameSite=Lax`.
        Register also expires a `remember-me` cookie the request carried
        (`remember-me=; Path=/api; Max-Age=0`).
      schema:
        type: string
    SetLoginCookies:
      description: |
        `JSESSIONID=<new id>; Path=/; HttpOnly; SameSite=Lax`,
        `XSRF-TOKEN=<new token>; Path=/; SameSite=Lax`, and
        - with `rememberMe: true`: `remember-me=<value>; Path=/api; Max-Age=2592000; HttpOnly; SameSite=Lax`
          (+ `Secure`, see the `rememberMeCookie` scheme)
        - with `rememberMe: false` and a `remember-me` cookie in the request:
          `remember-me=; Path=/api; Max-Age=0`
      schema:
        type: string
    SetLogoutCookies:
      description: |
        `JSESSIONID=; Path=/; Max-Age=0; HttpOnly; SameSite=Lax`,
        `remember-me=; Path=/api; Max-Age=0; HttpOnly; SameSite=Lax` and
        `XSRF-TOKEN=<new token>; Path=/; SameSite=Lax`
      schema:
        type: string
    SetXsrfOrRememberMeSignInCookies:
      description: |
        Normally only `XSRF-TOKEN=<token>; Path=/; SameSite=Lax`, when the request did not carry
        one. After an automatic remember-me sign-in (on ANY endpoint, not only this one):
        `JSESSIONID=<new id>; Path=/; HttpOnly; SameSite=Lax`,
        `XSRF-TOKEN=<new token>; Path=/; SameSite=Lax` (exactly one) and
        `remember-me=<rotated value>; Path=/api; Max-Age=<seconds left>; HttpOnly; SameSite=Lax`.
        A rejected `remember-me` cookie is expired: `remember-me=; Path=/api; Max-Age=0`.
      schema:
        type: string
    SetGoogleLoginCookies:
      description: |
        Only on a successful Google login (302 to `/tasks`):
        `JSESSIONID=<new id>; Path=/; HttpOnly; SameSite=Lax`,
        `XSRF-TOKEN=<new token>; Path=/; SameSite=Lax`, and, when the request carried one,
        `remember-me=; Path=/api; Max-Age=0`. Never sets a `remember-me` cookie.
        On every other outcome no session or `remember-me` cookie is set (an anonymous session
        created only for the flow is invalidated server-side); `XSRF-TOKEN` only when the request
        had none.
      schema:
        type: string
    SetRenewedSessionCookie:
      description: |
        `JSESSIONID=<new id>; Path=/; HttpOnly; SameSite=Lax`. Same session (same user, same
        sign-in time), new id. `XSRF-TOKEN` and `remember-me` are not changed.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before trying again (integer, at least 1).
      schema:
        type: integer
        minimum: 1
      example: 840

  responses:
    RateLimited:
      description: |
        Too many attempts (see "Rate limiting" above). Wait `Retry-After` seconds before retrying.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            detail: Too many attempts. Please try again later.
            instance: /api/auth/login
            code: RATE_LIMITED
    PasswordCheckRateLimited:
      description: |
        Too many wrong passwords for this user on `PUT /api/account/password` and
        `POST /api/account/delete` combined (one shared per-user counter, see "Rate limiting").
        Wait `Retry-After` seconds. No `errors` array. Nothing was changed or deleted.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            detail: Too many attempts. Please try again later.
            instance: /api/account/password
            code: RATE_LIMITED
    Unauthenticated:
      description: |
        Not signed in: no session, session expired (30-minute idle or maximum length), session
        ended by "log out other sessions" or a password change on another device or a password
        reset by email or "sign out everywhere" by an admin, or the
        session's account was deleted; and no valid `remember-me` cookie. Always the same body
        (`UNAUTHENTICATED`), except:

        **0.9.0:** `ACCOUNT_DISABLED` (detail "This account has been disabled.") when this
        request's session (or `remember-me` login) belonged to an account that is now disabled.
        Treat it like any 401 (signed out), and show the message on `/login`. Later requests
        without that session get the usual `UNAUTHENTICATED`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unauthenticated:
              value:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Authentication required
                instance: /api/auth/me
                code: UNAUTHENTICATED
            accountDisabled:
              value:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: This account has been disabled.
                instance: /api/tasks
                code: ACCOUNT_DISABLED
    NotAdmin:
      description: |
        403 `FORBIDDEN`: the caller is signed in but is not an `ADMIN` or `SUPER_ADMIN` (0.9.0).
        No CSRF check applies to GET.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: Access denied
            instance: /api/admin/users
            code: FORBIDDEN
    AdminActionForbidden:
      description: |
        One of (0.9.0):
        - `CSRF_INVALID`: missing or invalid CSRF token.
        - `FORBIDDEN` (detail "Access denied"): the caller is not an `ADMIN` or `SUPER_ADMIN`,
          also when their role was lowered to `USER` a moment before this request was handled.
        - `INSUFFICIENT_ROLE` (detail "You don't have permission to do this."): the caller is an
          admin but may not do this: the target is a `SUPER_ADMIN`, or the target is an `ADMIN`
          and the caller is an `ADMIN`, or the caller is an `ADMIN` changing a role.
        Nothing was changed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            csrf:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                detail: Invalid or missing CSRF token
                instance: /api/admin/users/42/disable
                code: CSRF_INVALID
            notAdmin:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                detail: Access denied
                instance: /api/admin/users/42/disable
                code: FORBIDDEN
            insufficientRole:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                detail: You don't have permission to do this.
                instance: /api/admin/users/42/disable
                code: INSUFFICIENT_ROLE
    UserNotFound:
      description: No account has this id (e.g. it was deleted meanwhile). Nothing was changed (0.9.0).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: This user no longer exists.
            instance: /api/admin/users/42/disable
            code: USER_NOT_FOUND
    CannotModifySelf:
      description: |
        The target is the caller's own account (0.9.0). Use `/api/account/*` for your own
        account. Nothing was changed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: You can't do this to your own account.
            instance: /api/admin/users/1/disable
            code: CANNOT_MODIFY_SELF
    AdminRateLimited:
      description: |
        Too many admin changes by this admin (default 60 per minute, see "Rate limiting").
        Wait `Retry-After` seconds. Nothing was changed.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            detail: Too many attempts. Please try again later.
            instance: /api/admin/users/42/disable
            code: RATE_LIMITED
    MalformedUserId:
      description: The `{id}` path segment is not an integer (0.9.0).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: Failed to convert 'id' with value 'abc'
            instance: /api/admin/users/abc/disable
            code: MALFORMED_REQUEST
    TokenInvalid:
      description: |
        The link token is invalid: unknown, malformed, missing or blank, expired, already used,
        replaced by a newer one, or for the other purpose. One response for every case (the
        reason is only in the server's security log). No `errors` array. Nothing was changed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: This link is invalid or has expired.
            instance: /api/auth/verify-email
            code: TOKEN_INVALID
    ProviderNotFound:
      description: |
        Google sign-in is not configured on this server (`GET /api/auth/providers` says
        `google: false`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: Not found
            instance: /api/auth/oauth2/callback/google
            code: NOT_FOUND
    CsrfInvalid:
      description: Missing or invalid CSRF token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: Invalid or missing CSRF token
            instance: /api/auth/logout
            code: CSRF_INVALID
    ValidationFailed:
      description: |
        Request validation failed. `errors` lists every invalid field (several at once).
        A malformed/unparseable JSON body also returns 400 with `code: MALFORMED_REQUEST`
        and no `errors` array.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: Validation failed
            instance: /api/auth/register
            code: VALIDATION_FAILED
            errors:
              - field: displayName
                code: REQUIRED
                message: Display name is required
              - field: email
                code: INVALID_EMAIL
                message: Enter a valid email address
              - field: password
                code: PASSWORD_LENGTH
                message: Password must be 8 to 72 characters

    TaskValidationFailed:
      description: |
        Request validation failed (`code: VALIDATION_FAILED`). `errors` lists every invalid field,
        at most one entry per field, sorted by field name. Possible entries:
        - `title` / `REQUIRED` / "Title is required" (missing, null, empty or blank after stripping)
        - `title` / `TOO_LONG` / "Title must be 200 characters or fewer"
        - `description` / `TOO_LONG` / "Description must be 2,000 characters or fewer"
        - `done` / `REQUIRED` / "Done or status is required" (PATCH only; neither `done` nor
          `status` sent, or both null. Changed in 0.10.0: PUT no longer requires `done`, and the
          message used to be "Done is required")
        - `status` / `STATUS_CONFLICT` / "Status and done don't match" (PUT and PATCH; both sent
          and `done != (status == DONE)`)
        - `dueTime` / `REQUIRES_DUE_DATE` / "A due time needs a due date" (PUT, 0.14.0; a
          non-null `dueTime` without a `dueDate`)
        - `reminder` / `REQUIRES_DUE_DATE` / "A reminder needs a due date" (PUT, 0.14.0; an offset
          other than `NONE` without a `dueDate`)
        - `reminder` / `INVALID_REMINDER` / "Reminder is not valid for this task" (PUT, 0.14.0;
          not one of the values, or does not fit a timed / date-only task)
        - `tags` (PUT only; at most one entry, the first rule that fails in this order):
          - `REQUIRED` / "Tags can't be blank" (an element is null, empty or blank after
            normalising)
          - `INVALID_CHARACTERS` / "Tags can't contain commas or control characters"
          - `TOO_LONG` / "Tags must be 30 characters or fewer" (after normalising)
          - `TOO_MANY` / "A task can have at most 10 tags" (more than 10 after removing
            duplicates)
          - `TAG_LIMIT` / "A list can have at most 200 tags" (the task's list, or on a move the
            target list, would have more than 200 different tags after this change; only
            checked when all other fields are valid and both the task and the target list
            exist, so it is then the only entry. Changed in 0.12.0: the limit was per user and
            the message was "You can have at most 200 tags")

        A body that is not valid JSON, or has a value of the wrong type or format (for example
        `dueDate: "2026-02-30"`, `dueDate: "10/08/2026"`, `done: "maybe"`, `priority: "URGENT"`,
        `status: "done"` (values are case-sensitive), `tags: "Work"`, `tags: [1]`,
        `listId: "abc"` or `listId: 1.5`), returns 400 with
        `code: MALFORMED_REQUEST`, `detail: "Malformed request body"` and **no** `errors` array.
        In that case field validation does not run.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Validation failed
                instance: /api/tasks
                code: VALIDATION_FAILED
                errors:
                  - field: description
                    code: TOO_LONG
                    message: Description must be 2,000 characters or fewer
                  - field: title
                    code: REQUIRED
                    message: Title is required
            malformed:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Malformed request body
                instance: /api/tasks/12
                code: MALFORMED_REQUEST
    MalformedTaskId:
      description: The `{id}` path segment is not an integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: Failed to convert 'id' with value 'abc'
            instance: /api/tasks/abc
            code: MALFORMED_REQUEST
    TaskNotFound:
      description: |
        No task with this id is in one of the signed-in user's lists (also when it belongs to
        someone else, or its list was deleted)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: Task not found
            instance: /api/tasks/42
            code: NOT_FOUND
    TaskOrListNotFound:
      description: |
        One of (the task is checked first):
        - `NOT_FOUND` (detail "Task not found"): no task with this id is in one of my lists.
        - `LIST_NOT_FOUND` (detail "List not found", 0.12.0): the task exists, but `listId` is
          not one of my lists (unknown, another user's, deleted meanwhile).
        Nothing was changed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            task:
              value:
                type: about:blank
                title: Not Found
                status: 404
                detail: Task not found
                instance: /api/tasks/42
                code: NOT_FOUND
            list:
              value:
                type: about:blank
                title: Not Found
                status: 404
                detail: List not found
                instance: /api/tasks/42
                code: LIST_NOT_FOUND
    ListNotFound:
      description: |
        New in 0.12.0. The list (path `{id}`, query `list` or body `listId`) is not one of the
        signed-in user's lists: unknown, deleted, another user's, or (query `list` only) not a
        plain integer. Identical body in every case; never 403. No `errors` array. Nothing was
        changed. 0.13.0: "the signed-in user's lists" = lists they are a member of; a list they
        left or were removed from is a 404 too.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: List not found
            instance: /api/lists/999999
            code: LIST_NOT_FOUND
    MalformedListId:
      description: The `{id}` path segment is not an integer (0.12.0)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: Failed to convert 'id' with value 'abc'
            instance: /api/lists/abc
            code: MALFORMED_REQUEST
    ListValidationFailed:
      description: |
        New in 0.12.0. One of:
        - `VALIDATION_FAILED` with exactly one entry for `name`:
          - `name` / `REQUIRED` / "Name is required" (missing, null, empty or blank after
            stripping)
          - `name` / `TOO_LONG` / "Name must be 100 characters or fewer"
        - `MALFORMED_REQUEST` (detail "Malformed request body", no `errors` array): the body is
          not valid JSON or `name` is not a string. On `PATCH` also a non-integer `{id}` (detail
          "Failed to convert 'id' with value 'abc'").
        Nothing was changed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Validation failed
                instance: /api/lists
                code: VALIDATION_FAILED
                errors:
                  - field: name
                    code: REQUIRED
                    message: Name is required
            malformed:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Malformed request body
                instance: /api/lists
                code: MALFORMED_REQUEST
    ListLimit:
      description: |
        New in 0.12.0. The user already owns 50 lists ("My tasks" included). Nothing was
        created. No `errors` array.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: You can have at most 50 lists
            instance: /api/lists
            code: LIST_LIMIT
    PersonalList:
      description: |
        New in 0.12.0. The list is the user's personal list ("My tasks"), which can't be
        deleted. Nothing was deleted. No `errors` array.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: Your personal list can't be deleted
            instance: /api/lists/3
            code: PERSONAL_LIST

    OwnerOnly:
      description: |
        New in 0.13.0. The caller is a member of the list but not its owner, and only the owner
        may do this. (A non-member gets 404 `LIST_NOT_FOUND` instead, never this.) Nothing was
        changed. No `errors` array.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: Only the list owner can do this
            instance: /api/lists/21/invitations
            code: OWNER_ONLY
    CsrfOrOwnerOnly:
      description: |
        One of:
        - `CSRF_INVALID`: missing or invalid CSRF token (see "CSRF").
        - `OWNER_ONLY` (0.13.0): the caller is a member of the list but not its owner. A
          non-member gets 404 `LIST_NOT_FOUND` instead, never this.
        Nothing was changed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            ownerOnly:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                detail: Only the list owner can do this
                instance: /api/lists/21
                code: OWNER_ONLY
            csrf:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                detail: Invalid or missing CSRF token
                instance: /api/lists/21
                code: CSRF_INVALID
    MalformedSharingId:
      description: |
        New in 0.13.0. A path id (`{id}`, `{userId}` or `{invitationId}`) is not an integer.
        Nothing was changed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: Failed to convert 'userId' with value 'abc'
            instance: /api/lists/8/members/abc
            code: MALFORMED_REQUEST
    MalformedNotificationId:
      description: New in 0.14.0. The `{id}` path segment is not an integer. Nothing was changed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: Failed to convert 'id' with value 'abc'
            instance: /api/notifications/abc/read
            code: MALFORMED_REQUEST
    ListOrMemberNotFound:
      description: |
        New in 0.13.0. One of (the list is checked first):
        - `LIST_NOT_FOUND` (detail "List not found"): the caller is not a member of the list.
        - `MEMBER_NOT_FOUND` (detail "Member not found"): `userId` is not a member of this list
          (never was, left, or was already removed).
        Nothing was changed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            list:
              value:
                type: about:blank
                title: Not Found
                status: 404
                detail: List not found
                instance: /api/lists/8/members/9
                code: LIST_NOT_FOUND
            member:
              value:
                type: about:blank
                title: Not Found
                status: 404
                detail: Member not found
                instance: /api/lists/8/members/9
                code: MEMBER_NOT_FOUND
    OwnerCannotLeave:
      description: |
        New in 0.13.0. The owner can't leave their own list or be removed from it (no ownership
        transfer); they can only delete it. Nothing was changed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: The owner can't leave the list
            instance: /api/lists/8/leave
            code: OWNER_CANNOT_LEAVE
    InvitationValidationFailed:
      description: |
        New in 0.13.0. One of:
        - `VALIDATION_FAILED` with exactly one entry for `email` (same rules as register: the
          value is trimmed and lowercased first), the first rule that fails:
          - `email` / `REQUIRED` / "Email is required" (missing, null, empty or blank)
          - `email` / `INVALID_EMAIL` / "Enter a valid email address"
          - `email` / `TOO_LONG` / "Email must be at most 254 characters"
        - `MALFORMED_REQUEST` (no `errors` array): the body is not valid JSON or `email` is not a
          string (detail "Malformed request body"), or `{id}` is not an integer (detail "Failed
          to convert 'id' with value 'abc'").
        Nothing was created.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Validation failed
                instance: /api/lists/8/invitations
                code: VALIDATION_FAILED
                errors:
                  - field: email
                    code: INVALID_EMAIL
                    message: Enter a valid email address
            malformed:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Malformed request body
                instance: /api/lists/8/invitations
                code: MALFORMED_REQUEST
    InvitationConflict:
      description: |
        New in 0.13.0. The invitation was refused and nothing was created (no email). No
        `errors` array; the client shows `detail` next to the email field. One of, in this
        check order:
        - `PERSONAL_LIST` / "Your personal list can't be shared" ("My tasks")
        - `ALREADY_MEMBER` / "This person is already a member of the list" (the address is a
          current member's, the owner's included)
        - `ALREADY_INVITED` / "This email address already has a pending invitation"
        - `MEMBER_LIMIT` / "A list can have at most 20 members"
        - `INVITATION_LIMIT` / "A list can have at most 20 pending invitations"
        `ALREADY_MEMBER` only ever concerns current members, whose emails the owner already
        sees in the members panel, so it reveals nothing about other accounts.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            personal:
              value:
                type: about:blank
                title: Conflict
                status: 409
                detail: Your personal list can't be shared
                instance: /api/lists/3/invitations
                code: PERSONAL_LIST
            alreadyMember:
              value:
                type: about:blank
                title: Conflict
                status: 409
                detail: This person is already a member of the list
                instance: /api/lists/8/invitations
                code: ALREADY_MEMBER
            alreadyInvited:
              value:
                type: about:blank
                title: Conflict
                status: 409
                detail: This email address already has a pending invitation
                instance: /api/lists/8/invitations
                code: ALREADY_INVITED
            memberLimit:
              value:
                type: about:blank
                title: Conflict
                status: 409
                detail: A list can have at most 20 members
                instance: /api/lists/8/invitations
                code: MEMBER_LIMIT
            invitationLimit:
              value:
                type: about:blank
                title: Conflict
                status: 409
                detail: A list can have at most 20 pending invitations
                instance: /api/lists/8/invitations
                code: INVITATION_LIMIT
    NotificationNotFound:
      description: |
        New in 0.14.0. The id is unknown or belongs to another user (identical body).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: Notification not found
            instance: /api/notifications/41/read
            code: NOTIFICATION_NOT_FOUND
    InviteRateLimited:
      description: |
        New in 0.13.0. Too many invitations by this user (default 30 per hour, see "Rate
        limiting"). Wait `Retry-After` seconds. Nothing was created.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            detail: Too many attempts. Please try again later.
            instance: /api/lists/8/invitations
            code: RATE_LIMITED
    ListOrInvitationNotFound:
      description: |
        New in 0.13.0. One of (the list is checked first):
        - `LIST_NOT_FOUND` (detail "List not found"): the caller is not a member of the list.
        - `INVITATION_NOT_FOUND` (detail "This invitation is no longer valid"): no such
          invitation on this list (already accepted, declined or cancelled, or never existed).
        Nothing was changed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            list:
              value:
                type: about:blank
                title: Not Found
                status: 404
                detail: List not found
                instance: /api/lists/8/invitations/31
                code: LIST_NOT_FOUND
            invitation:
              value:
                type: about:blank
                title: Not Found
                status: 404
                detail: This invitation is no longer valid
                instance: /api/lists/8/invitations/31
                code: INVITATION_NOT_FOUND
    InvitationNotFound:
      description: |
        New in 0.13.0. "This invitation is no longer valid": the id is unknown, not an
        invitation to my email, my email is not verified, it expired, was cancelled, declined or
        already accepted, or its list was deleted. Identical body in every case. Nothing was
        changed; the client shows the detail and reloads `GET /api/invitations`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: This invitation is no longer valid
            instance: /api/invitations/31/accept
            code: INVITATION_NOT_FOUND
    MemberLimit:
      description: |
        New in 0.13.0. The list already has 20 members. Nothing was changed and the invitation is
        kept (it can be accepted if the owner removes someone before it expires).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: A list can have at most 20 members
            instance: /api/invitations/31/accept
            code: MEMBER_LIMIT

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: UP

    User:
      type: object
      description: Never contains the password or its hash, nor any Google token or id.
      required: [id, email, displayName, emailVerified, hasPassword, connections, role, timeZone, reminderEmails]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          description: Normalized (trimmed, lowercase)
          example: bob@example.com
        displayName:
          type: string
          example: Bob
        emailVerified:
          type: boolean
          description: |
            New in 0.7.0, always present. `true` once the user confirmed their email (link from
            the confirmation email) or reset their password by email. `false` for new accounts
            and for accounts created before 0.7.0 that have not confirmed yet.
            0.8.0: always `true` for accounts created with Google; also set by connecting a
            Google account whose verified email equals the account email.
          example: true
        hasPassword:
          type: boolean
          description: |
            New in 0.8.0, always present. `false` for accounts created with Google that have not
            set a password yet (via "Forgot password?"). Such accounts can't sign in with a
            password, get 409 `PASSWORD_REQUIRED` on `PUT /api/account/password` and on
            disconnecting Google, and confirm `POST /api/account/delete` with `email`.
          example: true
        connections:
          type: array
          description: |
            New in 0.8.0, always present (empty array when none). At most one entry per
            provider. Listed even when the provider is currently not configured on the server.
          items:
            $ref: '#/components/schemas/Connection'
        role:
          $ref: '#/components/schemas/Role'
        timeZone:
          type: string
          nullable: true
          description: |
            New in 0.14.0, always present. My IANA time zone (e.g. `Europe/Bucharest`), or
            `null` until it is set (every account created before 0.14.0 starts with `null`).
            Drives when my due times count as overdue and when my reminders fire.
          example: Europe/Bucharest
        reminderEmails:
          type: boolean
          description: |
            New in 0.14.0, always present, default `true`. Whether a reminder also sends me an
            email (the in-app notification is always created).
          example: true

    Role:
      type: string
      description: |
        New in 0.9.0, always present on `User` and `AdminUser`. See "Roles". `ADMIN` and
        `SUPER_ADMIN` can use `/api/admin/**`. Show it as "User", "Admin", "Super admin".
      enum: [USER, ADMIN, SUPER_ADMIN]
      example: USER

    AssignableRole:
      type: string
      description: The roles `PUT /api/admin/users/{id}/role` can set (never `SUPER_ADMIN`).
      enum: [USER, ADMIN]
      example: ADMIN

    AdminUser:
      type: object
      description: |
        An account as shown on the admin page (0.9.0). Only these fields: never tasks, task
        counts, passwords, hashes or Google ids.
      required: [id, email, displayName, createdAt, emailVerified, googleConnected, role, disabled]
      properties:
        id:
          type: integer
          format: int64
          example: 42
        email:
          type: string
          format: email
          example: alice@example.com
        displayName:
          type: string
          example: Alice
        createdAt:
          type: string
          format: date-time
          description: When the account was created. Same format as `Task.createdAt`.
          example: '2026-10-15T09:12:44.123456Z'
        emailVerified:
          type: boolean
          description: Same as `User.emailVerified`.
          example: true
        googleConnected:
          type: boolean
          description: Whether a Google account is connected.
          example: false
        role:
          $ref: '#/components/schemas/Role'
        disabled:
          type: boolean
          description: '`true` while an admin has disabled the account ("Disabled"), else "Active".'
          example: false

    AdminUserPage:
      type: object
      description: One page of `GET /api/admin/users` (0.9.0).
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          description: At most `size` accounts; empty when nothing matches or `page` is past the end.
          items:
            $ref: '#/components/schemas/AdminUser'
        page:
          type: integer
          format: int32
          description: The requested zero-based page number.
          example: 0
        size:
          type: integer
          format: int32
          description: The requested page size.
          example: 20
        totalElements:
          type: integer
          format: int64
          description: Number of matching accounts on all pages.
          example: 2
        totalPages:
          type: integer
          format: int32
          description: |
            Number of pages (`ceil(totalElements / size)`); 0 when nothing matches. The client
            shows "Page {page + 1} of {max(totalPages, 1)}".
          example: 1

    ChangeRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/AssignableRole'

    Connection:
      type: object
      description: An external sign-in account connected to this user.
      required: [provider, email]
      properties:
        provider:
          type: string
          enum: [google]
          example: google
        email:
          type: string
          format: email
          description: |
            The provider account's email as of its latest sign-in or connect (lowercased). May
            differ from the user's own `email`. For display only ("Google: connected as ...").
          example: bob@gmail.com

    Providers:
      type: object
      required: [google]
      properties:
        google:
          type: boolean
          description: Whether "Sign in with Google" is configured on the server.
          example: true

    GoogleStartForm:
      type: object
      description: Form fields of `POST /api/auth/oauth2/authorization/google`.
      required: [_csrf]
      properties:
        intent:
          type: string
          enum: [login, connect]
          default: login
          description: |
            `login`: sign in or sign up (from `/login` and `/register`). `connect`: connect
            Google to the signed-in account (from `/account`). Any other value fails the flow
            (`/login?oauth=google_failed`) without visiting Google.
        _csrf:
          type: string
          description: The current raw `XSRF-TOKEN` cookie value.

    OAuthResult:
      type: string
      description: |
        Value of the `oauth` query parameter the callback appends to the frontend route (see
        "Sign in with Google"). A successful login goes to `/tasks` with no parameter.
        - `google_failed` (on `/login`): "Google sign-in was cancelled or failed. Please try
          again."
        - `google_unverified` (on `/login`): "Google hasn't confirmed this email address, or it
          belongs to an account that isn't connected yet. Sign in with your email and password, or
          create an account."
        - `google_connected` (on `/account`): "Google connected"
        - `google_in_use` (on `/account`): "This Google account is already connected to another
          account."
        - `google_connect_failed` (on `/account`): "Couldn't connect Google. Please try again."
        - `account_disabled` (on `/login`, new in 0.9.0): "This account has been disabled."
        Unknown values must be ignored by the frontend.
      enum: [google_failed, google_unverified, google_connected, google_in_use, google_connect_failed, account_disabled]

    TokenRequest:
      type: object
      description: |
        Body of `POST /api/auth/verify-email` and `POST /api/auth/check-reset-token`. A missing,
        null, blank or non-matching `token` gives 400 `TOKEN_INVALID` (never `VALIDATION_FAILED`).
      properties:
        token:
          type: string
          description: The `token` query parameter of the emailed link, unchanged. Opaque.
          example: 3q2-7wWQkR0Yf1m4m0cR9pXzA8b6s1oVqWw2Jt5uLkE

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: |
            Trimmed and lowercased; must be non-blank (`REQUIRED`), a valid email
            (`INVALID_EMAIL`) and at most 254 characters (`TOO_LONG`), same rules as register.
            Matched against accounts ignoring letter case and accents.
          example: bob@example.com

    ResetPasswordRequest:
      type: object
      required: [newPassword]
      description: |
        `token` is checked first: missing, null, blank or invalid gives 400 `TOKEN_INVALID`.
        Only with a valid token is `newPassword` validated.
      properties:
        token:
          type: string
          description: The `token` query parameter of the emailed reset link, unchanged. Opaque.
          example: Zr0b1y6p6eS4lJx3n9QhVt2Kc7aWm5dUo8fXg1iHsNk
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: |
            Same rules as `RegisterRequest.password`: non-blank (`REQUIRED`), 8-72 characters
            AND at most 72 UTF-8 bytes (`PASSWORD_LENGTH`), not trimmed.
          example: battery-staple-42

    RegisterRequest:
      type: object
      required: [displayName, email, password]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 50
          description: |
            Trimmed; must be 1-50 characters after trimming. Must be unique, ignoring letter case
            and accents (409 `DISPLAY_NAME_TAKEN`). Stored with the casing the user typed.
          example: Bob
        email:
          type: string
          format: email
          maxLength: 254
          description: |
            Trimmed and lowercased; must be a valid email, max 254 characters. Must be unique,
            ignoring letter case and accents (409 `EMAIL_TAKEN`).
          example: bob@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: |
            8-72 characters AND at most 72 bytes when UTF-8 encoded (BCrypt's limit; only matters
            for non-ASCII input). Not trimmed. Either violation returns `PASSWORD_LENGTH`.
          example: correct-horse

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: |
            Trimmed and lowercased; must be non-blank and a valid email. Matched ignoring letter
            case and accents.
          example: bob@example.com
        password:
          type: string
          format: password
          description: Must be non-blank. Length policy is NOT checked at login.
          example: correct-horse
        rememberMe:
          type: boolean
          default: false
          description: |
            Optional. `true` keeps this device signed in for 30 days (see "Remember me").
            Absent or `null` means `false`. A non-boolean value (e.g. `"maybe"`) returns 400
            `MALFORMED_REQUEST` with no `errors` array.
          example: true

    ChangeDisplayNameRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 50
          description: |
            Same rules as `RegisterRequest.displayName`: trimmed, then 1-50 characters. Unique among
            other accounts ignoring letter case and accents (409 `DISPLAY_NAME_TAKEN`). Stored with
            the casing the user typed.
          example: Bobby

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          description: |
            Must be non-blank (`REQUIRED`). Not trimmed. The length policy is NOT checked (like
            login); a wrong value is 400 `WRONG_PASSWORD`.
          example: correct-horse
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: |
            Same rules as `RegisterRequest.password`: non-blank, 8-72 characters AND at most 72 UTF-8
            bytes, not trimmed. A violation returns `PASSWORD_LENGTH` (blank returns `REQUIRED`).
          example: battery-staple-42

    DeleteAccountRequest:
      type: object
      description: |
        Which field is used depends on the signed-in account (`User.hasPassword`); the other
        field is ignored if sent.
        - `hasPassword: true`: `password` is required. Sending only `email` gives 400
          `VALIDATION_FAILED` `password` / `REQUIRED` (unchanged behaviour).
        - `hasPassword: false`: `email` is required. Sending only `password` gives 400
          `VALIDATION_FAILED` `email` / `REQUIRED`.
        No field is required by the schema itself, since the server decides per account.
      properties:
        password:
          type: string
          format: password
          description: |
            Accounts with a password: the current password. Must be non-blank (`REQUIRED`). Not
            trimmed; the length policy is NOT checked. A wrong value is 400 `WRONG_PASSWORD`.
          example: correct-horse
        email:
          type: string
          description: |
            New in 0.8.0. Accounts without a password: the account's email (the `User.email`
            shown on `/account`). Trimmed; must be non-blank (`REQUIRED`). Compared like login:
            ignoring letter case and accents. Anything else is 400 `EMAIL_MISMATCH` (no format
            check, so a malformed value is simply a mismatch).
          example: bob@gmail.com

    Priority:
      type: string
      enum: [NONE, LOW, MEDIUM, HIGH]
      description: New in 0.10.0. Case-sensitive. `NONE` is the default (no badge).
      example: HIGH

    Status:
      type: string
      enum: [TODO, IN_PROGRESS, DONE]
      description: New in 0.10.0. Case-sensitive. `TODO` is the default. `DONE` if and only if `done` is true.
      example: IN_PROGRESS

    Tag:
      type: object
      required: [name]
      description: New in 0.10.0. One tag of one of the signed-in user's lists (`GET /api/tags`).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
          description: The stored spelling (the first one used in that list), already normalised.
          example: Work

    TaskPage:
      type: object
      description: New in 0.11.0. One page of `GET /api/tasks`.
      required: [items, total, nextCursor]
      properties:
        items:
          type: array
          maxItems: 50
          description: At most 50 tasks, in list order. Empty when nothing (more) matches.
          items:
            $ref: '#/components/schemas/Task'
        total:
          type: integer
          format: int64
          minimum: 0
          description: |
            Number of tasks of the list matching `filter` + `tag` + `q` on all pages, counted
            when this page was produced.
          example: 120
        nextCursor:
          type: string
          nullable: true
          description: |
            Opaque. Send back as `?cursor=` (with the same `list`, `filter`, `tag`, `q` and `sort`) for
            the next page. `null` on the last page. Always present. Base64url without padding
            (only `A-Z a-z 0-9 - _`), at most 1024 characters.

    TaskList:
      type: object
      description: |
        New in 0.12.0. One of the signed-in user's lists (`GET /api/lists`, `POST /api/lists`,
        `PATCH /api/lists/{id}`, 0.13.0: `POST /api/invitations/{id}/accept`). `role` and
        `memberCount` are new in 0.13.0. More fields may be added later; clients must ignore
        unknown fields.
      required: [id, name, personal, role, memberCount]
      properties:
        id:
          type: integer
          format: int64
          example: 8
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Stored stripped; never blank. Not unique.
          example: Home
        personal:
          type: boolean
          description: |
            `true` only for the user's "My tasks" (exactly one per user): renamable, can't be
            deleted, listed first, the default list.
          example: false
        role:
          $ref: '#/components/schemas/ListRole'
        memberCount:
          type: integer
          minimum: 1
          maximum: 20
          description: |
            New in 0.13.0. Number of members right now, the owner included (1 = not shared).
            "Added by" is shown only when it is 2 or more.
          example: 3

    ListRole:
      type: string
      enum: [OWNER, MEMBER]
      description: |
        New in 0.13.0. The signed-in user's role in a list (`TaskList.role`), or a member's role
        (`Member.role`). `OWNER`: the one who created it (never changes); can rename, delete,
        invite, cancel invitations and remove members. `MEMBER`: joined by accepting an
        invitation; can work with the tasks and tags and leave.
      example: OWNER

    Member:
      type: object
      description: New in 0.13.0. A member of a list (`GET /api/lists/{id}/members`).
      required: [userId, displayName, email, role, joinedAt]
      properties:
        userId:
          type: integer
          format: int64
          description: Use it with `DELETE /api/lists/{id}/members/{userId}`.
          example: 9
        displayName:
          type: string
          example: Bob
        email:
          type: string
          description: The member's account email. Shown only to members of this list.
          example: bob@example.com
        role:
          $ref: '#/components/schemas/ListRole'
        joinedAt:
          type: string
          format: date-time
          description: |
            When they became a member (the owner: when the list was created). Same format as
            `Task.createdAt`.
          example: '2026-10-19T10:12:30.5Z'

    ListInvitation:
      type: object
      description: |
        New in 0.13.0. A pending invitation as the list owner sees it
        (`GET` / `POST /api/lists/{id}/invitations`). Never says whether an account has the
        address.
      required: [id, email, invitedAt, expiresAt]
      properties:
        id:
          type: integer
          format: int64
          description: Use it with `DELETE /api/lists/{id}/invitations/{invitationId}`.
          example: 31
        email:
          type: string
          description: The invited address, trimmed and lowercased.
          example: carol@example.com
        invitedAt:
          type: string
          format: date-time
          description: When it was sent (or last refreshed). Same format as `Task.createdAt`.
          example: '2026-10-19T10:00:00Z'
        expiresAt:
          type: string
          format: date-time
          description: '`invitedAt` + 14 days. Same format as `Task.createdAt`.'
          example: '2026-11-02T10:00:00Z'

    MyInvitation:
      type: object
      description: |
        New in 0.13.0. A pending invitation as the invitee sees it (`GET /api/invitations`). Only
        the owner's display name and the list's name are shown (no emails, no members).
      required: [id, list, invitedBy, invitedAt, expiresAt]
      properties:
        id:
          type: integer
          format: int64
          description: Use it with `POST /api/invitations/{id}/accept` and `.../decline`.
          example: 31
        list:
          type: object
          required: [id, name]
          properties:
            id:
              type: integer
              format: int64
              example: 8
            name:
              type: string
              description: The list's current name.
              example: Home
        invitedBy:
          type: object
          required: [displayName]
          description: The list owner (only the owner can invite).
          properties:
            displayName:
              type: string
              description: The owner's current display name.
              example: Ana
        invitedAt:
          type: string
          format: date-time
          example: '2026-10-19T10:00:00Z'
        expiresAt:
          type: string
          format: date-time
          example: '2026-11-02T10:00:00Z'

    CreateInvitationRequest:
      type: object
      required: [email]
      description: New in 0.13.0. Body of `POST /api/lists/{id}/invitations`.
      properties:
        email:
          type: string
          maxLength: 254
          description: |
            Same rules as `RegisterRequest.email`: trimmed and lowercased first, then required
            (`REQUIRED`), a valid email address (`INVALID_EMAIL`) and at most 254 characters
            (`TOO_LONG`). Any address is accepted, whether or not it has an account.
          example: carol@example.com

    InvitationCount:
      type: object
      required: [count]
      description: New in 0.13.0. Body of `GET /api/invitations/count`.
      properties:
        count:
          type: integer
          minimum: 0
          description: My pending (not expired) invitations; 0 when my email is not verified.
          example: 2

    ReminderOffset:
      type: string
      enum: [AT_DUE, TEN_MINUTES, ONE_HOUR, ONE_DAY, ON_THE_DAY]
      description: |
        New in 0.14.0. When my reminder fires. `AT_DUE`: at the due time. `TEN_MINUTES` /
        `ONE_HOUR`: that long before it. `ONE_DAY`: the previous calendar day at the same time
        (timed task) or at 09:00 (date-only task). `ON_THE_DAY`: 09:00 on the due date
        (date-only task only). Timed tasks accept `AT_DUE`, `TEN_MINUTES`, `ONE_HOUR`,
        `ONE_DAY`; date-only tasks accept `ON_THE_DAY`, `ONE_DAY`. (`NONE` exists in requests
        only, to remove a reminder.)

    Notification:
      type: object
      required: [id, type, read, createdAt, late, title, dueDate, dueTime, taskId, listId]
      description: |
        New in 0.14.0. One in-app notification of mine. `title`, `dueDate` and `dueTime` are a
        snapshot taken when it fired: they do not change if the task is edited, and they stay
        after the task is deleted.
      properties:
        id:
          type: integer
          format: int64
          example: 41
        type:
          type: string
          enum: [REMINDER]
          example: REMINDER
        read:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
          description: When it fired, same format as `Task.createdAt`.
          example: '2026-10-21T06:30:01.120Z'
        late:
          type: boolean
          description: Fired more than 5 minutes after its fire time (e.g. the server was down).
          example: false
        title:
          type: string
          description: The task's title when the reminder fired.
          example: Buy milk
        dueDate:
          type: string
          format: date
          example: '2026-10-21'
        dueTime:
          type: string
          nullable: true
          example: '09:30'
        taskId:
          type: integer
          format: int64
          nullable: true
          description: |
            The task's id, or `null` when it was deleted or I am no longer a member of its list
            ("This task is no longer available").
          example: 12
        listId:
          type: integer
          format: int64
          nullable: true
          description: |
            The id of the list the task is in now (to open it: the frontend maps "My tasks" to
            `/tasks`), or `null` together with `taskId`.
          example: 3

    NotificationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Notification'
        nextCursor:
          type: string
          nullable: true
          description: |
            Opaque. Pass it back as `?cursor=` for the next page; `null` on the last page. It
            holds the position of the last item, so notifications arriving meanwhile never make
            a later page repeat or skip one.

    NotificationCount:
      type: object
      required: [count]
      description: New in 0.14.0. Body of `GET /api/notifications/count`.
      properties:
        count:
          type: integer
          minimum: 0
          description: My unread notifications.
          example: 3

    SetTimeZoneRequest:
      type: object
      required: [timeZone]
      properties:
        timeZone:
          type: string
          maxLength: 64
          description: |
            An IANA region id as known to Java (`Europe/Bucharest`, `America/New_York`, `UTC`),
            case-sensitive. Offsets (`+02:00`, `UTC+2`) and abbreviations (`EST`) → 400
            `timeZone` / `INVALID_TIME_ZONE`. Missing or blank → `REQUIRED`.
          example: Europe/Bucharest
        ifUnset:
          type: boolean
          nullable: true
          description: |
            Optional, default `false`. `true` → set it only if my zone is still empty (one atomic
            update, so two tabs or devices signing in at once cannot overwrite each other); if
            it is already set, nothing changes and the answer is still 200 with the current
            user. The client calls it with the browser's zone when `User.timeZone` is `null`.
          example: true

    SetReminderEmailsRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: Missing or `null` → 400 `enabled` / `REQUIRED`. Not a boolean → 400 `MALFORMED_REQUEST`.
          example: false

    TaskListDetails:
      description: |
        New in 0.12.0. `TaskList` plus its task count; only from `GET /api/lists/{id}`.
      allOf:
        - $ref: '#/components/schemas/TaskList'
        - type: object
          required: [taskCount]
          properties:
            taskCount:
              type: integer
              format: int64
              minimum: 0
              description: Number of tasks in the list right now, of every status (done included).
              example: 12

    CreateListRequest:
      type: object
      required: [name]
      description: New in 0.12.0. Body of `POST /api/lists`.
      properties:
        name:
          type: string
          maxLength: 100
          description: |
            Same rules as `CreateTaskRequest.title`, with a 100 limit: stripped (Java
            `String.strip()`) before validation; required, non-blank (`REQUIRED`); length
            (UTF-16 code units, `String.length()` / JS `.length`) after stripping 1-100
            (`TOO_LONG`). Duplicates allowed. Stored stripped, with the casing typed.
          example: Home

    RenameListRequest:
      type: object
      required: [name]
      description: New in 0.12.0. Body of `PATCH /api/lists/{id}`.
      properties:
        name:
          type: string
          maxLength: 100
          description: Same rules as `CreateListRequest.name`.
          example: Groceries

    Task:
      type: object
      required: [id, listId, addedBy, title, description, priority, status, tags, done, dueDate, dueTime, myReminder, myReminderPassed, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
          example: 12
        listId:
          type: integer
          format: int64
          description: New in 0.12.0, always present. The id of the list the task is in.
          example: 3
        addedBy:
          type: object
          nullable: true
          required: [displayName]
          description: |
            New in 0.13.0, always present. Who added the task: their current display name, also
            after they left the list or were removed from it. `null` when that account was
            deleted ("Added by a deleted user"). Never changes on edit or move. Clients show it
            only on lists with `memberCount` of 2 or more.
          properties:
            displayName:
              type: string
              example: Ana
          example:
            displayName: Ana
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Stored stripped; never blank.
          example: Buy milk
        description:
          type: string
          nullable: true
          maxLength: 2000
          description: Stored stripped; `null` when absent or blank (never an empty string).
          example: null
        priority:
          $ref: '#/components/schemas/Priority'
        status:
          $ref: '#/components/schemas/Status'
        tags:
          type: array
          maxItems: 10
          description: |
            New in 0.10.0. The task's tag names in its list's stored spelling, no duplicates,
            sorted alphabetically ignoring case and accents (see "Tags"). `[]` when none.
          items:
            type: string
            minLength: 1
            maxLength: 30
          example: [Errands, Home]
        done:
          type: boolean
          description: |
            Read-only mirror of `status == DONE` (kept for older clients; always equals it).
            Still accepted as input by `PUT` and `PATCH`, see there.
          example: false
        dueDate:
          type: string
          format: date
          nullable: true
          description: |
            Calendar date `YYYY-MM-DD` with no time and no timezone. Returned exactly as stored;
            the server never converts it.
          example: '2026-10-10'
        dueTime:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: |
            New in 0.14.0, always present. Wall-clock time `HH:mm` (24-hour) of the due date, or
            `null` (date-only task, the only kind before 0.14.0). Never non-null when `dueDate`
            is `null`. Same time for every member; it is that clock time in each member's own
            time zone. Returned exactly as stored.
          example: '09:30'
        myReminder:
          allOf:
            - $ref: '#/components/schemas/ReminderOffset'
          nullable: true
          description: |
            New in 0.14.0, always present. MY reminder on this task, or `null`. Other members'
            reminders are never exposed.
        myReminderPassed:
          type: boolean
          description: |
            New in 0.14.0, always present. `true` when I have a reminder and its fire time is
            not in the future (it already fired, was dropped, or was saved in the past and will
            never fire); `false` otherwise, including when `myReminder` is `null`. The dialog
            shows "This reminder time has passed".
          example: false
        createdAt:
          type: string
          format: date-time
          description: |
            ISO-8601 instant in UTC with a `Z` suffix. Fractional seconds are optional and have
            variable precision (0-6 digits), e.g. `2026-10-08T09:15:02Z` or `2026-10-08T09:15:02.123456Z`.
          example: '2026-10-08T09:15:02.123456Z'
        updatedAt:
          type: string
          format: date-time
          description: Same format as `createdAt`. Equals `createdAt` on creation; set to now on every PUT/PATCH.
          example: '2026-10-08T09:15:02.123456Z'

    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
          description: |
            Stripped (Java `String.strip()`) before validation. Required: must be non-blank.
            Length (UTF-16 code units, i.e. `String.length()` / JS `.length`) after stripping: 1-200.
          example: Buy milk
        description:
          type: string
          nullable: true
          maxLength: 2000
          description: Optional. Stripped; blank becomes `null`. At most 2000 characters after stripping.
          example: null
        dueDate:
          type: string
          format: date
          nullable: true
          description: Optional `YYYY-MM-DD`. Past dates are allowed. An invalid date returns 400 `MALFORMED_REQUEST`.
          example: '2026-10-10'
        listId:
          type: integer
          format: int64
          nullable: true
          description: |
            New in 0.12.0. Optional: the list to create the task in; missing or `null` → "My
            tasks". Not one of my lists → 404 `LIST_NOT_FOUND`. Not an integer → 400
            `MALFORMED_REQUEST`.
          example: 8

    ReplaceTaskRequest:
      type: object
      required: [title]
      description: |
        Clients should always send `title`, `description` and `dueDate`; `description` and
        `dueDate` may be `null`, and null or omitted clears them. `priority`, `status`, `done` and
        `tags` are optional: missing or `null` leaves them unchanged (see `PUT /api/tasks/{id}`
        for how `status` and `done` combine). New clients should send `status` and not `done`.
        Changed in 0.10.0: `done` is no longer required. `listId` (0.12.0) is optional too:
        missing or `null` leaves the task in its list; another of my lists moves it.
      properties:
        title:
          type: string
          maxLength: 200
          description: Same rules as `CreateTaskRequest.title`.
          example: Buy oat milk
        description:
          type: string
          nullable: true
          maxLength: 2000
          description: Same rules as `CreateTaskRequest.description`. `null` clears it.
          example: null
        dueDate:
          type: string
          format: date
          nullable: true
          description: '`YYYY-MM-DD` or `null` (clears it). Past dates are allowed.'
          example: null
        dueTime:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: |
            New in 0.14.0. `HH:mm`. Missing → unchanged; `null` → cleared; a value → set. Needs a
            `dueDate` (400 `dueTime` / `REQUIRES_DUE_DATE`). See `PUT /api/tasks/{id}`.
          example: '09:30'
        reminder:
          type: string
          nullable: true
          enum: [AT_DUE, TEN_MINUTES, ONE_HOUR, ONE_DAY, ON_THE_DAY, NONE, null]
          description: |
            New in 0.14.0. MY reminder. Missing/`null` → unchanged; `NONE` → removed; otherwise
            the offset (timed task: `AT_DUE`, `TEN_MINUTES`, `ONE_HOUR`, `ONE_DAY`; date-only
            task: `ON_THE_DAY`, `ONE_DAY`). Needs a `dueDate` (400 `reminder` /
            `REQUIRES_DUE_DATE`); wrong for the task type or unknown → 400 `reminder` /
            `INVALID_REMINDER`.
          example: ONE_HOUR
        priority:
          allOf:
            - $ref: '#/components/schemas/Priority'
          nullable: true
          description: Optional; missing or `null` → unchanged.
        status:
          allOf:
            - $ref: '#/components/schemas/Status'
          nullable: true
          description: Optional; missing or `null` → unchanged (unless `done` is sent).
        done:
          type: boolean
          nullable: true
          description: |
            Optional (was required before 0.10.0); missing or `null` → unchanged. `true` → status
            `DONE`; `false` → a `DONE` task becomes `TODO`, others keep their status. Sent
            together with `status`, it must agree with it, else `status` / `STATUS_CONFLICT`.
          example: false
        tags:
          type: array
          nullable: true
          description: |
            Optional; missing or `null` → unchanged. Otherwise the complete new list of tag
            names (`[]` removes all). See "Tags" for normalising, matching and limits. With a
            move (`listId`), these are the task's tags in the target list.
          items:
            type: string
          example: [Errands, Home]
        listId:
          type: integer
          format: int64
          nullable: true
          description: |
            New in 0.12.0. Optional; missing, `null` or the task's current list → the task stays
            in its list. Another of my lists → the task moves there (see `PUT /api/tasks/{id}`,
            "Moving"). Not one of my lists → 404 `LIST_NOT_FOUND`, nothing changes. Not an
            integer → 400 `MALFORMED_REQUEST`.
          example: 8

    SetTaskDoneRequest:
      type: object
      description: |
        At least one of `done` and `status` (neither, or both null → `done` / `REQUIRED`). Both
        sent → they must agree (`status` / `STATUS_CONFLICT`). Name kept for compatibility; it
        also sets the status since 0.10.0.
      properties:
        done:
          type: boolean
          nullable: true
          description: |
            The new value (set, not toggled). `true` → status `DONE`; `false` → a `DONE` task
            becomes `TODO`, `TODO` / `IN_PROGRESS` are left as they are.
          example: true
        status:
          allOf:
            - $ref: '#/components/schemas/Status'
          nullable: true
          description: New in 0.10.0. The new status (set, not toggled); `done` follows it.

    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          enum: [displayName, email, password, currentPassword, newPassword, title, description, done, status, tags, q, page, size, role, cursor, name, dueTime, reminder, timeZone, enabled, limit]
          description: |
            Name of the request field (exactly as in the request body, or the query parameter).
            `status` and `tags` are new in 0.10.0; a `tags` error refers to the whole array,
            never to an index. `cursor` is new in 0.11.0 (`GET /api/tasks`). `name` is new in
            0.12.0 (`POST /api/lists`, `PATCH /api/lists/{id}`). `email` is also used by
            `POST /api/lists/{id}/invitations` (0.13.0). `dueTime` and `reminder` (`PUT
            /api/tasks/{id}`), `timeZone` (`PUT /api/account/time-zone`), `enabled`
            (`PUT /api/account/reminder-emails`) and `limit` (`GET /api/notifications`) are new in
            0.14.0.
        code:
          type: string
          enum: [REQUIRED, INVALID_EMAIL, TOO_LONG, PASSWORD_LENGTH, EMAIL_TAKEN, DISPLAY_NAME_TAKEN, WRONG_PASSWORD, EMAIL_MISMATCH, OUT_OF_RANGE, INVALID_ROLE, INVALID_CHARACTERS, TOO_MANY, TAG_LIMIT, STATUS_CONFLICT, INVALID_CURSOR, REQUIRES_DUE_DATE, INVALID_REMINDER, INVALID_TIME_ZONE]
          description: |
            Stable machine-readable reason.
            - REQUIRED: missing, null, empty or blank (for `tags`: an element is; for `done` on
              PATCH: neither `done` nor `status` was sent)
            - INVALID_EMAIL: not a valid email address
            - TOO_LONG: displayName > 50, email > 254, title > 200 or description > 2000 characters,
              or the admin search `q` > 100 characters after trimming, or (0.10.0) a tag > 30
              characters after normalising, or (0.11.0) the task search `q` of `GET /api/tasks`
              > 100 characters after trimming, or (0.12.0) a list `name` > 100 characters after
              stripping
            - INVALID_CURSOR: (new in 0.11.0, field `cursor` of `GET /api/tasks`) the cursor
              cannot be read or was issued for a different list (0.12.0), `filter`, `tag`, `q`
              or `sort`; reload from the first page
            - REQUIRES_DUE_DATE: (new in 0.14.0, fields `dueTime` and `reminder` of
              `PUT /api/tasks/{id}`) a time or a reminder was sent without a `dueDate`
            - INVALID_REMINDER: (new in 0.14.0, field `reminder`) not one of the offsets, or an
              offset that does not fit the task (timed vs date-only)
            - INVALID_TIME_ZONE: (new in 0.14.0, field `timeZone`) not an IANA region id
            - OUT_OF_RANGE also: (0.14.0, `limit` of `GET /api/notifications`) not an integer
              1-50
            - INVALID_CURSOR also: (0.14.0, field `cursor` of `GET /api/notifications`) the
              cursor cannot be read
            - INVALID_CHARACTERS: (new in 0.10.0, field `tags`) a tag contains a comma or a
              control character
            - TOO_MANY: (new in 0.10.0, field `tags`) more than 10 different tags on one task
            - TAG_LIMIT: (new in 0.10.0, field `tags`) the list (on a move: the target list)
              would have more than 200 different tags (0.12.0: was per user)
            - STATUS_CONFLICT: (new in 0.10.0, field `status`) `status` and `done` both sent and
              they disagree
            - PASSWORD_LENGTH: password / newPassword not 8-72 characters, or over 72 UTF-8 bytes
              (`newPassword` on `PUT /api/account/password` and `POST /api/auth/reset-password`)
            - EMAIL_TAKEN: (409 only, field `email`) email already registered, ignoring letter
              case and accents
            - DISPLAY_NAME_TAKEN: (409 only, field `displayName`) display name already used by
              another account, compared after trimming, ignoring letter case and accents
            - WRONG_PASSWORD: (400 `WRONG_PASSWORD` only, field `currentPassword` on
              `PUT /api/account/password`, `password` on `POST /api/account/delete`) the password
              does not match the signed-in user's password
            - EMAIL_MISMATCH: (400 `EMAIL_MISMATCH` only, field `email` on
              `POST /api/account/delete` for accounts without a password, new in 0.8.0) the email
              does not match the signed-in user's email
            - OUT_OF_RANGE: (new in 0.9.0, `page` / `size` of `GET /api/admin/users`) `page` < 0,
              or `size` not 1-100
            - INVALID_ROLE: (new in 0.9.0, field `role` of `PUT /api/admin/users/{id}/role`)
              missing, null, `SUPER_ADMIN` or not one of `USER`, `ADMIN`
        message:
          type: string
          description: Human-readable English message, safe to display.

    Problem:
      type: object
      description: RFC 7807 problem detail with app extensions `code` and `errors`.
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Validation failed
        instance:
          type: string
          example: /api/auth/register
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - MALFORMED_REQUEST
            - EMAIL_TAKEN
            - DISPLAY_NAME_TAKEN
            - WRONG_PASSWORD
            - INVALID_CREDENTIALS
            - UNAUTHENTICATED
            - CSRF_INVALID
            - FORBIDDEN
            - NOT_FOUND
            - RATE_LIMITED
            - INTERNAL_ERROR
            - TOKEN_INVALID
            - ALREADY_VERIFIED
            - PASSWORD_REQUIRED
            - EMAIL_MISMATCH
            - ACCOUNT_DISABLED
            - CANNOT_MODIFY_SELF
            - INSUFFICIENT_ROLE
            - USER_NOT_FOUND
            - LIST_NOT_FOUND
            - LIST_LIMIT
            - PERSONAL_LIST
            - OWNER_ONLY
            - OWNER_CANNOT_LEAVE
            - MEMBER_NOT_FOUND
            - ALREADY_MEMBER
            - ALREADY_INVITED
            - MEMBER_LIMIT
            - INVITATION_LIMIT
            - INVITATION_NOT_FOUND
            - NOTIFICATION_NOT_FOUND
          description: |
            Stable machine-readable error code. On a register 409 it is `EMAIL_TAKEN` if the email
            is taken (even when the display name is taken too), otherwise `DISPLAY_NAME_TAKEN`.
            `WRONG_PASSWORD` (400) is only returned by `/api/account/*`: the password given to
            confirm the action is wrong. It is never 401.
            `TOKEN_INVALID` (400, new in 0.7.0): an emailed link token is invalid for any reason
            (verify-email, check-reset-token, reset-password). `ALREADY_VERIFIED` (409, new in
            0.7.0): only from `POST /api/account/resend-verification`.
            `PASSWORD_REQUIRED` (409, new in 0.8.0): the account has no password, from
            `PUT /api/account/password` and `DELETE /api/account/connections/google`.
            `EMAIL_MISMATCH` (400, new in 0.8.0): only from `POST /api/account/delete` for
            accounts without a password.
            New in 0.9.0: `ACCOUNT_DISABLED` (403 from `POST /api/auth/login` with the correct
            password; 401 on any protected endpoint when the session's account is disabled),
            `CANNOT_MODIFY_SELF` (409), `INSUFFICIENT_ROLE` (403) and `USER_NOT_FOUND` (404),
            only from `/api/admin/**`. `FORBIDDEN` (403) on `/api/admin/**` means the caller is
            not an admin.
            New in 0.12.0: `LIST_NOT_FOUND` (404) when a list (path `{id}`, query `list`, body
            `listId`) is not one of the signed-in user's lists (a missing task stays
            `NOT_FOUND`); `LIST_LIMIT` (409) from `POST /api/lists` at 50 owned lists;
            `PERSONAL_LIST` (409) from `DELETE /api/lists/{id}` on "My tasks".
            New in 0.13.0 (sharing): `OWNER_ONLY` (403) when a member (not a non-member, who
            gets 404) tries an owner-only action; `OWNER_CANNOT_LEAVE` (409) from leave or from
            removing the owner; `MEMBER_NOT_FOUND` (404) from removing someone who is not a
            member; `ALREADY_MEMBER`, `ALREADY_INVITED`, `MEMBER_LIMIT`, `INVITATION_LIMIT`
            (409) from inviting (`MEMBER_LIMIT` also from accepting); `INVITATION_NOT_FOUND`
            (404, detail "This invitation is no longer valid") from accept, decline and cancel.
            `PERSONAL_LIST` (409) also from inviting to "My tasks".
            New in 0.14.0: `NOTIFICATION_NOT_FOUND` (404, detail "Notification not found") from
            `POST /api/notifications/{id}/read` for an unknown id or another user's notification.
        errors:
          type: array
          description: |
            Present for VALIDATION_FAILED (400), WRONG_PASSWORD (400), EMAIL_MISMATCH (400),
            EMAIL_TAKEN (409) and DISPLAY_NAME_TAKEN (409) only. On a register 409 it has one entry per taken field, so
            EMAIL_TAKEN may also carry a `displayName` / `DISPLAY_NAME_TAKEN` entry. WRONG_PASSWORD
            has exactly one entry, and so has EMAIL_MISMATCH.
          items:
            $ref: '#/components/schemas/FieldError'

security:
  - sessionCookie: []
