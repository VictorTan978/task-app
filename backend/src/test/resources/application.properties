# Test-only. application.yml has no database defaults (secure by default), so the startup check
# (com.taskapp.config.RequiredSettingsCheck) needs values here. They are placeholders only: tests that use
# a database get the real connection from their Testcontainers @ServiceConnection, which takes precedence.
spring.datasource.url=jdbc:mysql://unused-in-tests/taskapp
spring.datasource.username=unused-in-tests
spring.datasource.password=unused-in-tests
