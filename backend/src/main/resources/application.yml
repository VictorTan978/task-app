spring:
  application:
    name: backend
  autoconfigure:
    # No in-memory user store; users live in the database (see com.taskapp.auth).
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    # Secure by default: no profile = production settings, so there are NO defaults here.
    # DB_USERNAME / DB_PASSWORD = the restricted app user (SELECT, INSERT, UPDATE, DELETE only).
    # DB_URL, DB_USERNAME, DB_PASSWORD, DB_MIGRATION_USERNAME and DB_MIGRATION_PASSWORD must be set, or startup fails naming the missing variable
    # (see com.taskapp.config.RequiredSettingsCheck). For local development use the dev profile
    # (application-dev.yml): SPRING_PROFILES_ACTIVE=dev.
    # Keep connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true in DB_URL: DATETIME(6) values
    # (and DB defaults) are UTC, so Instant round-trips exactly regardless of the JVM or server time zone.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
    # Least privilege: Flyway migrates with its own user (DDL rights); the datasource user above is data-only
    # (SELECT, INSERT, UPDATE, DELETE). Flyway opens its own connection to spring.datasource.url with these.
    # Required outside the dev profile (see com.taskapp.config.RequiredSettingsCheck).
    # See backend/docker/mysql-init/README.md.
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}

server:
  port: 8080
  # The app runs behind a TLS-terminating reverse proxy / load balancer. "native" installs Tomcat's
  # RemoteIpValve: for requests whose direct peer is a trusted proxy (internal-proxies below) it takes
  #   X-Forwarded-Proto -> request scheme / isSecure() (so https => HSTS header, no HTTPS redirect)
  #   X-Forwarded-For   -> request.getRemoteAddr() (the real client; used by the auth rate limiter)
  #   X-Forwarded-Port / X-Forwarded-Host -> the server port / host used in redirects
  # Headers from any other peer are ignored, so a client that reaches the app directly cannot spoof them.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Which direct peers are trusted as proxies: a Java regex matched against the peer IP.
      # Default = Tomcat/Spring Boot's own default: private and loopback ranges (10/8, 192.168/16,
      # 169.254/16, 127/8, 100.64/10, 172.16/12, ::1, fe80::/10, fc00::/7).
      # Override with TRUSTED_PROXIES, e.g. TRUSTED_PROXIES='10\.0\.0\.5|10\.0\.0\.6', to trust only the real
      # proxy. Do this whenever other machines on the same private network could reach the app directly.
      internal-proxies: '${TRUSTED_PROXIES:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|100\.6[4-9]{1}\.\d{1,3}\.\d{1,3}|100\.[7-9]{1}\d{1}\.\d{1,3}\.\d{1,3}|100\.1[0-1]{1}\d{1}\.\d{1,3}\.\d{1,3}|100\.12[0-7]{1}\.\d{1,3}\.\d{1,3}|172\.1[6-9]{1}\.\d{1,3}\.\d{1,3}|172\.2[0-9]{1}\.\d{1,3}\.\d{1,3}|172\.3[0-1]{1}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1|fe[89ab]\p{XDigit}:.*|f[cd]\p{XDigit}{2}+:.*}'
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        # Driven by app.security.require-https (REQUIRE_HTTPS); see below.
        secure: ${app.security.require-https}

app:
  security:
    # Secure by default (production): REQUIRE_HTTPS defaults to true. The dev profile sets it to false.
    # When true:
    #  - the JSESSIONID cookie, the XSRF-TOKEN cookie and the expiring cookie written on logout carry Secure
    #  - plain-HTTP requests are redirected (302) to https://<same host and path> (default port 443),
    #    except GET /api/health, so load-balancer health checks over plain HTTP keep working
    # Independent of this flag, Spring Security sends Strict-Transport-Security on every HTTPS response
    # (including requests the trusted proxy marks with X-Forwarded-Proto: https).
    require-https: ${REQUIRE_HTTPS:true}
  # Swagger UI + /v3/api-docs are off by default (on by default in the dev profile).
  # When enabled they are public. Never enable in production.
  api-docs-enabled: ${API_DOCS_ENABLED:false}
  # In-memory rate limits for POST /api/auth/login and /register, and for the current-password checks of
  # PUT /api/account/password and POST /api/account/delete (per app instance, reset on restart).
  # Over a limit the API answers 429 RATE_LIMITED with Retry-After. Env-var overrides:
  #   RATE_LIMIT_LOGIN_FAILURES_PER_EMAIL  failed logins per email within the window below (default 5)
  #   RATE_LIMIT_LOGIN_FAILURE_WINDOW      sliding window for those failures, e.g. 15m, 1h (default 15m)
  #   RATE_LIMIT_LOGIN_PER_IP_PER_MINUTE   login requests per client IP per minute (default 20)
  #   RATE_LIMIT_REGISTER_PER_IP_PER_HOUR  register requests per client IP per hour (default 5)
  #   RATE_LIMIT_PASSWORD_CHECK_FAILURES_PER_USER  wrong current passwords per signed-in user within the window
  #                                        below, one counter shared by change password and delete account (default 5)
  #   RATE_LIMIT_PASSWORD_CHECK_FAILURE_WINDOW     sliding window for those failures (default 15m)
  #   RATE_LIMIT_MAX_TRACKED_KEYS          emails/IPs/users kept per counter before the oldest are dropped (default 100000)
  # The e2e suite registers many users from 127.0.0.1, so raise the per-IP limits for e2e runs.
  rate-limit:
    login-failures-per-email: ${RATE_LIMIT_LOGIN_FAILURES_PER_EMAIL:5}
    login-failure-window: ${RATE_LIMIT_LOGIN_FAILURE_WINDOW:15m}
    login-per-ip-per-minute: ${RATE_LIMIT_LOGIN_PER_IP_PER_MINUTE:20}
    register-per-ip-per-hour: ${RATE_LIMIT_REGISTER_PER_IP_PER_HOUR:5}
    password-check-failures-per-user: ${RATE_LIMIT_PASSWORD_CHECK_FAILURES_PER_USER:5}
    password-check-failure-window: ${RATE_LIMIT_PASSWORD_CHECK_FAILURE_WINDOW:15m}
    max-tracked-keys: ${RATE_LIMIT_MAX_TRACKED_KEYS:100000}

springdoc:
  api-docs:
    enabled: ${app.api-docs-enabled}
  swagger-ui:
    enabled: ${app.api-docs-enabled}
