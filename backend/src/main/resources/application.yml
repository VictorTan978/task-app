spring:
  application:
    name: backend
  autoconfigure:
    # No in-memory user store; users live in the database (see com.taskapp.auth).
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    # Matches the "db" service in ../docker-compose.yml
    # connectionTimeZone=UTC + forceConnectionTimeZoneToSession: DATETIME(6) values (and DB defaults) are UTC,
    # so Instant round-trips exactly regardless of the JVM or server time zone.
    url: ${DB_URL:jdbc:mysql://localhost:3306/taskapp?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:taskapp}
    password: ${DB_PASSWORD:taskapp}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax

app:
  # Swagger UI + /v3/api-docs are off by default. Set API_DOCS_ENABLED=true for local dev
  # (they are then public). Never enable in production.
  api-docs-enabled: ${API_DOCS_ENABLED:false}

springdoc:
  api-docs:
    enabled: ${app.api-docs-enabled}
  swagger-ui:
    enabled: ${app.api-docs-enabled}
