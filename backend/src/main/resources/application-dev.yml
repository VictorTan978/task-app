# LOCAL DEVELOPMENT ONLY. Activate with SPRING_PROFILES_ACTIVE=dev
#   e.g. cd backend && SPRING_PROFILES_ACTIVE=dev ./mvnw spring-boot:run
# Never activate this profile in production: it contains the docker-compose dev password.
# Without a profile the app uses production settings (application.yml) and requires
# DB_URL, DB_USERNAME and DB_PASSWORD to be set.
spring:
  datasource:
    # Matches the "db" service in ../docker-compose.yml. Env vars still override these defaults.
    url: ${DB_URL:jdbc:mysql://localhost:3306/taskapp?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:taskapp}
    password: ${DB_PASSWORD:taskapp}

app:
  # Swagger UI + /v3/api-docs on by default in dev (set API_DOCS_ENABLED=false to turn them off).
  api-docs-enabled: ${API_DOCS_ENABLED:true}
  security:
    # Plain http://localhost: no Secure cookies and no redirect to HTTPS (production default is true).
    # Deliberately not read from REQUIRE_HTTPS, so a production value of that variable can't break local
    # runs. To try the production behaviour locally, set APP_SECURITY_REQUIREHTTPS=true.
    require-https: false
