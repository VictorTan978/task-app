@for (group of groups(); track group.key) {
  <ul
    class="task-list sort-list"
    cdkDropList
    [cdkDropListDisabled]="disabled()"
    [attr.aria-label]="group.label"
    [attr.data-testid]="'sort-group-' + group.key"
    (cdkDropListDropped)="onDrop($event)"
  >
    @for (task of group.items; track task.id) {
      <li
        class="task-list__item sort-list__item"
        cdkDrag
        [cdkDragData]="task"
        [cdkDragDisabled]="disabled()"
        [class.sort-list__item--picked]="picked()?.id === task.id"
        (cdkDragStarted)="onDragStarted()"
        (cdkDragMoved)="onDragMoved($event)"
        (cdkDragEnded)="onDragEnded()"
      >
        <button
          type="button"
          class="sort-list__handle"
          cdkDragHandle
          data-testid="drag-handle"
          [attr.data-handle-for]="task.id"
          [attr.aria-label]="'Reorder: ' + task.title"
          [attr.aria-pressed]="picked()?.id === task.id"
          aria-describedby="sort-list-help"
          [disabled]="disabled() && picked()?.id !== task.id"
          (keydown)="onHandleKey($event, task)"
          (blur)="onHandleBlur($event, task)"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <circle cx="9" cy="6" r="1.6" />
            <circle cx="15" cy="6" r="1.6" />
            <circle cx="9" cy="12" r="1.6" />
            <circle cx="15" cy="12" r="1.6" />
            <circle cx="9" cy="18" r="1.6" />
            <circle cx="15" cy="18" r="1.6" />
          </svg>
        </button>
        <app-task-row
          class="sort-list__row"
          [task]="task"
          [today]="today()"
          [time]="time()"
          [busy]="busyIds().has(task.id)"
          [showAddedBy]="showAddedBy()"
          [reorderable]="true"
          [canMoveUp]="!disabled() && group.items[0].id !== task.id"
          [canMoveDown]="!disabled() && group.items[group.items.length - 1].id !== task.id"
          (doneChange)="doneChange.emit({ task, done: $event })"
          (edit)="edit.emit(task)"
          (remove)="remove.emit(task)"
          (moveUp)="moveBy(task, -1)"
          (moveDown)="moveBy(task, 1)"
        />
      </li>
    }
  </ul>
}
<p id="sort-list-help" class="sort-list__help">
  Drag the grip, or press Space on it, then the up and down arrow keys, then Space to drop.
</p>
