<main class="auth-page">
  <section class="auth-card" aria-labelledby="forgot-password-title">
    <app-auth-brand />
    <h1 id="forgot-password-title">Forgot password</h1>

    @if (sent()) {
      <p class="notice notice--info" role="status" data-testid="reset-link-sent">
        {{ sentMessage }}
      </p>
    } @else {
      @if (banner(); as message) {
        <p class="notice notice--error" role="alert">{{ message }}</p>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="field">
          <label for="forgot-email">Email</label>
          <input
            id="forgot-email"
            type="email"
            formControlName="email"
            autocomplete="email"
            [attr.aria-invalid]="error() ? true : null"
            [attr.aria-describedby]="error() ? 'forgot-email-error' : null"
          />
          @if (error(); as message) {
            <p class="field-error" id="forgot-email-error">{{ message }}</p>
          }
        </div>

        <button
          type="submit"
          class="btn btn--primary"
          [disabled]="pending()"
          [attr.aria-busy]="pending()"
        >
          @if (pending()) {
            <span class="spinner" aria-hidden="true" data-testid="spinner"></span>
          }
          Send reset link
        </button>
      </form>
    }

    <p class="auth-switch">Remembered it? <a routerLink="/login">Sign in</a></p>
  </section>
</main>
