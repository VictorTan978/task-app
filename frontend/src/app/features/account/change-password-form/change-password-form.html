<form class="account-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  @if (banner(); as message) {
    <p class="notice notice--error" role="alert">{{ message }}</p>
  }

  <div class="field">
    <label for="account-current-password">Current password</label>
    <app-password-field>
      <input
        id="account-current-password"
        type="password"
        formControlName="currentPassword"
        autocomplete="current-password"
        [attr.aria-invalid]="error('currentPassword') ? true : null"
        [attr.aria-describedby]="error('currentPassword') ? 'account-current-password-error' : null"
      />
    </app-password-field>
    @if (error('currentPassword'); as message) {
      <p class="field-error" id="account-current-password-error">{{ message }}</p>
    }
  </div>

  <div class="field">
    <label for="account-new-password">New password</label>
    <app-password-field>
      <input
        id="account-new-password"
        type="password"
        formControlName="newPassword"
        autocomplete="new-password"
        [attr.aria-invalid]="error('newPassword') ? true : null"
        [attr.aria-describedby]="
          error('newPassword') ? 'account-new-password-error' : 'account-new-password-hint'
        "
      />
    </app-password-field>
    @if (error('newPassword'); as message) {
      <p class="field-error" id="account-new-password-error">{{ message }}</p>
    } @else {
      <p class="field-hint" id="account-new-password-hint">{{ hint }}</p>
    }
  </div>

  <div class="field">
    <label for="account-confirm-password">Confirm new password</label>
    <app-password-field>
      <input
        id="account-confirm-password"
        type="password"
        formControlName="confirmPassword"
        autocomplete="new-password"
        [attr.aria-invalid]="confirmError() ? true : null"
        [attr.aria-describedby]="confirmError() ? 'account-confirm-password-error' : null"
      />
    </app-password-field>
    @if (confirmError(); as message) {
      <p class="field-error" id="account-confirm-password-error">{{ message }}</p>
    }
  </div>

  <div class="account-form__actions">
    <button
      type="submit"
      class="btn btn--primary"
      [disabled]="pending()"
      [attr.aria-busy]="pending()"
    >
      @if (pending()) {
        <span class="spinner" aria-hidden="true" data-testid="spinner"></span>
      }
      Change password
    </button>
    <p class="account-form__status" role="status">{{ status() }}</p>
  </div>
</form>
