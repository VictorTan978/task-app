<dialog
  #dialog
  class="dialog dialog--narrow"
  aria-labelledby="logout-others-heading"
  aria-describedby="logout-others-text"
  (cancel)="onCancel($event)"
>
  <h2 id="logout-others-heading" class="dialog__title">Log out all other devices?</h2>

  <div class="account-form">
    <p id="logout-others-text">
      You'll be signed out everywhere else, including devices where you chose "Remember me". You
      stay signed in on this device.
    </p>

    @if (banner(); as message) {
      <p class="notice notice--error" role="alert">{{ message }}</p>
    }

    <div class="dialog__actions">
      <button type="button" class="btn btn--secondary" [disabled]="pending()" (click)="cancel()">
        Cancel
      </button>
      <button
        id="logout-others-confirm"
        type="button"
        class="btn btn--primary"
        [disabled]="pending()"
        [attr.aria-busy]="pending()"
        (click)="confirm()"
      >
        @if (pending()) {
          <span class="spinner" aria-hidden="true" data-testid="spinner"></span>
        }
        Log out other devices
      </button>
    </div>
  </div>
</dialog>
